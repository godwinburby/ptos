# --------------------------------------------------
# PTOS PRESETS
# --------------------------------------------------
# Quick-add shortcuts for frequent records.
# Usage:  ptos --preset <name>
#         ptos --preset <name> field=value   (override a field)
#         ptos --preset <name> --date yesterday
# --------------------------------------------------

[presets.auto]
type     = "expense"
domain   = "self"
category = "transport"
amount   = 60
tag      = ["auto"]

[presets.bus]
type     = "expense"
domain   = "self"
category = "transport"
amount   = 30
tag      = ["bus"]

[presets.commute]
records = ["auto", "bus"]

[presets.cm]
alias = "commute"

[presets.snacks]
type     = "expense"
domain   = "home"
category = "household"
tag      = ["snacks"]
# amount omitted — will be prompted each time

[presets.snacks_work]
type     = "expense"
domain   = "work"
category = "staff_welfare"
tag      = ["snacks"]
# amount omitted — will be prompted each time

[presets.snacksw]
alias = "snacks_work"

[presets.petrol]
type     = "expense"
domain   = "self"
category = "transport"
amount   = 200
tag      = ["petrol"]

[presets.bakery]
type     = "expense"
domain   = "home"
category = "household"
tag      = ["bakery", "snacks"]
# amount omitted — will be prompted each time

[presets.maid]
type     = "expense"
domain   = "home"
category = "child"
tag      = ["maid"]


[presets.mom_medicine]
type     = "expense"
domain   = "home"
category = "medical"
tag      = ["medicine", "mom"]

[presets.mmed]
alias = "mom_medicine"

[presets.porter]
type     = "expense"
domain   = "work"
category = "postage"
tag      = ["porter"]

[presets.fruits]
type     = "expense"
domain   = "home"
category = "grocery"
tag      = ["fruits"]

[presets.restaraunt]
type     = "expense"
domain   = "self"
category = "food"
amount   = 150
tag      = ["restaurant"]

[presets.rt]
alias = "restaraunt"


[presets.book]
type     = "expense"
domain   = "self"
category = "entertainment"
tag      = ["books"]


[presets.dessert]
type     = "expense"
domain   = "home"
category = "food"
tag      = ["dessert"]


[presets.lubimoist]
type     = "expense"
domain   = "self"
category = "medical"
amount   = 288
tag      = ["eye_drops", "medicine", "lubimoist"]

