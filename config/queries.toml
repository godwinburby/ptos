# --------------------------------------------------
# PTOS QUERIES
# --------------------------------------------------
# Usage:
#   ptos --query <n>                 run saved query
#   ptos --query <n> --time lm      override time (td yd tw lw tm lm tq lq ty ly)
#   ptos --query                     list all
# --------------------------------------------------

# --------------------------------------------------
# BASE QUERIES  (used by metrics and dashboards)
# --------------------------------------------------

[assessments]
where = "type=assessment"

[deferred]
where = "type=assessment AND outcome=deferred"

[prescriptions]
where = "type=prescription"

[followups]
where = "type=followup"

[binaural]
where = "type=prescription AND fit=binaural"

# --------------------------------------------------
# METRICS
# --------------------------------------------------

[metrics.prescription_ratio]
ratio = ["prescriptions", "assessments"]

[metrics.binaural_ratio]
ratio = ["binaural", "prescriptions"]

[metrics.asp]
avg          = "prescriptions"
unit_field   = "fit"
unit_weights = { monaural = 1, binaural = 2 }

[metrics.loss_ratio]
ratio = ["deferred", "assessments"]

[metrics.total_revenue]
sum = "prescriptions"

[metrics.highest_sale]
max = "prescriptions"

[metrics.lowest_sale]
min = "prescriptions"

[metrics.balance]
derived = "income - expense - investment"

[metrics.net_clinic]
derived = "total_revenue - expense_work"

[metrics.savings_rate]
derived = "balance / income * 100"
# --------------------------------------------------
# DASHBOARDS
# --------------------------------------------------

[dashboards.clinic]
metrics = [
  "assessments",
  "prescriptions",
  "loss_ratio",
  "prescription_ratio",
  "binaural_ratio",
  "total_revenue",
  "asp",
  "highest_sale",
  "lowest_sale"
]

[dashboards.personal]
metrics = [
  "income",
  "expense",
  "investment",
  "balance",
  "expense_today"
]

# --------------------------------------------------
# CLINIC QUERIES  (use --time lm / tq / lq to switch period)
# --------------------------------------------------

[rx]
alias= "prescriptions"

[ass]
alias = "assessments"

[flp]
alias = "followups"

# --------------------------------------------------
# EXPENSE QUERIES
# --------------------------------------------------

[expense]
where = "type=expense AND domain!=work"
time  = "tm"
sum   = true

[exp]
alias = "expense"

[expense_work]
where = "type=expense AND domain=work AND tag!=snacks"
time  = "clinic"
sum   = true

[expw]
alias = "expense_work"

[snacks_work]
where = "type=expense AND domain=work AND tag=snacks"
time  = "clinic"
sum   = true

[snacksw]
alias = "snacks_work"

[snacks]
where = "type=expense AND domain!=work AND tag=snacks"
time  = "tm"
sum   = true

[income]
where = "type=income" 

[investment]
where = "type=investment"

# --------------------------------------------------
# ANALYSIS  (use --time to change window)
# --------------------------------------------------

[funnel]
where  = "type=assessment"
time   = "tq"
pivot  = ["source", "outcome"]
count  = true

[rxmodels]
where = "type=prescription"
time  = "tq"
pivot = ["model", "source"]
sum   = true

[expense_category]
where = "type=expense AND domain!=work"
time  = "tm"
group = ["category"]
sum   = true

[expcat]
alias = "expense_category"
# --------------------------------------------------
# DUE CONFIG  (used by: ptos --due)
# --------------------------------------------------

[due]
type            = "followup"
key             = "client"
sort_by         = "intent"
days            = 7
exclude_results = ["fix_appointment", "deceased", "not_relevant", "another_provider"]
# intent priority order is defined in schema.toml:
# trial → decision → assessment → mgm

[transport]
where = "domain=self AND category=transport AND type=expense"
time  = "this-month"

[expense_today]
where = "type=expense AND domain!=work"
time  = "td"
group = ["tag"]
sum   = true

[exptag]
alias = "expense_today"

[auto]
where = "domain=self AND category=transport AND tag=auto AND type=expense"
time  = "this-month"

[bus]
where = "domain=self AND category=transport AND tag=bus AND type=expense"
time  = "this-month"

[autobus]
where = "domain=self AND category=transport AND (tag=auto OR tag=bus) AND type=expense"
time  = "this-month"


[investments]
where = "type=investment"
time  = "tm"

[assessment_cso]
where = "(type=assessment) AND (booked_by=cso)"
time  = "lm"
