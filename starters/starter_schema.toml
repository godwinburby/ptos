# --------------------------------------------------
# PTOS SCHEMA — Starter
# --------------------------------------------------
#
# Every type follows the same pattern:
#
#   required = ["field1", "field2"]
#
#   [type.X.fields.fieldname]
#   options = ["a", "b", "c"]               # flat list
#
#   [type.X.fields.fieldname]               # parent-dependent
#   parent = "other_field"
#   options.value1 = ["a", "b"]
#   options.value2 = ["c", "d"]
#
#   [type.X.tags.fieldname]                 # tags triggered by field value
#   options.value1 = ["tag_a", "tag_b"]
#
#   [type.X.conditions.fieldname]           # conditionally required field
#   when = { other_field = "value" }
#
# Edit this file to add your own types, fields, and options.
# Run  ptos --lint  to verify records still pass after changes.
# --------------------------------------------------

[types]
allowed = ["expense", "income", "investment", "exercise", "sleep", "mood", "learning"]

# --------------------------------------------------
# GLOBAL FIELD METADATA
# --------------------------------------------------

[fields.amount]
type         = "int"
dimension    = false
aggregatable = true

[fields.duration]
type         = "int"
dimension    = false
aggregatable = true

[fields.domain]
type      = "string"
dimension = true

[fields.category]
type      = "string"
dimension = true

[fields.tag]
type      = "string"
dimension = true
multi     = true

# --------------------------------------------------
# GLOBAL OPTIONAL FIELDS
# --------------------------------------------------
# These appear on EVERY record type — always optional.

[global_fields.context]
type     = "string"
linkable = true
options = ["home", "work", "travel", "outdoor"]

[global_fields.project]
type     = "string"
linkable = true
# no options = free-text entry

# ==================================================
# TYPES
# ==================================================

# ----------------------
# EXPENSE
# ----------------------

[type.expense]
required = ["domain", "category", "amount"]

[type.expense.fields.domain]
options = ["self", "home", "work"]

[type.expense.fields.category]
parent       = "domain"
options.self = [
    "food", "transport", "entertainment", "personal",
    "health", "education", "electronics", "charity",
    "travel", "utilities", "other",
]
options.home = [
    "food", "grocery", "rent", "utilities", "household",
    "maintenance", "clothing", "medical", "gift",
    "entertainment", "child", "other",
]
options.work = [
    "supplies", "travel", "meals", "equipment",
    "services", "courier", "maintenance", "other",
]

[type.expense.tags.category]
options.food        = ["snacks", "coffee", "restaurant", "delivery", "lunch", "dinner", "tea", "bakery", "dessert", "fruits"]
options.transport  = ["auto", "bus", "metro", "taxi", "rapido", "petrol", "uber", "water_metro"]
options.grocery    = ["vegetables", "milk", "rice", "essentials", "supermarket"]
options.entertainment = ["cinema", "book", "subscription", "app", "audible", "game", "liquor"]
options.utilities  = ["broadband", "recharge", "electricity", "water", "cable"]
options.medical    = ["medicine", "hospital", "consultation"]
options.child      = ["school", "tuition", "clothing", "toy", "haircut"]
options.maintenance = ["electrician", "plumber", "ac", "painting"]
options.clothing   = ["clothing", "footwear", "gift"]
options.gift       = ["birthday", "wedding", "festival"]
options.health     = ["gym", "supplement", "checkup"]
options.travel     = ["flight", "train", "hotel", "food"]
options.education  = ["book", "course", "fee", "supplies"]

# ----------------------
# INCOME
# ----------------------

[type.income]
required = ["source", "amount"]

[type.income.fields.source]
options = ["salary", "freelance", "business", "gift", "refund", "cashback", "other"]

[type.income.tags.source.options]
salary    = ["monthly", "bonus", "arrears"]
freelance = ["project", "consulting"]
business  = ["sale", "service"]
gift      = ["birthday", "festival"]
refund    = ["return", "cancellation"]

# ----------------------
# INVESTMENT
# ----------------------

[type.investment]
required = ["instrument", "provider", "amount"]

[type.investment.fields.instrument]
options = ["rd", "fd", "mutual_fund", "ppf", "stocks", "gold", "crypto", "other"]

[type.investment.fields.provider]
options = ["bank", "broker", "government", "app", "other"]

[type.investment.tags.instrument.options]
mutual_fund = ["sip", "lumpsum", "switch"]
stocks      = ["buy", "sell"]
gold        = ["sip", "coin", "etf"]
fd          = ["new", "renewal"]
rd          = ["new", "renewal"]

# ----------------------
# EXERCISE
# ----------------------

[type.exercise]
required = ["activity", "duration"]

[type.exercise.fields.activity]
options = ["walk", "run", "cycle", "strength", "yoga", "swim", "sport", "stretch", "other"]

[type.exercise.tags.activity.options]
walk    = ["morning", "evening", "treadmill", "outdoor"]
run     = ["morning", "evening", "treadmill", "outdoor"]
cycle   = ["morning", "evening", "outdoor", "stationary"]
strength = ["gym", "home", "bodyweight"]
yoga    = ["morning", "evening", "class"]
swim    = ["pool", "open_water"]
sport   = ["cricket", "football", "badminton", "tennis", "other"]

# ----------------------
# SLEEP
# ----------------------

[type.sleep]
required = ["quality", "duration"]

[type.sleep.fields.quality]
options = ["1", "2", "3", "4", "5"]

[type.sleep.fields.quality.labels]
1 = "terrible"
2 = "poor"
3 = "okay"
4 = "good"
5 = "great"

[type.sleep.tags.quality.options]
1 = ["insomnia", "restless", "pain"]
2 = ["short", "noisy", "hot"]
3 = ["normal"]
4 = ["refreshed"]
5 = ["deep", "perfect"]

# ----------------------
# MOOD
# ----------------------

[type.mood]
required = ["rating", "context"]

[type.mood.fields.rating]
options = ["1", "2", "3", "4", "5"]

[type.mood.fields.rating.labels]
1 = "terrible"
2 = "low"
3 = "neutral"
4 = "good"
5 = "great"

[type.mood.fields.context]
options = ["work", "home", "social", "health", "travel", "other"]

[type.mood.tags.rating.options]
1 = ["stressed", "anxious", "angry", "sad", "overwhelmed"]
2 = ["tired", "unmotivated", "low", "frustrated"]
3 = ["neutral", "okay", "meh"]
4 = ["good", "focused", "calm", "content"]
5 = ["great", "energised", "grateful", "productive", "joyful"]

# ----------------------
# LEARNING
# ----------------------

[type.learning]
required = ["topic", "source", "domain"]

[type.learning.fields.source]
options = ["book", "course", "video", "podcast", "article", "audio_book", "other"]

[type.learning.fields.domain]
options = ["self", "work"]

[type.learning.fields.topic]
options = [
    "coding", "finance", "productivity", "philosophy",
    "health", "science", "history", "creative",
    "language", "design", "other",
]
