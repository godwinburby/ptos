# --------------------------------------------------
# TODOS  →  todo/todo.txt and todo/done.txt
# --------------------------------------------------
# todo.txt format. +routine items demonstrate the hide_routines toggle.

[todo]
open = [
  "(A) {{-6d}} Prepare for Acme round three +jobsearch @phone due:{{-1d}}",
  "(B) {{-8d}} Send thank-you note to Nova team +jobsearch due:{{+2d}}",
  "(A) {{-4d}} Book audiologist appointment @phone due:{{0d}} due_time:16:00",
  "(B) {{-2d}} Morning stretch +routine @home",
  "(C) {{-3d}} Read 10 pages before bed +routine",
  "(B) {{-7d}} Rehearse project announcement +routine due:{{+1d}}",
  "(C) {{-5d}} Reply to rental listing @home due:{{+3d}}",
  "(C) {{-1d}} Plan weekend trip t:{{+3d}}",
]
done = [
  "x {{-5d}} {{-9d}} Applied to Nova for Support Specialist +jobsearch",
  "x {{-3d}} {{-7d}} Update resume +jobsearch",
  "x {{-2d}} {{-4d}} Clean desk +routine",
]

# --------------------------------------------------
# JOURNAL  →  journal/YYYY/MM/YYYY-MM-DD.md
# --------------------------------------------------

[[journal]]
date = "{{today}}"
body = """# {{today}}

## ARRIVE

### Reality
Cold start to the morning — rushed through breakfast. Room felt cramped.

### Body
Stiff lower back; otherwise fine.

### Mood
4 — good. Focussed after a decent stretch of sleep.

### Intention
Close the loop on [[Acme]] round-three prep.

---

## ENGAGE

