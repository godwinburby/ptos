# --------------------------------------------------
# TODOS  →  todo/todo.txt and todo/done.txt
# --------------------------------------------------
# todo.txt format. +routine items demonstrate the hide_routines toggle.

[todo]
open = [
  "(A) {{-6d}} Prepare for Acme round three +jobsearch @phone due:{{-1d}} +demo",
  "(B) {{-8d}} Send thank-you note to Nova team +jobsearch due:{{+2d}} +demo",
  "(A) {{-4d}} Book audiologist appointment @phone due:{{0d}} due_time:16:00 +demo",
  "(B) {{-2d}} Morning stretch +routine @home +demo",
  "(C) {{-3d}} Read 10 pages before bed +routine +demo",
  "(B) {{-7d}} Rehearse project announcement +routine due:{{+1d}} +demo",
  "(C) {{-5d}} Reply to rental listing @home due:{{+3d}} +demo",
  "(C) {{-1d}} Plan weekend trip t:{{+3d}} +demo",
]
done = [
  "x {{-5d}} {{-9d}} Applied to Nova for Support Specialist +jobsearch +demo",
  "x {{-3d}} {{-7d}} Update resume +jobsearch +demo",
  "x {{-2d}} {{-4d}} Clean desk +routine +demo",
]

# --------------------------------------------------
# JOURNAL  →  journal/YYYY/MM/YYYY-MM-DD.md
# --------------------------------------------------

