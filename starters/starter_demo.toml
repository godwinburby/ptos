# --------------------------------------------------
# PTOS DEMO DATA — Seeded into a fresh workspace by `ptos --init`.
# --------------------------------------------------
#
# Purpose: after installation every page should have something to show —
# records, todos, journal entries, and notes, so the project can be
# explored as a whole. Everything here is sample data and can be removed
# at any time with:  ptos --remove-demo-data
#
# Date tokens are relative to install day and resolve to ISO dates:
#   {{today}}   -> today
#   {{-3d}}     -> three days ago
#   {{+2d}}     -> in two days
# Dates keep landing in the current month/year so this-month dashboards,
# calendars, and habits always have data.
#
# Seeding only happens on a FRESH workspace (empty records year file, no
# undoing: re-running --init on a workspace that already has data never
# touches it).

# --------------------------------------------------
# RECORDS  →  records/demo/YYYY.log
# --------------------------------------------------
# One record per line (key=value fields, trailing `| note`).
# Only fields defined in starter_schema.toml are used.

