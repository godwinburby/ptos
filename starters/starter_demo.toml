# --------------------------------------------------
# TODOS  →  todo/todo.txt and todo/done.txt
# --------------------------------------------------
# todo.txt format. +routine items demonstrate the hide_routines toggle.

[todo]
open = [
  "(A) {{-6d}} Prepare for Acme round three +demo_job @phone due:{{-1d}} +__demo__",
  "(B) {{-8d}} Send thank-you note to Nova team +demo_job due:{{+2d}} +__demo__",
  "(A) {{-4d}} Book audiologist appointment @phone due:{{0d}} due_time:16:00 +__demo__",
  "(B) {{-2d}} Morning stretch +routine @home +__demo__",
  "(C) {{-3d}} Read 10 pages before bed +routine +__demo__",
  "(B) {{-7d}} Rehearse project announcement +routine due:{{+1d}} +__demo__",
  "(C) {{-5d}} Reply to rental listing @home due:{{+3d}} +__demo__",
  "(C) {{-1d}} Plan weekend trip t:{{+3d}} +__demo__",
]
done = [
  "x {{-5d}} {{-9d}} Applied to Nova for Support Specialist +demo_job +__demo__",
  "x {{-3d}} {{-7d}} Update resume +demo_job +__demo__",
  "x {{-2d}} {{-4d}} Clean desk +routine +__demo__",
]

