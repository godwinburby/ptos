# --------------------------------------------------
# NOTES  →  notes/ (file-explorer depth)
# --------------------------------------------------

[notes]
"Demo/template.md" = """---
title: {{title}}
date: {{date}}
---

# {{title}}

_Created: {{date}}_

## Purpose
(Briefly: why does this note exist?)

## Notes
-

## Next
-
"""

"Demo/welcome.md" = """# Welcome to PTOS

PTOS is a plain-text life-logging and task-management system. Everything
you type is a real file on disk — no database, no cloud, just `.log` files,
`todo.txt`, Markdown journals, and notes.

**What's in this fresh install?**
- A sample of seeded records so every page has something to show
- A demo `+routine` todo set and a job-search pipeline board
- This note folder, with `template.md` acting as a local template

**Tour map**
- Home — dashboard stats, quick capture, today's records
- Browse — filter/group/sort every record
- Board — drag job applications through the pipeline
- Due — nudge applications untouched for a week
- Habits — meditation/walk/pomodoro heatmaps
- Calendar + Entity + Thresholds + Projects — cross-page views

Try typing `[[high output management]]` in a journal entry or note — the
`[[brackets]]` create searchable cross-links.

Seeded sample data can be removed anytime:  `ptos --remove-demo-data`
"""

"Demo/how_i_log.md" = """# How records work

Records are single lines:  `date type=... key=value | note`

```text
2026-09-12 type=expense domain=self category=food amount=120 tag=lunch | Team lunch
2026-09-12 type=habit name=meditation | 10 minutes
2026-09-12 type=jobsearch position=Product Manager company=Acme status=applied
```

- Fields come from `config/schema.toml` — add types there
- The trailing `| note` is free text, searched by `/search`
- `+Project` and `@context` live on todos; `[[links]]` work anywhere

The seeded demo records in `records/demo/` follow the starter schema.
Delete that folder (or run `ptos --remove-demo-data`) whenever you want to
start with a clean slate.
"""

"Projects/Find a Job/plan.md" = """# Find a Job

## Goal
Land a product or analytics role by the end of the quarter.

## Why
New challenge, better growth trajectory, and a chance to build products
directly.

## Milestones
- [x] Refresh resume and linkedin
- [x] Apply to 5 target companies
- [ ] Interview prep (case rounds) +acme
- [ ] Close at least one offer

## Tracker
- Pipeline board: Board → job_search on the Board page
- Follow-ups: Due list (nudges applications untouched for 7+ days)
- Todos: `+jobsearch` on the todo page
"""