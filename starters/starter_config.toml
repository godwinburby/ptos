[user]
name = "User"

[editor]
command = "nvim"

[display]
currency = "₹"
date_format = "indian"

[cycles]
# Define billing/reporting cycles as day-of-month they start.
# Example: billing = 15  means cycle runs 15th → 14th next month.
# Usage:   ptos -t billing      (current cycle)
#          ptos -t billing-1    (previous cycle)
clinic = 26

[dashboard]
default = "default"

[auth]
# Web UI authentication (disable for local-only access)
enabled = false
username = ""
password = ""

[server]
# Web server bind address and port
# Use 0.0.0.0 to expose via Tailscale or LAN (enable [auth] first!)
host = "127.0.0.1"
port = 5000

[backup]
# Folders to include in full backup
folders = ["records", "config", "templates", "journal", "todo", "exports", "notes", "scripts"]

# Auto-backup settings (disable in Settings if not wanted)
auto_backup_on_startup = true
auto_backup_on_shutdown = true
backup_if_files_changed = true

# Retention settings
max_full_backups = 10
max_config_backups = 10

[sync]
# rclone remote for multi-device sync (configure in Settings after installing rclone)
# Usage:  ptos --bisync    (bidirectional)
#         ptos --sync --confirm-delete  (one-way push, deletes remote)
enabled = false
remote_name = ""
remote_path = ""
# Folders to include in sync corruption check
folders = ["config", "records", "journal", "todo"]
# Auto-sync settings (enable in Settings after configuring remote)
auto_sync_on_startup = false
auto_sync_on_shutdown = false
sync_interval_minutes = 0

[todo]
# Background notification check interval in minutes (0 = disabled)
notify_interval = 5
# Months before done items are archived to done.YYYY.txt
archive_months = 6
# Priority labels shown in the todo UI (not stored in todo.txt)
priority_labels = { A = "Critical", B = "Important", C = "Moderate", D = "Low" }

[pomodoro]
# Pomodoro timer duration in minutes (default: 25)
duration_minutes = 25
