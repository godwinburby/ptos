[user]
name = "User"

[editor]
command = "nvim"

[display]
currency = "$"
date_format = "us"

[cycles]
# Define billing/reporting cycles as day-of-month they start.
# Example: billing = 15  means cycle runs 15th → 14th next month.
# Usage:   ptos -t billing      (current cycle)
#          ptos -t billing-1    (previous cycle)

[dashboard]
default = "default"

[auth]
# Web UI authentication (disable for local-only access)
enabled = false
username = ""
password = ""

[sync]
# OneDrive sync via rclone bisync (Linux only — Windows uses native OneDrive app)
enabled = false
remote_name = "onedrive"
remote_path = "personal/ptos-data"
# Folders under PTOS_HOME to sync
folders = ["records", "config", "templates", "journal", "todo", "exports", "notes"]
# --- Do not edit below this line ---
# resynced is set to true after first successful --resync run
resynced = false

[backup]
# Folders to include in full backup
folders = ["records", "config", "templates", "journal", "todo", "exports", "notes", "scripts"]

# Auto-backup settings
auto_backup_on_startup = true
auto_backup_on_shutdown = true
backup_if_files_changed = true

# Retention settings
max_full_backups = 10
max_config_backups = 10

[todo]
# Background notification check interval in minutes (0 = disabled)
notify_interval = 5
# Months before done items are archived to done.YYYY.txt
archive_months = 6
