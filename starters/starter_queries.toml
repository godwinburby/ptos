# --------------------------------------------------
# PTOS QUERIES — Starter
# --------------------------------------------------
# Base queries  →  referenced by metrics and dashboards
# Metrics        →  ratio, avg, sum, or derived over base queries
# Dashboards     →  named collection of metrics + base queries
# Saved queries  →  any filter + time + group/pivot combo
#
# Usage:
#   ptos -q <name>              run a saved query
#   ptos -q <name> -t last-month   override time window
#   ptos -q                     list all queries, metrics, dashboards
# --------------------------------------------------

# ── EXPENSE QUERIES ──────────────────────────────────────────────────────────

[expenses_this_month]
where = "type=expense"
time  = "this-month"
sum   = true

[expenses_last_month]
where = "type=expense"
time  = "last-month"
sum   = true

[expenses_by_category]
where = "type=expense"
time  = "this-month"
group = "category"

[expenses_by_domain]
where = "type=expense"
time  = "this-month"
group = "domain"

[food_this_month]
where = "type=expense AND category=food"
time  = "this-month"
sum   = true

[transport_this_month]
where = "type=expense AND category=transport"
time  = "this-month"
sum   = true

[utilities_this_month]
where = "type=expense AND category=utilities"
time  = "this-month"
sum   = true

# ── INCOME QUERIES ───────────────────────────────────────────────────────────

[income_this_month]
where = "type=income"
time  = "this-month"
sum   = true

[income_by_source]
where = "type=income"
time  = "this-month"
group = "source"

# ── INVESTMENT QUERIES ───────────────────────────────────────────────────────

[investments_this_month]
where = "type=investment"
time  = "this-month"
sum   = true

[investments_by_instrument]
where = "type=investment"
time  = "this-month"
group = "instrument"

# ── HEALTH QUERIES ───────────────────────────────────────────────────────────

[exercise_this_month]
where = "type=exercise"
time  = "this-month"

[sleep_this_month]
where = "type=sleep"
time  = "this-month"

[mood_this_month]
where = "type=mood"
time  = "this-month"

# ── LEARNING QUERIES ─────────────────────────────────────────────────────────

[learning_this_month]
where = "type=learning"
time  = "this-month"

# ── INBOX (QUICK CAPTURE) ────────────────────────────────────────────────────

[inbox]
where = "type=capture"
time  = "all"

# ── TRENDS ───────────────────────────────────────────────────────────────────

[monthly_trend]
where = "type=expense"
time  = "this-month"

# ══════════════════════════════════════════════════════════════════════════════
# METRICS
# ══════════════════════════════════════════════════════════════════════════════

[metrics.food_ratio]
ratio = ["food_this_month", "expenses_this_month"]

[metrics.avg_spend]
avg = "expenses_this_month"

[metrics.total_income]
sum = "income_this_month"

[metrics.total_expenses]
sum = "expenses_this_month"

[metrics.avg_mood]
avg = "mood_this_month"

[metrics.balance]
derived = "income_this_month - expenses_this_month"

# ══════════════════════════════════════════════════════════════════════════════
# DASHBOARDS
# ══════════════════════════════════════════════════════════════════════════════

[dashboards.default]
metrics = [
    "income_this_month",
    "expenses_this_month",
    "balance",
    "total_income",
    "total_expenses",
]

[dashboards.health]
metrics = [
    "exercise_this_month",
    "sleep_this_month",
    "mood_this_month",
    "avg_mood",
]

# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# BOARDS
# ══════════════════════════════════════════════════════════════════════════════

["board.job_search"]
columns = [
    { label = "Applied",   where = "status=applied" },
    { label = "Interview", where = "status=interview" },
    { label = "Offer",     where = "status=offer" },
    { label = "Rejected",  where = "status=rejected" },
    { label = "Accepted",  where = "status=accepted" },
]
set_field         = "status"
card_title_fields = ["position", "company"]
time_window       = "this-month"
limit             = 50

# ══════════════════════════════════════════════════════════════════════════════
# HABITS
# ══════════════════════════════════════════════════════════════════════════════

["habit.meditation"]
filters = ["type=habit", "name=meditation"]
weeks = 12

["habit.walk"]
filters = ["type=habit", "name=walk"]
weeks = 12

["habit.pomodoro"]
filters = ["type=pomodoro"]
weeks = 12
toggleable = false

# ══════════════════════════════════════════════════════════════════════════════
# THRESHOLDS
# ══════════════════════════════════════════════════════════════════════════════

["threshold.food_spend"]
metric    = "food_this_month"
agg       = "sum"
sum_field = "amount"
value     = 5000
direction = "max"
time      = "this-month"

# ══════════════════════════════════════════════════════════════════════════════
# CALENDARS
# ══════════════════════════════════════════════════════════════════════════════

["calendar.personal"]
filters     = ["type=income OR type=expense OR type=exercise"]
time_window = "this-month"

# ══════════════════════════════════════════════════════════════════════════════
# DUE
# ══════════════════════════════════════════════════════════════════════════════
# The default due view reads ["due.default"]. Tracks job applications by position
# and surfaces ones untouched for more than `days` (newest record per position).

["due.default"]
type            = "jobsearch"
key             = "position"
sort_by         = "status"
days            = 7
exclude_results = ["accepted", "rejected", "no_response"]

# ══════════════════════════════════════════════════════════════════════════════
# PROJECTS
# ══════════════════════════════════════════════════════════════════════════════
# At least one of todo_project / tag_filters / board / notes_path required.
# label is required.

["project.jobsearch"]
label        = "Find a Job"
todo_project = "jobsearch"
tag_filters  = ["project=jobsearch"]
board        = "job_search"
notes_path   = "Projects/Find a Job"


