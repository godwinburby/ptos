# --------------------------------------------------
# PTOS QUERIES — Starter
# --------------------------------------------------
# Base queries  →  referenced by metrics and dashboards
# Metrics        →  ratio, avg, sum, or derived over base queries
# Dashboards     →  named collection of metrics + base queries
# Saved queries  →  any filter + time + group/pivot combo
#
# Usage:
#   ptos -q <name>              run a saved query
#   ptos -q <name> -t last-month   override time window
#   ptos -q                     list all queries, metrics, dashboards
# --------------------------------------------------

# ── EXPENSE QUERIES ──────────────────────────────────────────────────────────

[expenses_this_month]
where = "type=expense"
time  = "this-month"
sum   = true

[expenses_last_month]
where = "type=expense"
time  = "last-month"
sum   = true

[expenses_by_category]
where = "type=expense"
time  = "this-month"
group = "category"
chart = "hbar"

[expenses_by_domain]
where = "type=expense"
time  = "this-month"
group = "domain"
chart = "bar"

[food_this_month]
where = "type=expense AND category=food"
time  = "this-month"
sum   = true

[transport_this_month]
where = "type=expense AND category=transport"
time  = "this-month"
sum   = true

[utilities_this_month]
where = "type=expense AND category=utilities"
time  = "this-month"
sum   = true

# ── INCOME QUERIES ───────────────────────────────────────────────────────────

[income_this_month]
where = "type=income"
time  = "this-month"
sum   = true

[income_by_source]
where = "type=income"
time  = "this-month"
group = "source"
chart = "bar"

# ── INVESTMENT QUERIES ───────────────────────────────────────────────────────

[investments_this_month]
where = "type=investment"
time  = "this-month"
sum   = true

[investments_by_instrument]
where = "type=investment"
time  = "this-month"
group = "instrument"

# ── HEALTH QUERIES ───────────────────────────────────────────────────────────

[exercise_this_month]
where = "type=exercise"
time  = "this-month"

[sleep_this_month]
where = "type=sleep"
time  = "this-month"

[mood_this_month]
where = "type=mood"
time  = "this-month"

# ── LEARNING QUERIES ─────────────────────────────────────────────────────────

[learning_this_month]
where = "type=learning"
time  = "this-month"

# ── INBOX (QUICK CAPTURE) ────────────────────────────────────────────────────

[inbox]
where = "type=capture"
time  = "all"

# ── TRENDS ───────────────────────────────────────────────────────────────────

[monthly_trend]
where = "type=expense"
time  = "this-month"

# ══════════════════════════════════════════════════════════════════════════════
# METRICS
# ══════════════════════════════════════════════════════════════════════════════

[metrics.food_ratio]
ratio = ["food_this_month", "expenses_this_month"]

[metrics.avg_spend]
avg = "expenses_this_month"

[metrics.total_income]
sum = "income_this_month"

[metrics.total_expenses]
sum = "expenses_this_month"

[metrics.avg_mood]
avg = "mood_this_month"

[metrics.balance]
derived = "income_this_month - expenses_this_month"

# ══════════════════════════════════════════════════════════════════════════════
# DASHBOARDS
# ══════════════════════════════════════════════════════════════════════════════

[dashboards.default]
metrics = [
    "income_this_month",
    "expenses_this_month",
    "balance",
    "total_income",
    "total_expenses",
]

[dashboards.health]
metrics = [
    "exercise_this_month",
    "sleep_this_month",
    "mood_this_month",
    "avg_mood",
]

# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# BOARDS
# ══════════════════════════════════════════════════════════════════════════════

["board.demo_job"]
columns = [
    { label = "Applied",   where = "type=jobsearch AND status=applied AND tag=__demo__" },
    { label = "Interview", where = "type=jobsearch AND status=interview AND tag=__demo__" },
    { label = "Offer",     where = "type=jobsearch AND status=offer AND tag=__demo__" },
    { label = "Rejected",  where = "type=jobsearch AND status=rejected AND tag=__demo__" },
    { label = "Accepted",  where = "type=jobsearch AND status=accepted AND tag=__demo__" },
]
set_field         = "status"
card_title_fields = ["position", "company"]
time_window       = "this-month"
limit             = 50

# ══════════════════════════════════════════════════════════════════════════════
# HABITS
# ══════════════════════════════════════════════════════════════════════════════

["habit.meditation"]
filters = ["type=habit", "name=meditation"]
weeks = 12

["habit.walk"]
filters = ["type=habit", "name=walk"]
weeks = 12

["habit.demo_pomodoro"]
filters = ["type=pomodoro"]
weeks = 12
toggleable = false

# ══════════════════════════════════════════════════════════════════════════════
# THRESHOLDS
# ══════════════════════════════════════════════════════════════════════════════

["threshold.food_spend"]
metric    = "food_this_month"
agg       = "sum"
sum_field = "amount"
value     = 5000
direction = "max"
time      = "this-month"

# ══════════════════════════════════════════════════════════════════════════════
# CALENDARS
# ══════════════════════════════════════════════════════════════════════════════

["calendar.personal"]
filters     = ["type=income OR type=expense OR type=exercise"]
time_window = "this-month"
# display_fields = ["name", "amount"]   # optional: record values shown per day, in order

# ══════════════════════════════════════════════════════════════════════════════
# DUE
# ══════════════════════════════════════════════════════════════════════════════
# The default due view reads ["due.default"]. Tracks job applications by position
# and surfaces ones untouched for more than `days` (newest record per position).

["due.default"]
type            = "jobsearch"
key             = "position"
sort_by         = "status"
days            = 7
exclude_results = ["accepted", "rejected", "no response"]

# ══════════════════════════════════════════════════════════════════════════════
# PROJECTS
# ══════════════════════════════════════════════════════════════════════════════
# At least one of todo_project / tag_filters / board / notes_path required.
# label is required.
# The demo project is namespaced (demo_job) and its notes live under Demo/ so
# they never mix with a real project of the same name.

["project.demo_job"]
label        = "Find a Job (Demo)"
todo_project = "demo_job"
tag_filters  = ["project=demo_job"]
board        = "demo_job"
notes_path   = "Demo/Find a Job"

# ══════════════════════════════════════════════════════════════════════════════
# TODOS (saved todo views)
# ══════════════════════════════════════════════════════════════════════════════
# A saved todo view feeds ```ptos embeds (view = "todo") with the same keys the
# /todo page filter bar accepts. Keys set inside an embed override these.
# Every key below is optional: with none of them a view is the default open
# todo list, grouped by timeline with a 20-item limit.
# Validate with: ptos --lint  (also checked by ptos --doctor)

# ["todo.NAME"]
# project      = "+demo_job"      # a project name; "-name" excludes it
# context      = "@phone"
# priority     = "A"              # A-D (case-insensitive)
# due          = "week"           # overdue|today|tomorrow|upcoming|someday|week|none
# search       = "*call*"         # glob match over the description
# linked_to    = "expense:abc123" # only todos linking to this type:id
# include_done = false            # append a Done bucket (recent 50, filtered)
# hide_routines = false           # drop +routine todos (defaults on when no project)
# groupby      = "project"        # timeline (default) | priority | project | context | none
# sort         = "most"           # default | reverse | most | fewest (group order)
# limit        = 20               # truncate open groups in group order
# title        = "Work week"      # embed card heading
# add          = true             # show a quick-add box (widget chrome)


