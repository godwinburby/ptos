name: tests

# The suite is the same command the local pre-commit hook runs, so a green
# run here means a green run before any commit lands.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  line-endings:
    name: line endings (LF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject non-LF text files in the index
        run: |
          bad=$(git ls-files --eol | grep -v -E 'i/(lf|none|-text)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo ""
            echo "Non-LF files found in the index (CRLF or mixed endings)."
            echo "Text files must be stored as LF; see docs/specs/ptos-line-endings-spec.md."
            exit 1
          fi

  changelog:
    name: CHANGELOG check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE=$(git merge-base ${{ github.base_ref }} ${{ github.sha }})
            HEAD=${{ github.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.event.after }}
          fi
          ./scripts/check_changelog.sh "$BASE" "$HEAD"

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken OS/version should not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: node --test "tests/js/*.test.js"

      - name: Run the test suite
        run: python -m pytest tests/ -q
