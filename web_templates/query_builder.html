{% extends "base.html" %}
{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
  <div class="page-title" style="margin:0;">Query Builder</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button onclick="addEntry()" class="btn btn-primary btn-sm">+ New</button>
    <button onclick="saveAll()"  class="btn btn-success btn-sm" id="save-btn">💾 Save All</button>
    <button onclick="resetQuery()" class="btn btn-ghost btn-sm" id="reset-btn">Clear</button>
    <div id="save-msg" style="font-size:13px;display:none;"></div>
  </div>
</div>

<!-- ── Section tabs row ── -->
<div class="qb-section-bar">
  <button class="qb-sec-tab active" data-sec="queries"    onclick="switchSection('queries')">Queries</button>
  <button class="qb-sec-tab"        data-sec="metrics"    onclick="switchSection('metrics')">Metrics</button>
  <button class="qb-sec-tab"        data-sec="dashboards" onclick="switchSection('dashboards')">Dashboards</button>
  <button class="qb-sec-tab"        data-sec="aliases"    onclick="switchSection('aliases')">Aliases</button>
  <button class="qb-sec-tab"        data-sec="due"        onclick="switchSection('due')">Due</button>
</div>

<!-- ── Item chips row ── -->
<div class="qb-item-bar">
  <div id="tabs-queries"    class="qb-item-strip"></div>
  <div id="tabs-metrics"    class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-dashboards" class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-aliases"    class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-due"        class="qb-item-strip" style="display:none;"></div>
</div>

<!-- ── Editor ── -->
<div id="entry-editor" style="margin-top:14px;display:none;"></div>
<div id="entry-empty"
     style="margin-top:40px;text-align:center;color:var(--sub);font-size:14px;">
  Select an entry above, or click <strong>+ New</strong>.
</div>

<!-- delete modal -->
<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:300px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;color:var(--error);margin-bottom:10px;">Delete?</div>
    <div id="del-msg-text" style="font-size:14px;color:var(--sub);margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="confirmDelete()" class="btn btn-sm"
              style="flex:1;background:var(--error);color:#fff;border:none;">Delete</button>
      <button onclick="closeDeleteModal()" class="btn btn-ghost btn-sm" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<div id="rec-del-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;max-width:420px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.25);">
    <div style="font-weight:700;font-size:16px;margin-bottom:12px;">Delete Record?</div>
    <div id="rec-del-line" style="font-family:monospace;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:16px;word-break:break-all;"></div>
    <div id="rec-del-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="qbCloseDelete()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--error);" onclick="qbDoDelete()">Delete</button>
    </div>
  </div>
</div>

<style>
  /* ── Section tab bar ─────────────────────────────────────────────────────── */
  .qb-section-bar {
    display:flex;gap:4px;padding:4px;
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;margin-bottom:0;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .qb-section-bar::-webkit-scrollbar { display:none; }
  .qb-sec-tab {
    flex-shrink:0;padding:7px 16px;border-radius:8px;border:none;
    background:none;font-size:13px;font-weight:700;color:var(--sub);
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .qb-sec-tab:hover  { background:var(--bg);color:var(--text); }
  .qb-sec-tab.active { background:var(--accent);color:#fff; }
  .qb-sec-tab .sec-count {
    display:inline-block;font-size:10px;font-weight:700;
    background:rgba(255,255,255,.25);color:inherit;
    padding:1px 5px;border-radius:8px;margin-left:5px;
  }
  .qb-sec-tab:not(.active) .sec-count {
    background:var(--border);color:var(--sub);
  }

  /* ── Item chip bar ───────────────────────────────────────────────────────── */
  .qb-item-bar {
    background:var(--card);border:1px solid var(--border);
    border-top:none;border-radius:0 0 12px 12px;
    padding:8px 10px;min-height:46px;
  }
  .qb-item-strip {
    display:flex;gap:6px;flex-wrap:wrap;
  }
  .q-tab {
    flex-shrink:0;padding:5px 12px;border-radius:20px;
    border:1.5px solid var(--border);background:var(--bg);
    font-size:13px;font-weight:600;color:var(--sub);
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .q-tab:hover  { border-color:var(--accent);color:var(--accent); }
  .q-tab.active { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .q-tab-derived { font-style:italic;opacity:0.8; }
  .q-tab-alias   { opacity:0.65; }
  .qb-item-none  { font-size:12px;color:var(--border);padding:4px 6px;align-self:center; }

  /* ── Editor/empty area ───────────────────────────────────────────────────── */
  .dash-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
    border-radius:20px;font-size:13px;font-weight:600;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);margin:3px;
  }
  .dash-chip button { background:none;border:none;color:var(--accent);
    cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700; }
  .qb-chip {
    display:inline-flex;align-items:center;gap:4px;padding:6px 12px;
    border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    transition:all .15s;margin:3px;
  }
  .qb-chip:hover    { border-color:var(--accent);color:var(--accent); }
  .qb-chip.active   { background:var(--accent);border-color:var(--accent);color:#fff; }
  .qb-chip.selected { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .qb-active-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
    border-radius:20px;font-size:13px;font-weight:600;margin:3px;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);
  }
  .qb-active-chip button {
    background:none;border:none;color:var(--accent);
    cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700;
  }
  .qb-preview {
    font-family:'Consolas','Courier New',monospace;font-size:13px;
    background:#1E2130;color:#D4D8E8;padding:12px 14px;border-radius:8px;
    line-height:1.8;word-break:break-all;min-height:56px;
    border:1px solid var(--border);
  }
  .p-name  { color:#82AAFF;font-weight:700; }
  .p-where { color:#C3E88D; }
  .p-time  { color:#7EC8E3; }
  .p-opt   { color:#FFCB6B; }
  .p-dim   { color:#697098; }
</style>

<script>
var _st = { queries:{}, metrics:{}, dashboards:{}, aliases:{}, due:{} };
var _cur = null;
var _delPending = null;
var _types    = {{ types | tojson }};
var _timeOpts = {{ time_options | tojson }};

// Initialize due from backend config
var _dueFromBackend = {{ due_config | tojson }};
Object.entries(_dueFromBackend).forEach(function(e) {
  _st.due[e[0]] = e[1];
});
var _fieldCache = {};   // {type: [{name, options, is_int}]}
var _cacheSet  = [];    // maintain insertion order for eviction
var _liveTimer = null;

// ── Boot ──────────────────────────────────────────────────────────────────────
(function() {
  var q = {{ queries | tojson }};
  var reserved = ["metrics","dashboards", "due"];
  Object.entries(q).forEach(function(e) {
    var k = e[0], v = e[1];
    if (reserved.indexOf(k)!==-1 || typeof v!=="object") return;
    if (k.startsWith("due.")) return;  // Skip due configs - loaded separately
    if (v.alias) {
      _st.aliases[k] = { alias: v.alias };
      return;
    }
    var parsed = _parseWhere(v.where||"");
    _st.queries[k] = {
      where:        v.where||"",
      time:         v.time||"tm",
      sum:          !!v.sum,
      group:        Array.isArray(v.group)?v.group[0]:(v.group||""),
      search:       v.search||"",
      sort:         v.sort||"",
      _chips:       parsed.chips,
      _exprManual:  parsed.manual,
      _activeField: null,
    };
  });
  // metrics — include all (derived metrics have .derived expression)
  Object.entries(q.metrics||{}).forEach(function(e) {
    var k = e[0], m = e[1];
    var kind="avg",base="",base2="",derived="",unit_field="",unit_weights={};
    if ("derived" in m) {
      derived = m.derived;
    } else if ("ratio" in m && Array.isArray(m.ratio)) {
      kind="ratio"; base=m.ratio[0]||""; base2=m.ratio[1]||"";
    } else if ("avg" in m) {
      kind="avg"; base=m.avg;
      unit_field = m.unit_field || "";
      unit_weights = m.unit_weights || {};
    } else if ("sum" in m) { kind="sum"; base=m.sum; }
    else if ("max" in m) { kind="max"; base=m.max; }
    else if ("min" in m) { kind="min"; base=m.min; }
    // Preserve any extra raw fields
    var raw = {};
    Object.keys(m).forEach(function(f) {
      if (["avg","sum","max","min","ratio","derived","unit_field","unit_weights"].indexOf(f)===-1) {
        raw[f] = m[f];
      }
    });
    _st.metrics[k] = { kind, base, base2, derived, unit_field, unit_weights, _raw: raw };
  });
  Object.entries(q.dashboards||{}).forEach(function(e) {
    _st.dashboards[e[0]] = { metrics: e[1].metrics||[] };
  });
  renderTabs();
  // Check URL params for edit mode
  var params = new URLSearchParams(window.location.search);
  var editName = params.get("edit");
  var editSection = params.get("section");
  if (editName && editSection && _st[editSection]) {
    // Load existing item for editing
    switchSection(editSection);
    select(editSection, editName);
  } else {
    // Default: select first query
    switchSection("queries");
    var first = Object.keys(_st.queries)[0];
    if (first) select("queries", first);
  }
})();

// ── Parse simple where expression into chips + manual remainder ───────────────
// Handles field=value AND field=value — anything else stays in manual expr box
function _parseWhere(expr) {
  var chips = [], manual = [];
  if (!expr) return {chips, manual:""};
  expr.trim().split(/\s+AND\s+/i).forEach(function(p) {
    p = p.trim();
    var m = p.match(/^([a-z_][a-z0-9_]*)=([^\s()|&]+)$/i);
    if (m) chips.push({ field:m[1].toLowerCase(), op:"=", value:m[2] });
    else if (p) manual.push(p);
  });
  return { chips, manual: manual.join(" AND ") };
}

// ── Section switching ─────────────────────────────────────────────────────────
var _curSection = "queries";

function switchSection(sec) {
  _curSection = sec;
  // update section tab highlight
  document.querySelectorAll(".qb-sec-tab").forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.sec === sec);
  });
  // show only the matching item strip
  ["queries","metrics","dashboards","aliases","due"].forEach(function(s) {
    var el = document.getElementById("tabs-"+s);
    if (el) el.style.display = s === sec ? "flex" : "none";
  });
}

// ── Tab rendering ─────────────────────────────────────────────────────────────
function renderTabs() {
  _renderSection("tabs-queries",    _st.queries,    "queries");
  _renderSection("tabs-metrics",    _st.metrics,    "metrics");
  _renderSection("tabs-dashboards", _st.dashboards, "dashboards");
  _renderSection("tabs-aliases",    _st.aliases,    "aliases");
  renderDueTabs();
  _updateSectionCounts();
}

function _updateSectionCounts() {
  var counts = {
    queries:    Object.keys(_st.queries).length,
    metrics:    Object.keys(_st.metrics).length,
    dashboards: Object.keys(_st.dashboards).length,
    aliases:    Object.keys(_st.aliases).length,
    due:        Object.keys(_st.due).length,
  };
  document.querySelectorAll(".qb-sec-tab").forEach(function(btn) {
    var sec = btn.dataset.sec;
    var existing = btn.querySelector(".sec-count");
    if (existing) existing.remove();
    if (counts[sec] > 0) {
      var badge = document.createElement("span");
      badge.className = "sec-count";
      badge.textContent = counts[sec];
      btn.appendChild(badge);
    }
  });
}

function renderDueTabs() {
  var el = document.getElementById("tabs-due");
  if (!el) return;
  el.innerHTML = "";
  var names = Object.keys(_st.due);
  if (!names.length) {
    el.innerHTML = '<span class="qb-item-none">none</span>';
    return;
  }
  names.forEach(function(name) {
    var btn = document.createElement("button");
    btn.className = "q-tab" + (name === (_cur && _cur.name) && _cur.section === "due" ? " active" : "");
    btn.textContent = name;
    btn.addEventListener("click", function() { select("due", name); });
    el.appendChild(btn);
  });
}

function _renderSection(elId, data, section) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = "";
  var keys = Object.keys(data);
  if (!keys.length) {
    el.innerHTML = '<span class="qb-item-none">none</span>';
    return;
  }
  keys.forEach(function(name) {
    var extraClass = "";
    var badge = "";
    if (section==="metrics" && data[name].derived) {
      extraClass = " q-tab-derived";
      badge = ' <span style="font-size:10px;background:var(--sub);color:var(--card);padding:1px 5px;border-radius:4px;">fx</span>';
    } else if (section==="aliases") {
      extraClass = " q-tab-alias";
    }
    var btn = document.createElement("button");
    btn.className = "q-tab" + extraClass +
      (_cur&&_cur.section===section&&_cur.name===name?" active":"");
    btn.innerHTML = name + badge;
    btn.title = section==="aliases" ? "→ " + data[name].alias : name;
    btn.addEventListener("click", function(){ select(section, name); });
    el.appendChild(btn);
  });
}

function select(section, name) {
  _cur = {section, name};
  if (_curSection !== section) switchSection(section);
  renderTabs();
  document.getElementById("entry-editor").style.display = "block";
  document.getElementById("entry-empty").style.display  = "none";
  renderEditor();
}

// ── Reset current query ───────────────────────────────────────────────────────
function resetQuery() {
  // Deselect and go to empty state
  _cur = null;
  document.getElementById("entry-editor").style.display = "none";
  document.getElementById("entry-empty").style.display = "block";
  renderTabs();
}

// ── Add new ───────────────────────────────────────────────────────────────────
function addEntry() {
  var kind = prompt("What kind?\n  q = query\n  m = metric\n  d = dashboard\n  a = alias\n  u = due","q");
  if (!kind) return;
  kind = kind.trim().toLowerCase();
  var section = kind==="m"?"metrics":kind==="d"?"dashboards":kind==="a"?"aliases":kind==="u"?"due":"queries";
  var name = prompt("Name (lowercase, underscores):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
  if (!name) return;
  if (_st[section] && _st[section][name]) { alert("'"+name+"' already exists."); return; }
  if (section==="queries")
    _st.queries[name]    = {where:"",time:"tm",sum:false,group:"",search:"",_chips:[],_exprManual:"",_activeField:null};
  else if (section==="metrics")
    _st.metrics[name]    = {kind:"avg",base:"",base2:""};
  else if (section==="aliases")
    _st.aliases[name]    = {alias:""};
  else if (section==="due")
    _st.due[name]      = {type:"followup",key:"client",sort_by:"",days:7,exclude_results:[]};
  else
    _st.dashboards[name] = {metrics:[]};
  renderTabs();
  select(section, name);
}

// ── Editor router ─────────────────────────────────────────────────────────────
function renderEditor() {
  var ed = document.getElementById("entry-editor");
  ed.innerHTML = "";
  if (!_cur) return;
  var s=_cur.section, n=_cur.name;
  if (s==="aliases") {
    _buildAliasEditor(ed, n);
    return;
  }
  if (s==="due") {
    showDueEditor();
    return;
  }
  // header
  var hdr = document.createElement("div");
  hdr.className = "card"; hdr.style.marginBottom = "12px";
  hdr.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<div style="flex:1;"><label>Name</label>' +
        '<input type="text" id="ed-name" value="'+n+'" oninput="onNameChange()"' +
        ' style="font-size:16px;font-weight:700;"></div>' +
      '<div style="margin-top:18px;">' +
        '<button onclick="askDelete()" class="btn btn-ghost btn-sm"' +
        ' style="color:var(--error);border-color:var(--error);">Delete</button>' +
      '</div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--sub);margin-top:6px;">' +
    (s==="queries"?"Base query — filter records by type, fields, and time":
     s==="metrics"?"Metric — computed value over a base query":
     "Dashboard — group of queries and metrics shown on Home")+'</div>';
  ed.appendChild(hdr);
  if (s==="queries")     _buildQueryEditor(ed, n);
  else if (s==="metrics") ed.appendChild(_buildMetricEditor(n));
  else                    ed.appendChild(_buildDashEditor(n));
}

function onNameChange() {
  var newName = document.getElementById("ed-name").value.trim()
                       .toLowerCase().replace(/[^a-z0-9_]/g,"_");
  var s=_cur.section, old=_cur.name;
  if (!newName||newName===old||_st[s][newName]) return;
  _st[s][newName]=_st[s][old]; delete _st[s][old];
  _cur.name=newName; renderTabs();
}

// ══════════════════════════════════════════════════════════════════════════════
// QUERY EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildQueryEditor(container, name) {
  var q = _st.queries[name];

  // 1. Type chips
  var c1 = _mkCard("Record type",
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px;">'+
    'Pick a type to load field chips. Leave as "all types" to query everything.</div>'+
    '<div id="qb-type-chips" class="chip-group"></div>');
  container.appendChild(c1);

  // 2. Field/value chip area
  var c2 = document.createElement("div");
  c2.className = "card"; c2.style.marginBottom = "10px";
  c2.id = "qb-field-card";
  c2.style.display = _typeFromChips(q) ? "block" : "none";
  c2.innerHTML =
    '<label>Filter by field</label>'+
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px;">'+
    'Tap a field → tap a value to add it as a filter.</div>'+
    '<div id="qb-active-chips" class="chip-group" style="min-height:10px;margin-bottom:10px;"></div>'+
    '<div style="font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px;">FIELDS</div>'+
    '<div id="qb-field-chips" class="chip-group" style="margin-bottom:8px;"></div>'+
    '<div id="qb-value-area" style="display:none;padding:10px;background:var(--bg);'+
    'border-radius:8px;border:1px solid var(--border);">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'+
        '<span style="font-size:11px;color:var(--sub);font-weight:700;">VALUES FOR '+
        '<span id="qb-val-label" style="color:var(--accent);"></span></span>'+
        '<button onclick="closeValueArea()" style="background:none;border:none;color:var(--sub);'+
        'cursor:pointer;font-size:16px;line-height:1;">✕</button>'+
      '</div>'+
      '<div id="qb-value-chips" class="chip-group" style="margin-bottom:6px;"></div>'+
      '<div id="qb-history-label" style="display:none;font-size:11px;color:var(--sub);margin-top:8px;margin-bottom:4px;">Recent:</div>'+
      '<div id="qb-history-chips" class="chip-group" style="opacity:0.65;margin-bottom:4px;"></div>'+
      '<div id="qb-val-text" style="display:none;gap:8px;margin-top:6px;">'+
        '<input type="text" id="qb-val-input" placeholder="type a value…" style="flex:1;font-size:14px;"'+
        ' onkeydown="if(event.key===\'Enter\') addTextChip()">'+
        '<button onclick="addTextChip()" class="btn btn-ghost btn-sm" style="margin-top:6px;">Add</button>'+
      '</div>'+
    '</div>';
  container.appendChild(c2);

  // Tags section
  var cTags = document.createElement("div");
  cTags.className = "card"; cTags.style.marginBottom = "10px";
  cTags.id = "qb-tags-card";
  cTags.style.display = _typeFromChips(q) ? "block" : "none";
  cTags.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'+
      '<span style="font-size:11px;color:var(--sub);font-weight:600;">TAGS</span>'+
    '</div>'+
    '<div id="qb-tag-chips" class="chip-group"></div>'+
    '<div id="qb-tag-history-label" style="display:none;font-size:11px;color:var(--sub);margin-top:8px;margin-bottom:4px;">from history:</div>'+
    '<div id="qb-tag-history-chips" class="chip-group"></div>';
  container.appendChild(cTags);

  // 3. Time window
  var timeCard = document.createElement("div");
  timeCard.className = "card"; timeCard.style.marginBottom = "10px";
  timeCard.innerHTML =
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">'+
      '<div class="field-group" style="flex:1;min-width:140px;">'+
        '<label>Time</label>'+
        '<select id="qb-time" onchange="qbOnTimeChange(this.value)">'+
        _timeOpts.map(function(o){

// ── helpers scoped to query editor ───────────────────────────────────────────
function _typeFromChips(q) {
  var c = (q._chips||[]).find(function(c){ return c.field==="type"; });
  return c ? c.value : null;
}

function _buildWhereExpr(q) {
  var parts = (q._chips||[]).map(function(c){ return c.field+c.op+c.value; });
  var manual = (q._exprManual||"").trim();
  if (manual) parts.push(manual);
  return parts.join(" AND ");
}

function _buildFullWhereExpr(q) {
  return _buildWhereExpr(q);
}

function _buildChipFilters(q) {
  return (q._chips||[]).map(function(c){ return c.field+c.op+c.value; });
}

function _updateQ(field, val) {
  if (!_cur||_cur.section!=="queries") return;
  _st.queries[_cur.name][field] = val;
  _updatePreview(_st.queries[_cur.name]);
  triggerLivePreview();
}

function _onExprInput(val) {
  if (!_cur) return;
  _st.queries[_cur.name]._exprManual = val;
  _updatePreview(_st.queries[_cur.name]);

}

// ── Advanced mode for WHERE expression ──────────────────────────────────────
var _savedQBExprManual = "";
var _savedQBChips = [];

window._toggleAdvancedMode = function() {
  if (!_cur || _cur.section !== "queries") return;
  var q = _st.queries[_cur.name];
  var previewEl = document.getElementById("qb-adv-preview");
  var editorEl = document.getElementById("qb-adv-editor");
  var toggleBtn = document.getElementById("qb-adv-toggle");
  var editor = document.getElementById("qb-where-editor");
  
  if (editorEl.style.display === "none") {
    // Enter edit mode
    _savedQBExprManual = q._exprManual || "";
    _savedQBChips = (q._chips || []).slice();
    editorEl.style.display = "block";
    previewEl.style.display = "none";
    toggleBtn.textContent = "Cancel";
    // Populate editor with WHERE clause
    var whereParts = (q._chips||[]).map(function(c) { return c.field + c.op + c.value; });
    if (q._exprManual) whereParts.push(q._exprManual);
    editor.value = whereParts.join(" AND ");
    editor.focus();
  } else {
    // Cancel edit mode
    editorEl.style.display = "none";
    previewEl.style.display = "block";
    toggleBtn.textContent = "Edit";
  }
};

window._applyAdvancedExpr = function() {
  if (!_cur || _cur.section !== "queries") return;
  var q = _st.queries[_cur.name];
  var editor = document.getElementById("qb-where-editor");
  var expr = editor.value.trim();
  
  // Parse expression into chips and manual expression
  var parts = _parseQBExpr(expr);
  q._chips = parts.chips;
  q._exprManual = parts.manual;
  
  _renderActiveChips(q);
  _renderFieldChips(q);
  _renderTagsSection(q);
  _updatePreview(q);
  triggerLivePreview();
  
  // Exit edit mode
  document.getElementById("qb-adv-editor").style.display = "none";
  document.getElementById("qb-adv-preview").style.display = "block";
  document.getElementById("qb-adv-toggle").textContent = "Edit";
};

window._cancelAdvancedExpr = function() {
  if (!_cur || _cur.section !== "queries") return;
  var q = _st.queries[_cur.name];
  
  // Restore chips and expression
  q._chips = _savedQBChips.slice();
  q._exprManual = _savedQBExprManual;
  
  _renderActiveChips(q);
  _renderFieldChips(q);
  _renderTagsSection(q);
  _updatePreview(q);
  
  // Exit edit mode
  document.getElementById("qb-adv-editor").style.display = "none";
  document.getElementById("qb-adv-preview").style.display = "block";
  document.getElementById("qb-adv-toggle").textContent = "Edit";
};

// Parse expression into chips + manual remainder
function _parseQBExpr(expr) {
  var chips = [], manual = [];
  if (!expr) return {chips, manual:""};
  
  // Simple split by AND (but preserve parentheses)
  var parts = expr.split(/\s+AND\s+/i);
  parts.forEach(function(p) {
    p = p.trim();
    if (!p) return;
    var m = p.match(/^([a-z_][a-z0-9_]*)(\s*[!=<>~]+)\s*(.+)$/i);
    if (m) {
      chips.push({field: m[1].toLowerCase(), op: m[2].trim(), value: m[3].trim()});
    } else if (p) {
      manual.push(p);
    }
  });
  return {chips, manual: manual.join(" AND ")};
}

function toggleExpr(btn) {
  _toggleAdvancedMode();
}

function _renderTypeChips(q) {
  var el = document.getElementById("qb-type-chips");
  if (!el) return;
  el.innerHTML = "";
  var sel = _typeFromChips(q);
  // all types chip
  var all = document.createElement("button");
  all.className = "qb-chip" + (!sel?" active":"");
  all.textContent = "all types";
  all.addEventListener("click", function(){ _onTypeClick(null, q); });
  el.appendChild(all);
  _types.forEach(function(t) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (t===sel?" active":"");
    chip.textContent = t;
    chip.addEventListener("click", function(){ _onTypeClick(t, q); });
    el.appendChild(chip);
  });
}

function _onTypeClick(type, q) {
  q._chips = (q._chips||[]).filter(function(c){ return c.field!=="type"; });
  if (type) q._chips.unshift({field:"type",op:"=",value:type});
  q._activeField = null;
  _renderTypeChips(q);
  var fc = document.getElementById("qb-field-card");
  if (type) {
    fc.style.display = "block";
    _fetchFields(type, q, function() {
      _renderFieldChips(q);
      _renderActiveChips(q);
      _renderTagsSection(q);
      _updateGroupSortDropdowns(q);
      _updatePreview(q);
      triggerLivePreview();
    });
  } else {
    fc.style.display = "none";
    // remove all non-type chips when clearing type
    q._chips = [];
    _renderActiveChips(q);
    _renderTagsSection(q);
    _updatePreview(q);
    triggerLivePreview();
  }
}

// Build context object from chips (e.g., {domain: "self", category: "transport"})
function _getContext(q) {
  var ctx = {};
  (q._chips||[]).forEach(function(c) {
    if (c.field !== "type") ctx[c.field] = c.value;
  });
  return ctx;
}

// Build context string for API (e.g., "domain:self,category:transport")
function _getContextStr(q) {
  var ctx = _getContext(q);
  return Object.keys(ctx).map(function(k){ return k+":"+ctx[k]; }).join(",");
}

function _fetchFields(type, q, cb) {
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  
  if (_fieldCache[cacheKey] && _fieldCache[cacheKey].fields) { cb(); return; }
  
  // Evict oldest if over limit
  if (_cacheSet.length >= 20) {
    var oldKey = _cacheSet.shift();
    delete _fieldCache[oldKey];
  }
  
  var url = "/api/type_fields/"+encodeURIComponent(type);
  if (ctxStr) url += "?context="+encodeURIComponent(ctxStr);
  
  fetch(url)
  .then(function(r){ return r.json(); })
  .then(function(data) {
    _fieldCache[cacheKey] = {
      fields: (data.fields||[]).filter(function(f){
        return !f.is_int && f.name!=="type";
      }),
      history: data.history_fields || {},
      historyTags: data.history_tags || [],  // Store for tags section
      dimensions: data.dimensions || []
    };
    _cacheSet.push(cacheKey);
    cb();
  })
  .catch(function(){ _fieldCache[cacheKey]={fields:[],history:{},historyTags:[],dimensions:[]}; cb(); });
}

function _updateGroupSortDropdowns(q) {
  var grp = document.getElementById("qb-group");
  var sort = document.getElementById("qb-sort");
  if (!grp || !sort) return;
  
  var type = _typeFromChips(q);
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  var dims = (_fieldCache[cacheKey] || {}).dimensions || [];
  
  grp.innerHTML = '<option value="">— select —</option>';
  sort.innerHTML = '<option value="">— select —</option>';
  dims.forEach(function(d) {
    grp.innerHTML += '<option value="'+d+'">'+d+'</option>';
    sort.innerHTML += '<option value="'+d+'">'+d+'</option>';
  });
  
  if (q.group && grp.querySelector('option[value="'+q.group+'"]')) grp.value = q.group;
  if (q.sort && sort.querySelector('option[value="'+q.sort+'"]')) sort.value = q.sort;
}

function _renderFieldChips(q) {
  var el = document.getElementById("qb-field-chips");
  if (!el) return;
  el.innerHTML = "";
  var type = _typeFromChips(q);
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  var fields = (_fieldCache[cacheKey]||{}).fields || [];
  
  // Filter out fields whose parent is not in context
  var ctx = _getContext(q);
  fields = fields.filter(function(f) {
    if (f.name === "tag") return false;  // Exclude tag - shown in dedicated section
    if (!f.has_parent) return true;
    return ctx[f.parent];
  });
  
  fields.forEach(function(f) {
    var active  = q._activeField===f.name;
    var hasChip = (q._chips||[]).some(function(c){ return c.field===f.name; });
    var chip = document.createElement("button");
    chip.className = "qb-chip"+(active?" active":hasChip?" selected":"");
    var label = f.name;
    if (f.has_parent && !ctx[f.parent]) label += "*";
    chip.textContent = label;
    chip.title = f.has_parent && !ctx[f.parent] ? "Select "+f.parent+" first" : f.name;
    chip.addEventListener("click", function(){ _onFieldClick(f, q); });
    el.appendChild(chip);
  });
}

function _renderTagsSection(q) {
  var tagsCard = document.getElementById("qb-tags-card");
  var tagChips = document.getElementById("qb-tag-chips");
  var tagHistLabel = document.getElementById("qb-tag-history-label");
  var tagHistChips = document.getElementById("qb-tag-history-chips");
  
  if (!_typeFromChips(q)) {
    tagsCard.style.display = "none";
    return;
  }
  
  var type = _typeFromChips(q);
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  var cache = _fieldCache[cacheKey] || {fields: [], history: {}, historyTags: []};
  
  // Find tag field definition
  var tagField = cache.fields.find(function(f) { return f.name === "tag"; });
  
  var schemaOpts = tagField ? (tagField.options || []) : [];
  var historyTags = cache.historyTags || [];
  var historyOpts = historyTags.filter(function(t) { return schemaOpts.indexOf(t) === -1; });
  
  // Show message if no tags available yet
  if (!schemaOpts.length && !historyOpts.length) {
    tagChips.innerHTML = '<span style="font-size:12px;color:var(--sub);">Select field values above to see tags</span>';
    tagHistLabel.style.display = "none";
    return;
  }
  
  // Always show tags card when type is selected
  tagsCard.style.display = "block";
  tagChips.innerHTML = "";
  tagHistChips.innerHTML = "";
  
  // Schema options
  schemaOpts.forEach(function(opt) {
    var already = (q._chips||[]).some(function(c) { return c.field === "tag" && c.op === "=" && c.value === opt; });
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (already ? " active" : "");
    chip.textContent = opt;
    chip.addEventListener("click", function() {
      _toggleTagChip(opt, q);
      chip.className = "qb-chip" + ((q._chips||[]).some(function(c) { return c.field === "tag" && c.op === "=" && c.value === opt; }) ? " active" : "");
    });
    tagChips.appendChild(chip);
  });
  
  // History tags
  if (historyOpts.length) {
    tagHistLabel.style.display = "block";
    historyOpts.forEach(function(tag) {
      var already = (q._chips||[]).some(function(c) { return c.field === "tag" && c.op === "=" && c.value === tag; });
      var chip = document.createElement("button");
      chip.className = "qb-chip" + (already ? " active" : "");
      chip.style.opacity = "0.75";
      chip.style.fontSize = "12px";
      chip.style.padding = "4px 9px";
      chip.textContent = tag;
      chip.addEventListener("click", function() {
        _toggleTagChip(tag, q);
        chip.className = "qb-chip" + ((q._chips||[]).some(function(c) { return c.field === "tag" && c.op === "=" && c.value === tag; }) ? " active" : "");
      });
      tagHistChips.appendChild(chip);
    });
  } else {
    tagHistLabel.style.display = "none";
  }
}

function _toggleTagChip(value, q) {
  var chips = q._chips || [];
  var idx = chips.findIndex(function(c) { return c.field === "tag" && c.op === "=" && c.value === value; });
  if (idx !== -1) {
    chips.splice(idx, 1);
  } else {
    chips.push({field: "tag", op: "=", value: value});
  }
  q._chips = chips;
  _renderActiveChips(q);
  _renderTagsSection(q);
  _updatePreview(q);
  triggerLivePreview();
  // Invalidate cache and re-fetch with updated context
  var type = _typeFromChips(q);
  if (type) {
    var ctxStr = _getContextStr(q);
    var cacheKey = type + "?" + ctxStr;
    delete _fieldCache[cacheKey];
    _fetchFields(type, q, function() {
      _renderFieldChips(q);
      _renderTagsSection(q);
    });
  }
}

function _onFieldClick(fdef, q) {
  if (q._activeField===fdef.name) { closeValueArea(); return; }
  q._activeField = fdef.name;
  _renderFieldChips(q);
  var va = document.getElementById("qb-value-area");
  var vl = document.getElementById("qb-val-label");
  var vc = document.getElementById("qb-value-chips");
  var vh = document.getElementById("qb-history-chips");
  var vhl = document.getElementById("qb-history-label");
  var vt = document.getElementById("qb-val-text");
  va.style.display = "block";
  vl.textContent = fdef.name;
  vc.innerHTML = "";
  vh.innerHTML = "";
  
  var type = _typeFromChips(q);
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  var cache = _fieldCache[cacheKey] || {};
  var hist = cache.history || {};
  var recent = (hist[fdef.name]||[]).slice(0, 8);
  
  // Schema options (if field has predefined options)
  if (fdef.options && fdef.options.length) {
    vt.style.display = "none";
    fdef.options.forEach(function(opt) {
      var already = (q._chips||[]).some(function(c){
        return c.field===fdef.name && c.value===opt;
      });
      var chip = document.createElement("button");
      chip.className = "qb-chip"+(already?" active":"");
      chip.textContent = opt;
      chip.addEventListener("click", function() {
        _toggleValueChip(fdef.name, opt, q);
        chip.className = "qb-chip"+((q._chips||[]).some(function(c){
          return c.field===fdef.name&&c.value===opt;
        })?" active":"");
      });
      vc.appendChild(chip);
    });
    // Show history values below schema options (if any not in schema)
    if (recent.length) {
      vhl.style.display = "block";
      recent.forEach(function(val) {
        var already = (q._chips||[]).some(function(c){
          return c.field===fdef.name && c.value===val;
        });
        // Skip if already shown in schema options
        if (already || fdef.options.indexOf(val)!==-1) return;
        var chip = document.createElement("button");
        chip.className = "qb-chip";
        chip.style.fontSize = "12px";
        chip.style.padding = "4px 9px";
        chip.style.opacity = "0.7";
        chip.textContent = val;
        chip.addEventListener("click", function() {
          _toggleValueChip(fdef.name, val, q);
          closeValueArea();
        });
        vh.appendChild(chip);
      });
      // Hide "Recent:" label if no chips added
      if (!vh.children.length) vhl.style.display = "none";
    } else {
      vhl.style.display = "none";
    }
  } else {
    // No schema options - show history as chips, or text input
    if (recent.length) {
      vt.style.display = "none";
      recent.forEach(function(val) {
        var already = (q._chips||[]).some(function(c){
          return c.field===fdef.name && c.value===val;
        });
        var chip = document.createElement("button");
        chip.className = "qb-chip"+(already?" active":"");
        chip.textContent = val;
        chip.addEventListener("click", function() {
          _toggleValueChip(fdef.name, val, q);
          closeValueArea();
        });
        vc.appendChild(chip);
      });
      vhl.style.display = "none";
    } else {
      vt.style.display = "flex";
      setTimeout(function(){
        var inp = document.getElementById("qb-val-input");
        if (inp) inp.focus();
      },50);
      vhl.style.display = "none";
    }
  }
}

function _toggleValueChip(field, value, q) {
  var idx = (q._chips||[]).findIndex(function(c){
    return c.field===field&&c.value===value;
  });
  if (idx!==-1) q._chips.splice(idx,1);
  else q._chips.push({field,op:"=",value});
  
  _renderActiveChips(q);
  _updatePreview(q);
  triggerLivePreview();
  
  // Re-fetch fields when parent chips change (to update child field options and tags)
  var type = _typeFromChips(q);
  if (type && field !== "type") {
    _fetchFields(type, q, function() {
      _renderFieldChips(q);
      _renderTagsSection(q);
      _updateGroupSortDropdowns(q);
      closeValueArea();
    });
  }
}

function addTextChip() {
  if (!_cur) return;
  var q = _st.queries[_cur.name];
  var inp = document.getElementById("qb-val-input");
  var val = inp ? inp.value.trim() : "";
  if (!val||!q._activeField) return;
  q._chips = (q._chips||[]).filter(function(c){ return c.field!==q._activeField; });
  q._chips.push({field:q._activeField,op:"=",value:val});
  inp.value = "";
  closeValueArea();
  _renderFieldChips(q);
  _renderActiveChips(q);
  _updatePreview(q);
  triggerLivePreview();
}

function closeValueArea() {
  var va = document.getElementById("qb-value-area");
  if (va) va.style.display = "none";
  if (_cur&&_st.queries[_cur.name]) {
    _st.queries[_cur.name]._activeField = null;
    _renderFieldChips(_st.queries[_cur.name]);
  }
}

function _renderActiveChips(q) {
  var el = document.getElementById("qb-active-chips");
  if (!el) return;
  el.innerHTML = "";
  (q._chips||[]).filter(function(c){ return c.field!=="type"; })
  .forEach(function(c, i) {
    var chip = document.createElement("span");
    chip.className = "qb-active-chip";
    chip.innerHTML = _esc(c.field+c.op+c.value) +
      ' <button onclick="_removeActiveChip('+i+')">×</button>';
    el.appendChild(chip);
  });
}

window._removeActiveChip = function(visualIdx) {
  if (!_cur) return;
  var q = _st.queries[_cur.name];
  var nonType = (q._chips||[]).filter(function(c){ return c.field!=="type"; });
  var chipToRemove = nonType[visualIdx];
  if (!chipToRemove) return;
  var realIdx = (q._chips||[]).indexOf(chipToRemove);
  if (realIdx!==-1) q._chips.splice(realIdx,1);
  _renderFieldChips(q);
  _renderActiveChips(q);
  _updatePreview(q);
  triggerLivePreview();
};

function _updatePreview(q) {
  q.where = _buildWhereExpr(q);
  var el = document.getElementById("qb-preview");
  if (!el) return;
  var name = _cur?_cur.name:"query";
  var timeLabel = (function(){
    for (var i=0;i<_timeOpts.length;i++) if (_timeOpts[i][1]===q.time) return _timeOpts[i][0];
    return q.time;
  })();
  var lines = [];
  lines.push('<span class="p-dim">[</span><span class="p-name">'+_esc(name)+
             '</span><span class="p-dim">]</span>');
  if (q.where)
    lines.push('where = <span class="p-where">"'+_esc(q.where)+'"</span>');
  lines.push('time  = <span class="p-time">"'+_esc(q.time)+'"</span>'+
             '<span class="p-dim">  ← '+_esc(timeLabel)+'</span>');
  if (q.group)
    lines.push('group = <span class="p-opt">["'+_esc(q.group)+'"]</span>');
  if (q.sort)
    lines.push('sort  = <span class="p-opt">"'+_esc(q.sort)+'"</span>');
  if (q.search)
    lines.push('search = <span class="p-opt">"'+_esc(q.search)+'"</span>');
  if (q.sum)
    lines.push('sum   = <span class="p-opt">true</span>');
  el.innerHTML = lines.join("<br>");
  
  // Update advanced mode preview - show full expression including _exprManual
  var advPreview = document.getElementById("qb-where-preview");
  if (advPreview) {
    var fullExpr = _buildFullWhereExpr(q);
    if (fullExpr) {
      advPreview.textContent = "where = \"" + fullExpr + "\"";
    } else {
      advPreview.textContent = "# no filters";
    }
  }
}

// METRIC EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildMetricEditor(name) {
  var m = _st.metrics[name];
  var div = document.createElement("div");
  var qNames = Object.keys(_st.queries);

  // ── Derived metric: editable expression with reference inserter ───────────
  if (m.derived) {
    var refs = Object.keys(_st.queries).map(function(n){
      return '<option value="'+n+'">query: '+n+'</option>';
    }).join("") +
    Object.keys(_st.metrics).filter(function(n){ return n!==name && !_st.metrics[n].derived; })
      .map(function(n){
      return '<option value="'+n+'">metric: '+n+'</option>';
    }).join("");
    div.appendChild(_mkCard("Metric type",
      '<input type="text" value="Derived" readonly'+
      ' style="background:var(--accent-lt);color:var(--accent);font-weight:700;border-color:var(--accent);">'));
    div.appendChild(_mkCard("Expression",
      '<input type="text" id="m-derived" value="'+_esc(m.derived)+'"'+
      ' placeholder="e.g. income - expense"'+
      ' style="font-family:monospace;" oninput="_st.metrics[_cur.name].derived=this.value">',
      "Math expression using other metrics. Type or use the inserter below."));
    div.appendChild(_mkCard("Insert reference",
      '<select id="m-ref" onchange="insertDerivedRef(this.value); this.value=\'\';">'+
        '<option value="">— pick a query or metric —</option>'+refs+'</select>',
      "Select to insert with spaces for operators."));
    return div;
  }

  // ── Regular metric: show editor ───────────────────────────────────────────
  var kindMap = {
    avg:"Average — mean amount across records",
    sum:"Total — sum of amount field",
    max:"Maximum — highest amount",
    min:"Minimum — lowest amount",
    ratio:"Ratio — count(A) ÷ count(B) × 100%"
  };
  var kindOpts = Object.keys(kindMap).map(function(k){
    return '<option value="'+k+'"'+(k===m.kind?" selected":"")+'>'+kindMap[k]+'</option>';
  }).join("");
  div.appendChild(_mkCard("Metric type",
    '<select id="m-kind" onchange="onMetricKindChange(this.value)">'+kindOpts+'</select>'));

  // Base query dropdown (used by sum, avg, min, max)
  var baseOpts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base?" selected":"")+'>'+n+'</option>';
  }).join("");
  var baseRow = _mkCard("Base query",
    '<select id="m-base" onchange="_st.metrics[_cur.name].base=this.value">'+
    '<option value="">— pick a query —</option>'+baseOpts+'</select>',
    "Which base query to compute this metric on.");
  baseRow.id = "base-row";
  div.appendChild(baseRow);

  // Ratio: second query (denominator)
  var base2Opts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base2?" selected":"")+'>'+n+'</option>';
  }).join("");
  var r2 = _mkCard("Second query (ratio denominator)",
    '<select id="m-base2" onchange="_st.metrics[_cur.name].base2=this.value">'+
    '<option value="">— pick a query —</option>'+base2Opts+'</select>',
    "ratio = count(base query) ÷ count(second query) × 100%");
  r2.id = "ratio2-row";
  r2.style.display = m.kind==="ratio"?"block":"none";
  div.appendChild(r2);

  // Avg: unit_field and unit_weights
  var avgOpts = _mkCard("Unit field (optional)",
    '<input type="text" id="m-unit-field" value="'+_esc(m.unit_field||'')+'"'+
    ' placeholder="e.g. fit"'+
    ' oninput="_st.metrics[_cur.name].unit_field=this.value">',
    "Field to group by for weighted average.");
  avgOpts.id = "unit-field-row";
  avgOpts.style.display = m.kind==="avg"?"block":"none";
  div.appendChild(avgOpts);

  var weightsRow = document.createElement("div");
  weightsRow.className = "card"; weightsRow.style.marginBottom = "10px";
  weightsRow.id = "unit-weights-row";
  weightsRow.style.display = m.kind==="avg"?"block":"none";
  weightsRow.innerHTML =
    '<label>Unit weights (JSON)</label>'+
    '<textarea id="m-unit-weights" rows="4" placeholder="{ \&quot;monaural\&quot;: 1, \&quot;binaural\&quot;: 2 }"'+
    ' style="width:100%;font-family:monospace;font-size:13px;padding:8px;border-radius:8px;resize:vertical;"'+
    ' oninput="onUnitWeightsChange(this.value)">'+JSON.stringify(m.unit_weights||{},null,2)+'</textarea>'+
    '<div class="hint">Key-value pairs for weighted avg. Keys must match unit_field values.</div>';
  div.appendChild(weightsRow);

  // Raw extra config
  var rawKeys = Object.keys(m._raw || {});
  if (rawKeys.length > 0) {
    div.appendChild(_mkCard("Advanced / Raw config",
      '<textarea id="m-raw" rows="3" style="width:100%;font-family:monospace;font-size:12px;padding:8px;"'+
      ' oninput="onMetricRawChange(this.value)">'+JSON.stringify(m._raw||{},null,2)+'</textarea>',
      "Extra fields not handled by UI. Edit as JSON."));
  }

  return div;
}
function onMetricKindChange(kind) {
  _st.metrics[_cur.name].kind = kind;
  var r = document.getElementById("ratio2-row");
  if (r) r.style.display = kind==="ratio"?"block":"none";
  var u = document.getElementById("unit-field-row");
  if (u) u.style.display = kind==="avg"?"block":"none";
  var w = document.getElementById("unit-weights-row");
  if (w) w.style.display = kind==="avg"?"block":"none";
}
function onUnitWeightsChange(val) {
  if (!_cur || _cur.section !== "metrics") return;
  try {
    _st.metrics[_cur.name].unit_weights = JSON.parse(val || "{}");
  } catch(e) {}
}
function onMetricRawChange(val) {
  if (!_cur || _cur.section !== "metrics") return;
  try {
    _st.metrics[_cur.name]._raw = JSON.parse(val || "{}");
  } catch(e) {}
}

// DASHBOARD EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildDashEditor(name) {
  var db = _st.dashboards[name];
  var div = document.createElement("div");
  var card = document.createElement("div");
  card.className = "card"; card.style.marginBottom = "10px";
  var allNames = Object.keys(_st.queries).concat(Object.keys(_st.metrics));
  var opts = allNames.filter(function(n){ return db.metrics.indexOf(n)===-1; })
    .map(function(n){
      var m = _st.metrics[n];
      var tag = m ? (m.derived ? "derived" : "metric") : "query";
      return '<option value="'+n+'">'+n+' ('+tag+')</option>';
    }).join("");
  card.innerHTML =
    '<label>Items</label>'+
    '<div class="hint" style="margin-bottom:10px;">Choose queries and metrics to show on Home. Order matters.</div>'+
    '<div id="db-chips" class="chip-group" style="margin-bottom:10px;"></div>'+
    '<div style="display:flex;gap:8px;">'+
      '<select id="db-add-sel" style="flex:1;"><option value="">— add item —</option>'+opts+'</select>'+
      '<button onclick="addDashItem()" class="btn btn-ghost btn-sm">Add</button>'+
    '</div>';
  div.appendChild(card);
  // Defer renderChips until after div is in DOM
  setTimeout(function() { _renderDashChips(db); }, 0);
  return div;
}
function _renderDashChips(db) {
  var el = document.getElementById("db-chips");
  if (!el) return;
  el.innerHTML = "";
  (db.metrics||[]).forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "dash-chip";
    var m = _st.metrics[item];
    var tag = m ? (m.derived ? "derived" : "metric") : "query";
    chip.innerHTML =
      '<span style="color:var(--accent);opacity:.7;font-size:11px;margin-right:4px;">'+
      tag+'</span>'+
      item+
      ' <button onclick="removeDashItem('+i+')">×</button>';
    el.appendChild(chip);
  });
}
function addDashItem() {
  var sel = document.getElementById("db-add-sel");
  var item = sel.value; if (!item||!_cur) return;
  var db = _st.dashboards[_cur.name];
  if (db.metrics.indexOf(item)===-1) db.metrics.push(item);
  _renderDashChips(db);
  var opt = sel.querySelector('option[value="'+item+'"]');
  if (opt) opt.remove(); sel.value="";
}
function removeDashItem(idx) {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var removed = db.metrics.splice(idx,1)[0];
  _renderDashChips(db);
  var sel = document.getElementById("db-add-sel");
  if (sel && removed) {
    var opt = document.createElement("option");
    opt.value = removed; opt.textContent = removed; sel.appendChild(opt);
  }
}

// ── Shared helpers ────────────────────────────────────────────────────────────
function _mkCard(label, inputHTML, hint) {
  var w = document.createElement("div");
  w.className = "card"; w.style.marginBottom = "10px";
  w.innerHTML = '<label>'+label+'</label>'+inputHTML+
    (hint?'<div class="hint" style="margin-top:4px;">'+hint+'</div>':"");
  return w;
}
function _esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Delete ────────────────────────────────────────────────────────────────────
function askDelete() {
  if (!_cur) return;
  _delPending = {section:_cur.section, name:_cur.name};
  document.getElementById("del-msg-text").textContent =
    "Delete "+_cur.section.slice(0,-1)+" '"+_cur.name+"'?";
  document.getElementById("del-modal").style.display = "flex";
}
function closeDeleteModal() {
  _delPending = null;
  document.getElementById("del-modal").style.display = "none";
}
function confirmDelete() {
  if (!_delPending) return;
  var s=_delPending.section, n=_delPending.name;
  closeDeleteModal();
  // Due configs have no individual backend delete endpoint — remove from state
  // and immediately Save All so the deletion persists.
  if (s === "due") {
    delete _st.due[n]; _cur=null; renderTabs();
    document.getElementById("entry-editor").style.display = "none";
    document.getElementById("entry-empty").style.display  = "block";
    saveAll();
    return;
  }
  var kindMap = {queries:"query", metrics:"metric", aliases:"alias", dashboards:"dashboard"};
  fetch("/query-builder/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:n, kind:kindMap[s]||"query"})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.ok) {
      delete _st[s][n]; _cur=null; renderTabs();
      document.getElementById("entry-editor").style.display = "none";
      document.getElementById("entry-empty").style.display  = "block";
      showMsg("✔ Deleted",true);
    } else showMsg("✖ "+d.error,false);
  })
  .catch(function(e){ showMsg("✖ "+e,false); });
}

// ── Record delete from table ──────────────────────────────────────────────────
var _qbDelRecord = null;

function qbOpenDeleteRecord(r) {
  if (typeof r === "string") {
    try { r = JSON.parse(decodeURIComponent(r)); } catch(e) { return; }
  }
  if (!r || !r._line) return;
  _qbDelRecord = r;
  document.getElementById("rec-del-line").textContent = r._line;
  document.getElementById("rec-del-msg").style.display = "none";
  document.getElementById("rec-del-dialog").style.display = "flex";
}

function qbCloseDelete() {
  document.getElementById("rec-del-dialog").style.display = "none";
}

function qbDoDelete() {
  var r = _qbDelRecord;
  if (!r) return;
  var msg = document.getElementById("rec-del-msg");
  fetch("/api/records/delete", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      filepath: r._filepath,
      old_line: r._line,
      lineno: r._lineno
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(d) {
    if (d.ok) {
      qbCloseDelete();
      window.location.reload();
    } else {
      msg.textContent = d.error || "Delete failed";
      msg.style.display = "block";
    }
  })
  .catch(function(e) {
    msg.textContent = "Delete failed: " + String(e);
    msg.style.display = "block";
  });
}

document.getElementById("rec-del-dialog").addEventListener("click", function(e) {
  if (e.target === this) qbCloseDelete();
});

// ── Save all ──────────────────────────────────────────────────────────────────
function saveAll() {
  // sync all where expressions from chips before saving
  Object.keys(_st.queries).forEach(function(n) {
    _st.queries[n].where = _buildWhereExpr(_st.queries[n]);
  });
  var payload = { metrics:_st.metrics, dashboards:_st.dashboards, queries:{}, aliases:_st.aliases, due:_st.due };
  Object.entries(_st.queries).forEach(function(e) {
    var k=e[0],v=e[1];
    payload.queries[k] = {where:v.where,time:v.time,sum:v.sum,group:v.group,search:v.search,sort:v.sort};
  });
  var btn = document.getElementById("save-btn");
  btn.disabled=true; btn.textContent="Saving…";
  fetch("/query-builder/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    btn.disabled=false; btn.textContent="💾 Save All";
    if (d.ok) showMsg("✔ Saved to queries.toml",true);
    else      showMsg("✖ "+d.error,false);
  })
  .catch(function(e){
    btn.disabled=false; btn.textContent="💾 Save All";
    showMsg("✖ "+e,false);
  });
}

function showMsg(text, ok) {
  var el = document.getElementById("save-msg");
  el.textContent=text; el.style.color=ok?"var(--success)":"var(--error)";
  el.style.display="inline";
  if (ok) setTimeout(function(){ el.style.display="none"; },3000);
}

document.getElementById("del-modal").addEventListener("click", function(e) {
  if (e.target===this) closeDeleteModal();
});

// ── Live Records Preview ────────────────────────────────────────────────────────
function triggerLivePreview() {
  if (!_cur || _cur.section !== "queries") return;
  clearTimeout(_liveTimer);
  _liveTimer = setTimeout(() => {
    var area = document.getElementById("qb-live-area");
    if (!area) return;
    var q = _st.queries[_cur.name];
    var grpEl = document.getElementById("qb-group");
    var sortEl = document.getElementById("qb-sort");
    var group = grpEl ? grpEl.value : "";
    var sort = sortEl ? sortEl.value : "";
    area.innerHTML = '<div style="color:var(--sub);padding:16px;">Loading…</div>';
    fetch("/browse/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({where: _buildChipFilters(q), expr: q._exprManual || "", time: q.time || "tm", group: group, sort: sort})
    })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { area.innerHTML = '<div style="color:var(--error);padding:16px;">'+_esc(d.error)+'</div>'; return; }
      var recs = d.data;
      if (recs.kind === "group") {
        area.innerHTML = '<div style="margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:13px;">' +
          '<span>' + (recs.grand_count || 0) + ' records</span>' +
          summaryBar(recs) +
'</div>' +
           '<table class="data-table"><thead><tr><th>Group</th><th>Count</th>' +
           (recs.has_amount ? '<th style="text-align:right">Total</th>' : '') + '</tr></thead><tbody>' +
           (recs.rows || []).map(r => '<tr><td>'+_esc(r.key)+'</td><td>'+r.count+'</td>' + (recs.has_amount ? '<td style="text-align:right">'+(r.total_fmt||'')+'</td>' : '') + '</tr>').join('') +
           '</tbody></table>';
      } else if (recs.records && recs.records.length) {
        var cols = recs.columns || [];
        window._qbCols = cols;
        window._qbRecords = recs.records;
        area.innerHTML = '<div style="margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:13px;">' +
          '<span>' + recs.records.length + ' records</span>' +
          summaryBar(recs) +
           '</div>' +
           '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;">' +
           '<table class="data-table" id="qb-table"><thead><tr>' +
           cols.map(c => '<th class="sortable" onclick="qbSortTable(this,\''+c.replace(/'/g,"\\'")+'\')">'+_esc(c)+'</th>').join('') +
           '<th style="width:80px"></th></tr></thead><tbody id="qb-tbody">' +
recs.records.map(r => '<tr>' + cols.map(c => '<td>'+_esc(r[c]||'')+'</td>').join('') +
            (r._line ? '<td style="white-space:nowrap;"><a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;" href="/edit?filepath='+encodeURIComponent(r._filepath)+'&lineno='+r._lineno+'&line='+encodeURIComponent(r._line)+'&return_to=/query-builder">✎</a> <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);" onclick="qbOpenDeleteRecord(\''+encodeURIComponent(JSON.stringify(r))+'\')">✕</button></td>' : '<td></td>') +
           '</tr>').join('') +
           '</tbody></table></div>';
      } else {
        area.innerHTML = '<div style="color:var(--sub);padding:16px;">No records found.</div>';
      }
    })
    .catch(e => { area.innerHTML = '<div style="color:var(--error);padding:16px;">'+_esc(String(e))+'</div>'; });
  }, 400);
}

function summaryBar(d) {
  var parts = [];
  if (d.total_fmt) parts.push('<span>Total: <strong>'+d.total_fmt+'</strong></span>');
  if (d.avg_fmt)   parts.push('<span>Avg: <strong>'+d.avg_fmt+'</strong></span>');
  if (d.time_label) parts.push('<span style="color:var(--sub);">'+d.time_label+'</span>');
  return parts.length ? '<div style="display:flex;gap:12px;">' + parts.join('') + '</div>' : '';
}

var _qbSortCol = null;
var _qbSortAsc = true;

function qbSortTable(th, col) {
  const data = window._qbRecords;
  if (!data) return;
  
  if (_qbSortCol === col) {
    _qbSortAsc = !_qbSortAsc;
  } else {
    _qbSortCol = col;
    _qbSortAsc = true;
  }
  
  document.querySelectorAll("#qb-table th.sortable").forEach(h => h.classList.remove("sort-asc","sort-desc"));
  th.classList.add(_qbSortAsc ? "sort-asc" : "sort-desc");
  
  const colLower = col.toLowerCase();
  const sorted = [...data].sort((a, b) => {
    const ak = Object.keys(a).find(k => k.toLowerCase() === colLower) || col;
    const bk = Object.keys(b).find(k => k.toLowerCase() === colLower) || col;
    let va = a[ak] || "", vb = b[bk] || "";
    const na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return _qbSortAsc ? na - nb : nb - na;
    if (/^\d{4}-\d{2}-\d{2}/.test(va) && /^\d{4}-\d{2}-\d{2}/.test(vb)) {
      return _qbSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return _qbSortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  
  const cols = window._qbCols || [];
  const tbody = document.getElementById("qb-tbody");
  if (!tbody) return;
  tbody.innerHTML = sorted.map(r => '<tr>' + cols.map(c => {
    const rk = Object.keys(r).find(k => k.toLowerCase() === c.toLowerCase()) || c;
    return '<td>'+_esc(r[rk]||'')+'</td>';
  }).join('') +
  (r._line ? '<td style="white-space:nowrap;"><a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;" href="/edit?filepath='+encodeURIComponent(r._filepath)+'&lineno='+r._lineno+'&line='+encodeURIComponent(r._line)+'&return_to=/query-builder">✎</a> <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);" onclick="qbOpenDeleteRecord(\''+encodeURIComponent(JSON.stringify(r))+'\')">✕</button></td>' : '<td></td>') +
  '</tr>').join('');
  
  window._qbRecords = sorted;
}

function showDueEditor() {

  var empty = document.getElementById("entry-empty");
  ed.style.display = "block";
  empty.style.display = "none";
  
  var cfg = _st.due[_cur.name] || {};
  var typeName = cfg.type || "followup";
  ed.innerHTML = '<div class="card" style="margin-bottom:12px;">'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'+
      '<div style="flex:1;"><label>Name</label>'+
        '<input type="text" id="due-name-input" value="'+_esc(_cur.name)+'" oninput="onDueNameChange()"'+
        ' style="font-size:16px;font-weight:700;"></div>'+
      '<div style="margin-top:18px;">'+
        '<button onclick="askDelete()" class="btn btn-ghost btn-sm"'+
        ' style="color:var(--error);border-color:var(--error);">Delete</button>'+
      '</div>'+
    '</div>'+
    '<div style="font-size:11px;color:var(--sub);margin-top:6px;margin-bottom:14px;">Due config — records overdue check for this type</div>'+
    '<div style="margin-bottom:14px;">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:6px;">Record Type</div>'+
      '<div id="due-type-chips" class="chip-group"></div>'+
    '</div>'+
    '<div style="margin-bottom:14px;">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:6px;">Group By (Key Field)</div>'+
      '<div id="due-key-chips" class="chip-group"></div>'+
    '</div>'+
    '<div style="margin-bottom:14px;">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:6px;">Sort By</div>'+
      '<div id="due-sort-chips" class="chip-group"></div>'+
    '</div>'+
    '<div style="margin-bottom:14px;">'+
      '<div style="font-size:12px;font-weight:700;margin-bottom:6px;">Days Overdue</div>'+
      '<input type="number" id="due-days" value="'+(cfg.days||7)+'" onchange="onDueDaysChange()" style="font-size:14px;padding:6px;width:80px;">'+
    '</div>'+

      '<div style="font-size:12px;font-weight:700;margin-bottom:6px;">Exclude Results</div>'+
      '<div id="due-exclude-chips" class="chip-group" style="margin-bottom:6px;"></div>'+
      '<div style="display:flex;gap:6px;">'+
        '<input type="text" id="due-exclude-input" placeholder="add value…" style="flex:1;font-size:13px;padding:6px;" onkeydown="if(event.key===\'Enter\') addDueExclude()">'+
        '<button onclick="addDueExclude()" class="btn btn-ghost btn-sm">Add</button>'+
      '</div>'+
    '</div>'+
  '</div>';
  
  renderDueTypeChips(typeName);
  fetchDueFieldsForType(typeName);
}

function renderDueTypeChips(selected) {
  var el = document.getElementById("due-type-chips");
  if (!el) return;
  el.innerHTML = "";
  _types.forEach(function(t) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (t===selected ? " active" : "");
    chip.textContent = t;
    chip.addEventListener("click", function() {
      var cfg = _st.due[_cur.name];
      if (cfg) {
        cfg.type = t;
        cfg.key = "";
        cfg.sort_by = "";
      }
      renderDueTypeChips(t);
      fetchDueFieldsForType(t);
    });
    el.appendChild(chip);
  });
}

function fetchDueFieldsForType(typeName) {
  var keyEl = document.getElementById("due-key-chips");
  var sortEl = document.getElementById("due-sort-chips");
  if (!keyEl || !sortEl) return;
  
  keyEl.innerHTML = '<span style="font-size:12px;color:var(--border);">Loading…</span>';
  sortEl.innerHTML = '<span style="font-size:12px;color:var(--border);">Loading…</span>';
  
  fetch("/api/type_fields/"+encodeURIComponent(typeName))
  .then(function(r){ return r.json(); })
  .then(function(data) {
    var fields = (data.fields||[]).filter(function(f){ return !f.is_int && f.name!=="type"; });
    var cfg = _st.due[_cur.name] || {};
    
    // Render Key chips
    keyEl.innerHTML = "";
    fields.forEach(function(f) {
      var chip = document.createElement("button");
      chip.className = "qb-chip" + (f.name === cfg.key ? " active" : "");
      chip.textContent = f.name;
      chip.addEventListener("click", function() {
        _st.due[_cur.name].key = (_st.due[_cur.name].key === f.name) ? "" : f.name;
        renderDueKeyChips(fields);
      });
      keyEl.appendChild(chip);
    });
    
    // Render Sort chips
    sortEl.innerHTML = "";
    fields.forEach(function(f) {
      var chip = document.createElement("button");
      chip.className = "qb-chip" + (f.name === cfg.sort_by ? " active" : "");
      chip.textContent = f.name;
      chip.addEventListener("click", function() {
        _st.due[_cur.name].sort_by = (_st.due[_cur.name].sort_by === f.name) ? "" : f.name;
        renderDueSortChips(fields);
      });
      sortEl.appendChild(chip);
    });
    
    // Render exclude chips
    renderDueExcludeChips();
  })
  .catch(function(){
    keyEl.innerHTML = '<span style="font-size:12px;color:var(--error);">Error loading</span>';
    sortEl.innerHTML = '<span style="font-size:12px;color:var(--error);">Error loading</span>';
  });
}

function renderDueKeyChips(fields) {
  var el = document.getElementById("due-key-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name] || {};
  el.innerHTML = "";
  fields.forEach(function(f) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (f.name === cfg.key ? " active" : "");
    chip.textContent = f.name;
    chip.addEventListener("click", function() {
      _st.due[_cur.name].key = (_st.due[_cur.name].key === f.name) ? "" : f.name;
      renderDueKeyChips(fields);
    });
    el.appendChild(chip);
  });
}

function renderDueSortChips(fields) {
  var el = document.getElementById("due-sort-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name] || {};
  el.innerHTML = "";
  fields.forEach(function(f) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (f.name === cfg.sort_by ? " active" : "");
    chip.textContent = f.name;
    chip.addEventListener("click", function() {
      _st.due[_cur.name].sort_by = (_st.due[_cur.name].sort_by === f.name) ? "" : f.name;
      renderDueSortChips(fields);
    });
    el.appendChild(chip);
  });
}

function onDueSortChange() {
  var sel = document.getElementById("due-sort");
  if (!sel) return;
  _st.due[_cur.name].sort_by = sel.value;
}

function onDueDaysChange() {
  var inp = document.getElementById("due-days");
  if (!inp) return;
  _st.due[_cur.name].days = parseInt(inp.value) || 7;
}

function onDueNameChange() {
  var inp = document.getElementById("due-name-input");
  if (!inp) return;
  var newName = inp.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  var old = _cur.name;
  if (!newName || newName === old || _st.due[newName]) return;
  _st.due[newName] = _st.due[old];
  delete _st.due[old];
  _cur.name = newName;
  renderDueTabs();
}

function renderDueExcludeChips() {
  var el = document.getElementById("due-exclude-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name];
  if (!cfg) return;
  el.innerHTML = "";
  var list = cfg.exclude_results || [];
  list.forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "qb-active-chip";
    chip.innerHTML = item+' <button onclick="removeDueExclude('+i+')">×</button>';
    el.appendChild(chip);
  });
}

function addDueExclude() {
  var inp = document.getElementById("due-exclude-input");
  var val = inp.value.trim();
  if (!val) return;
  var cfg = _st.due[_cur.name];
  if (!cfg) return;
  if (!cfg.exclude_results) cfg.exclude_results = [];
  if (cfg.exclude_results.indexOf(val)===-1) cfg.exclude_results.push(val);
  inp.value = "";
  renderDueExcludeChips();
}

function removeDueExclude(idx) {
  var cfg = _st.due[_cur.name];
  if (!cfg || !cfg.exclude_results) return;
  cfg.exclude_results.splice(idx, 1);
  renderDueExcludeChips();
}

function addNewDue() {
  var name = prompt("New due config name (e.g., followup, assessment, investment):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  if (!name || _st.due[name]) { alert("Invalid or already exists"); return; }
  _st.due[name] = {
    type: "followup",
    key: "client",
    sort_by: "intent",
    days: 7,
    exclude_results: []
  };
  select("due", name);
}

// Query builder month picker
(function() {
  var MONTHS  = ["Jan","Feb","Mar","Apr","May","Jun",
                 "Jul","Aug","Sep","Oct","Nov","Dec"];
  var yearMin = {{ year_range[0] }};
  var yearMax = {{ year_range[-1] }};
  var selYear = new Date().getFullYear();
  var selMonth = null;

  function render() {
    document.getElementById("qb-picker-year").textContent = selYear;
    var grid = document.getElementById("qb-picker-grid");
    grid.innerHTML = "";
    MONTHS.forEach(function(name, i) {
      var mm = String(i + 1).padStart(2, "0");
      var active = (selMonth === mm);
      var btn = document.createElement("button");
      btn.textContent = name;
      btn.style.cssText =
        "padding:9px 0;border-radius:8px;cursor:pointer;font-size:13px;" +
        "border:1px solid " + (active ? "var(--accent)" : "var(--border)") + ";" +
        "background:"       + (active ? "var(--accent)" : "var(--bg)")     + ";" +
        "color:"            + (active ? "#fff"           : "var(--text)")  + ";" +
        "font-weight:"      + (active ? "700"            : "400")          + ";";
      btn.addEventListener("click", function() {
        selMonth = mm;
        qbClose();
        document.getElementById("qb-month-text").textContent =
          selYear + "-" + mm;
        _updateQ("time", selYear + "-" + mm);
      });
      grid.appendChild(btn);
    });
  }

  window.qbShiftYear = function(d) {
    var n = selYear + d;
    if (n < yearMin || n > yearMax) return;
    selYear = n; render();
  };

  window.qbTogglePicker = function(e) {
    e.stopPropagation();
    var pop = document.getElementById("qb-month-picker-popup");
    if (pop.style.display === "none") {
      render();
      var btn  = document.getElementById("qb-month-picker-btn");
      var rect = btn.getBoundingClientRect();
      pop.style.top  = (rect.bottom + window.scrollY + 6) + "px";
      var POP_W = 260;
      pop.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - POP_W)) + "px";
      pop.style.display = "block";
    } else { qbClose(); }
  };

  function qbClose() {
    document.getElementById("qb-month-picker-popup").style.display = "none";
  }
  window._qbCloseMonthPicker = qbClose;
  window._qbGetCustomTime = function() {
    return selMonth ? selYear + "-" + selMonth : null;
  };
})();

window.qbOnTimeChange = function(val) {
  var div = document.getElementById("qb-custom-time");
  if (val === "custom") {
    div.style.display = "block";
  } else {
    div.style.display = "none";
    window._qbCloseMonthPicker();
    if (val) _updateQ("time", val);
  }
};

</script>
