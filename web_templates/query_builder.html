{% extends "base.html" %}
{% block content %}

<div class="page-title">Query Builder</div>

<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;">
  <button onclick="addEntry('queries')"    class="btn btn-primary btn-sm">+ Query</button>
  <button onclick="addEntry('metrics')"    class="btn btn-ghost   btn-sm">+ Metric</button>
  <button onclick="addEntry('dashboards')" class="btn btn-ghost   btn-sm">+ Dashboard</button>
  <button onclick="saveAll()" class="btn btn-success btn-sm" id="save-btn">💾 Save All</button>
  <div id="save-msg" style="font-size:13px;display:none;"></div>
</div>

<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">

  <!-- ── Left panel ── -->
  <div id="entry-list"
       style="width:160px;flex-shrink:0;background:var(--card);
              border:1px solid var(--border);border-radius:12px;padding:10px;">
    <div class="panel-section-label">QUERIES</div>
    <div id="tabs-queries"></div>
    <div class="panel-section-label" style="margin-top:12px;">METRICS</div>
    <div id="tabs-metrics"></div>
    <div class="panel-section-label" style="margin-top:12px;">DASHBOARDS</div>
    <div id="tabs-dashboards"></div>
  </div>

  <!-- ── Right panel: editor + preview ── -->
  <div style="flex:1;min-width:280px;">
    <div id="entry-editor" style="display:none;"></div>
    <div id="preview-area" style="display:none;margin-top:12px;"></div>
    <div id="entry-empty"
         style="padding:48px;text-align:center;color:var(--sub);font-size:14px;">
      Select an entry on the left, or add a new one above.
    </div>
  </div>

</div>

<!-- delete confirm modal -->
<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:300px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;color:var(--error);margin-bottom:10px;">Delete?</div>
    <div id="del-msg-text" style="font-size:14px;color:var(--sub);margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="confirmDelete()" class="btn btn-sm"
              style="flex:1;background:var(--error);color:#fff;border:none;">Delete</button>
      <button onclick="closeDeleteModal()" class="btn btn-ghost btn-sm" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<style>
  .panel-section-label {
    font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;margin-bottom:6px;
  }
  .q-tab {
    display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;
    border:none;background:none;font-size:13px;font-weight:600;color:var(--sub);
    cursor:pointer;margin-bottom:2px;transition:all .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .q-tab:hover  { background:var(--bg); color:var(--text); }
  .q-tab.active { background:var(--accent-lt); color:var(--accent); }
  .dash-chip {
    display:inline-flex;align-items:center;gap:4px;padding:5px 11px;
    border-radius:20px;font-size:13px;font-weight:600;
    background:var(--card);border:1.5px solid var(--border);color:var(--text);margin:3px;
  }
  .dash-chip button { background:none;border:none;color:var(--sub);
                      cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700; }
  /* chip filter styles (matches browse) */
  .chip-filter-btn {
    padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--bg);border:1.5px solid var(--border);color:var(--text);transition:all .15s;
  }
  .chip-filter-btn.active { background:var(--accent);border-color:var(--accent);color:#fff; }
  .chip-filter-btn.has-filter { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .active-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
    border-radius:20px;font-size:13px;font-weight:600;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);margin:3px;
  }
  .active-chip button { background:none;border:none;color:var(--accent);
                        cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════════════
var _st  = { queries: {}, metrics: {}, dashboards: {} };
var _cur = null;          // {section, name}
var _delPending = null;
var _previewTimer = null;

// chip builder state (per query)
var _cb = {
  type:         "",       // selected type
  fieldDefs:    [],       // [{name, options, is_int}]
  activeFilters:[],       // [{field, op, value}]
  activeField:  null,     // field chip currently expanded
};

var _types    = {{ types | tojson }};
var _timeOpts = {{ time_options | tojson }};

// ════════════════════════════════════════════════════════════════════════════
// Boot: load from server data
// ════════════════════════════════════════════════════════════════════════════
(function() {
  var q = {{ queries | tojson }};
  var reserved = ["metrics", "dashboards", "due"];

  Object.entries(q).forEach(function(e) {
    var k = e[0], v = e[1];
    if (reserved.indexOf(k) !== -1 || typeof v !== "object") return;
    _st.queries[k] = {
      where:  v.where  || "",
      time:   v.time   || "tm",
      sum:    !!v.sum,
      group:  Array.isArray(v.group) ? v.group[0] : (v.group || ""),
      search: v.search || "",
    };
  });

  Object.entries(q.metrics || {}).forEach(function(e) {
    var k = e[0], m = e[1];
    var kind = "avg", base = "", base2 = "";
    if ("ratio" in m && Array.isArray(m.ratio)) {
      kind = "ratio"; base = m.ratio[0]||""; base2 = m.ratio[1]||"";
    } else if ("avg" in m)  { kind="avg";  base=m.avg;  }
    else if   ("sum" in m)  { kind="sum";  base=m.sum;  }
    else if   ("max" in m)  { kind="max";  base=m.max;  }
    else if   ("min" in m)  { kind="min";  base=m.min;  }
    _st.metrics[k] = {kind, base, base2};
  });

  Object.entries(q.dashboards || {}).forEach(function(e) {
    _st.dashboards[e[0]] = { metrics: e[1].metrics || [] };
  });

  renderTabs();

  // auto-select from URL ?edit=name&section=queries
  var params  = new URLSearchParams(window.location.search);
  var editN   = params.get("edit");
  var editSec = params.get("section") || "queries";
  if (editN && _st[editSec] && _st[editSec][editN]) {
    select(editSec, editN);
  } else {
    var first = Object.keys(_st.queries)[0];
    if (first) select("queries", first);
  }
})();

// ════════════════════════════════════════════════════════════════════════════
// Tab rendering
// ════════════════════════════════════════════════════════════════════════════
function renderTabs() {
  ["queries","metrics","dashboards"].forEach(function(sec) {
    var el   = document.getElementById("tabs-" + sec);
    var data = _st[sec];
    el.innerHTML = "";
    if (!Object.keys(data).length) {
      var ph = document.createElement("div");
      ph.style.cssText = "font-size:12px;color:var(--border);padding:4px 8px;";
      ph.textContent   = "none";
      el.appendChild(ph); return;
    }
    Object.keys(data).forEach(function(name) {
      var btn = document.createElement("button");
      btn.className = "q-tab" +
        (_cur && _cur.section===sec && _cur.name===name ? " active" : "");
      btn.textContent = name;
      btn.title       = name;
      btn.addEventListener("click", function() { select(sec, name); });
      el.appendChild(btn);
    });
  });
}

// ════════════════════════════════════════════════════════════════════════════
// Select
// ════════════════════════════════════════════════════════════════════════════
function select(section, name) {
  _cur = { section, name };
  // reset chip builder when switching queries
  if (section === "queries") resetChipBuilder();
  renderTabs();
  document.getElementById("entry-editor").style.display = "block";
  document.getElementById("entry-empty").style.display  = "none";
  renderEditor();
}

// ════════════════════════════════════════════════════════════════════════════
// Add new
// ════════════════════════════════════════════════════════════════════════════
function addEntry(section) {
  var name = prompt("Name (lowercase, underscores):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
  if (!name) return;
  if (_st[section][name]) { alert("'" + name + "' already exists."); return; }

  if (section === "queries")    _st.queries[name]    = {where:"",time:"tm",sum:false,group:"",search:""};
  else if (section === "metrics")   _st.metrics[name]   = {kind:"avg",base:"",base2:""};
  else                              _st.dashboards[name] = {metrics:[]};

  renderTabs();
  select(section, name);
}

// ════════════════════════════════════════════════════════════════════════════
// Rename
// ════════════════════════════════════════════════════════════════════════════
function onNameChange() {
  var newName = document.getElementById("ed-name").value.trim()
                       .toLowerCase().replace(/[^a-z0-9_]/g,"_");
  var s = _cur.section, old = _cur.name;
  if (!newName || newName === old || _st[s][newName]) return;
  _st[s][newName] = _st[s][old];
  delete _st[s][old];
  _cur.name = newName;
  renderTabs();
}

// ════════════════════════════════════════════════════════════════════════════
// Editor shell
// ════════════════════════════════════════════════════════════════════════════
function renderEditor() {
  var ed = document.getElementById("entry-editor");
  ed.innerHTML = "";
  document.getElementById("preview-area").style.display = "none";
  if (!_cur) return;
  var s = _cur.section, n = _cur.name;

  // header
  var hdr = document.createElement("div");
  hdr.className = "card";
  hdr.style.marginBottom = "12px";
  hdr.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<div style="flex:1;">' +
        '<label>Name</label>' +
        '<input type="text" id="ed-name" value="' + escAttr(n) +
        '" style="font-size:16px;font-weight:700;" oninput="onNameChange()">' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:18px;">' +
        (s==="queries"
          ? '<button onclick="runPreview()" class="btn btn-ghost btn-sm">▶ Preview</button>' : "") +
        '<button onclick="askDelete()" class="btn btn-ghost btn-sm"' +
        ' style="color:var(--error);border-color:var(--error);">Delete</button>' +
      '</div>' +
    '</div>' +
    '<div class="hint" style="margin-top:6px;">' +
      (s==="queries" ? "Base query — define filters, time window, and options" :
       s==="metrics" ? "Metric — computed value over a base query" :
                       "Dashboard — group of items shown on the Home screen") +
    '</div>';
  ed.appendChild(hdr);

  if (s === "queries")         ed.appendChild(makeQueryEditor(n));
  else if (s === "metrics")    ed.appendChild(makeMetricEditor(n));
  else                         ed.appendChild(makeDashboardEditor(n));
}

// ════════════════════════════════════════════════════════════════════════════
// Query editor with chip filter builder
// ════════════════════════════════════════════════════════════════════════════
function makeQueryEditor(name) {
  var q   = _st.queries[name];
  var div = document.createElement("div");

  // ── Type picker ──
  var typeCard = document.createElement("div");
  typeCard.className = "card";
  typeCard.style.marginBottom = "10px";
  var typeOpts = '<option value="">All types</option>' +
    _types.map(function(t) {
      return '<option value="'+t+'"' + (t===_cb.type?' selected':'') + '>'+t+'</option>';
    }).join("");
  typeCard.innerHTML =
    '<label>Record type</label>' +
    '<select id="cb-type-sel" onchange="onCbTypeChange(this.value)">' + typeOpts + '</select>' +
    '<div class="hint" style="margin-top:4px;">Pick a type to get field filter chips below.</div>';
  div.appendChild(typeCard);

  // ── Active filter chips ──
  var activeCard = document.createElement("div");
  activeCard.id        = "cb-active-card";
  activeCard.className = "card";
  activeCard.style.cssText = "margin-bottom:10px;display:none;";
  activeCard.innerHTML =
    '<div class="panel-section-label" style="margin-bottom:8px;">ACTIVE FILTERS</div>' +
    '<div id="cb-active-chips" class="chip-group"></div>';
  div.appendChild(activeCard);

  // ── Field chip row ──
  var fieldCard = document.createElement("div");
  fieldCard.id        = "cb-field-card";
  fieldCard.className = "card";
  fieldCard.style.cssText = "margin-bottom:10px;display:none;";
  fieldCard.innerHTML =
    '<div class="panel-section-label" style="margin-bottom:8px;">FILTER BY</div>' +
    '<div id="cb-field-chips" class="chip-group"></div>' +
    '<div id="cb-value-row" style="display:none;margin-top:10px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
        '<div class="panel-section-label"><span id="cb-value-label"></span></div>' +
        '<button onclick="closeCbValueRow()" style="background:none;border:none;' +
        'font-size:16px;color:var(--sub);cursor:pointer;padding:0;">✕</button>' +
      '</div>' +
      '<div id="cb-value-chips" class="chip-group"></div>' +
      '<div id="cb-value-text-row" style="display:none;margin-top:8px;display:flex;gap:8px;">' +
        '<input type="text" id="cb-value-text" placeholder="type a value…"' +
        ' style="flex:1;font-size:14px;" onkeydown="if(event.key===\'Enter\')addCbTextFilter()">' +
        '<button onclick="addCbTextFilter()" class="btn btn-ghost btn-sm">Add</button>' +
      '</div>' +
    '</div>';
  div.appendChild(fieldCard);

  // ── Expression filter (power mode) ──
  var exprCard = document.createElement("div");
  exprCard.className = "card";
  exprCard.style.marginBottom = "10px";
  exprCard.innerHTML =
    '<label style="display:flex;align-items:center;justify-content:space-between;">' +
      '<span>Expression filter</span>' +
      '<button onclick="toggleCbExpr()" id="cb-expr-toggle"' +
      ' style="background:none;border:none;font-size:11px;color:var(--accent);' +
      'cursor:pointer;font-weight:600;padding:0;">' +
      (q.where && !_cb.activeFilters.length ? 'hide' : 'show') + '</button>' +
    '</label>' +
    '<div id="cb-expr-row" style="display:' + (q.where && !_cb.activeFilters.length ? 'block' : 'none') + ';">' +
      '<input type="text" id="cb-expr-inp"' +
      ' value="' + escAttr(q.where) + '"' +
      ' placeholder="type=expense AND domain=self"' +
      ' style="font-family:monospace;font-size:13px;"' +
      ' oninput="syncExprToState()">' +
      '<div class="hint" style="margin-top:4px;">' +
        '= != &gt; &lt; &gt;= &lt;= ~(contains) !~(not contains) · AND OR NOT ( )' +
      '</div>' +
    '</div>';
  div.appendChild(exprCard);

  // ── Time ──
  var timeCard = document.createElement("div");
  timeCard.className = "card";
  timeCard.style.marginBottom = "10px";
  var timeOpts = _timeOpts.map(function(o) {
    return '<option value="'+o[1]+'"'+(o[1]===q.time?' selected':'')+'>'+o[0]+'</option>';
  }).join("");
  timeCard.innerHTML =
    '<label>Default time window</label>' +
    '<select id="cb-time-sel" onchange="_st.queries[_cur.name].time=this.value;schedulePreview()">' +
    timeOpts + '</select>';
  div.appendChild(timeCard);

  // ── Options ──
  var optCard = document.createElement("div");
  optCard.className = "card";
  optCard.style.marginBottom = "10px";
  optCard.innerHTML =
    '<label>Group by (optional)</label>' +
    '<input type="text" id="cb-group" value="' + escAttr(q.group) + '"' +
    ' placeholder="domain or category…"' +
    ' oninput="_st.queries[_cur.name].group=this.value;schedulePreview()">' +
    '<div class="hint" style="margin-top:4px;">Group results by a field value.</div>' +

    '<label style="margin-top:12px;display:block;">Search (optional)</label>' +
    '<input type="text" id="cb-search" value="' + escAttr(q.search) + '"' +
    ' placeholder="keyword…"' +
    ' oninput="_st.queries[_cur.name].search=this.value;schedulePreview()">' +

    '<label style="margin-top:12px;display:flex;align-items:center;gap:10px;cursor:pointer;">' +
      '<input type="checkbox" id="cb-sum"' + (q.sum?" checked":"") +
      ' onchange="_st.queries[_cur.name].sum=this.checked" ' +
      'style="width:18px;height:18px;accent-color:var(--accent);">' +
      '<span><strong>Sum amount</strong> — show total across records</span>' +
    '</label>';
  div.appendChild(optCard);

  // if a type was already set in the where expression, try to restore it
  if (q.where && !_cb.type) {
    var m = q.where.match(/\btype=([a-z_]+)/);
    if (m && _types.indexOf(m[1]) !== -1) {
      // silently load field defs for that type
      _cb.type = m[1];
      setTimeout(function() {
        var sel = document.getElementById("cb-type-sel");
        if (sel) sel.value = _cb.type;
        loadFieldDefs(_cb.type, false);
      }, 50);
    }
  }

  return div;
}

// ── Chip builder logic ────────────────────────────────────────────────────────
function resetChipBuilder() {
  _cb.type          = "";
  _cb.fieldDefs     = [];
  _cb.activeFilters = [];
  _cb.activeField   = null;
}

function cbFiltersWhere() {
  return _cb.activeFilters.map(function(f) { return f.field + f.op + f.value; });
}

function onCbTypeChange(type) {
  _cb.type          = type;
  _cb.fieldDefs     = [];
  _cb.activeFilters = [];
  _cb.activeField   = null;
  renderCbActiveChips();
  document.getElementById("cb-field-chips").innerHTML = "";
  document.getElementById("cb-value-row").style.display = "none";

  // add type to where
  syncCbToState();

  if (!type) {
    document.getElementById("cb-field-card").style.display  = "none";
    document.getElementById("cb-active-card").style.display = "none";
    schedulePreview();
    return;
  }
  loadFieldDefs(type, true);
}

function loadFieldDefs(type, doPreview) {
  fetch("/api/type_fields/" + encodeURIComponent(type))
  .then(function(r){ return r.json(); })
  .then(function(data) {
    _cb.fieldDefs = (data.fields||[]).filter(function(f) { return !f.is_int; });
    document.getElementById("cb-field-card").style.display = "block";
    renderCbFieldChips();
    if (doPreview) schedulePreview();
  });
}

function renderCbFieldChips() {
  var row = document.getElementById("cb-field-chips");
  row.innerHTML = "";
  _cb.fieldDefs.forEach(function(f) {
    var isActive  = (_cb.activeField === f.name);
    var hasFilter = _cb.activeFilters.some(function(af){ return af.field===f.name; });
    var btn = document.createElement("button");
    btn.className = "chip-filter-btn" +
      (isActive ? " active" : hasFilter ? " has-filter" : "");
    btn.textContent = f.name;
    btn.addEventListener("click", function(){ selectCbField(f.name); });
    row.appendChild(btn);
  });
}

function selectCbField(fname) {
  if (_cb.activeField === fname) { closeCbValueRow(); return; }
  _cb.activeField = fname;
  renderCbFieldChips();
  var fdef = _cb.fieldDefs.find(function(f){ return f.name===fname; });
  if (!fdef) return;

  document.getElementById("cb-value-label").textContent = fname;
  var vrow     = document.getElementById("cb-value-row");
  var vchips   = document.getElementById("cb-value-chips");
  var vtextRow = document.getElementById("cb-value-text-row");
  vchips.innerHTML = "";
  vrow.style.display = "block";

  if (fdef.options && fdef.options.length) {
    vtextRow.style.display = "none";
    fdef.options.forEach(function(opt) {
      var already = _cb.activeFilters.some(function(af){
        return af.field===fname && af.value===opt;
      });
      var chip = document.createElement("button");
      chip.textContent = opt;
      chip.className = "chip-filter-btn" + (already ? " active" : "");
      chip.addEventListener("click", function() {
        if (already) {
          _cb.activeFilters = _cb.activeFilters.filter(function(af){
            return !(af.field===fname && af.value===opt);
          });
          renderCbActiveChips(); syncCbToState(); schedulePreview();
          selectCbField(fname);
        } else {
          pushCbFilter(fname, "=", opt);
          closeCbValueRow();
        }
      });
      vchips.appendChild(chip);
    });
  } else {
    vtextRow.style.display = "flex";
    setTimeout(function(){ var i=document.getElementById("cb-value-text"); if(i) i.focus(); }, 50);
  }
}

function closeCbValueRow() {
  _cb.activeField = null;
  document.getElementById("cb-value-row").style.display = "none";
  renderCbFieldChips();
}

function addCbTextFilter() {
  if (!_cb.activeField) return;
  var inp = document.getElementById("cb-value-text");
  var val = inp.value.trim().toLowerCase().replace(/\s+/g,"_");
  if (!val) return;
  pushCbFilter(_cb.activeField, "=", val);
  inp.value = "";
  closeCbValueRow();
}

function pushCbFilter(field, op, value) {
  _cb.activeFilters = _cb.activeFilters.filter(function(f){ return f.field!==field; });
  _cb.activeFilters.push({field, op, value});
  renderCbActiveChips();
  syncCbToState();
  schedulePreview();
}

function renderCbActiveChips() {
  var card = document.getElementById("cb-active-card");
  var list = document.getElementById("cb-active-chips");
  if (!list) return;
  if (!_cb.activeFilters.length) { card.style.display="none"; return; }
  card.style.display = "block";
  list.innerHTML = "";
  _cb.activeFilters.forEach(function(f, i) {
    var chip = document.createElement("span");
    chip.className = "active-chip";
    var lbl = document.createElement("span");
    lbl.textContent = f.field + f.op + f.value;
    var rm = document.createElement("button");
    rm.textContent = "×";
    rm.addEventListener("click", function() {
      _cb.activeFilters.splice(i, 1);
      renderCbActiveChips(); renderCbFieldChips(); syncCbToState(); schedulePreview();
    });
    chip.appendChild(lbl); chip.appendChild(rm);
    list.appendChild(chip);
  });
}

function syncCbToState() {
  if (!_cur || _cur.section !== "queries") return;
  var parts = [];
  if (_cb.type) parts.push("type=" + _cb.type);
  _cb.activeFilters.forEach(function(f){ parts.push(f.field + f.op + f.value); });
  // merge with any manual expression
  var manualExpr = "";
  var exprInp = document.getElementById("cb-expr-inp");
  // only keep manual expr if it doesn't overlap with chip filters
  if (exprInp && exprInp.style.display !== "none") {
    manualExpr = exprInp.value.trim();
  }
  var chipExpr = parts.length ? parts.join(" AND ") : "";
  var combined = chipExpr && manualExpr
    ? "(" + chipExpr + ") AND (" + manualExpr + ")"
    : chipExpr || manualExpr;
  _st.queries[_cur.name].where = combined;
}

function syncExprToState() {
  if (!_cur || _cur.section !== "queries") return;
  var inp = document.getElementById("cb-expr-inp");
  if (!inp) return;
  var manualExpr = inp.value.trim();
  var chipParts = [];
  if (_cb.type) chipParts.push("type=" + _cb.type);
  _cb.activeFilters.forEach(function(f){ chipParts.push(f.field + f.op + f.value); });
  var chipExpr = chipParts.length ? chipParts.join(" AND ") : "";
  _st.queries[_cur.name].where = chipExpr && manualExpr
    ? "(" + chipExpr + ") AND (" + manualExpr + ")"
    : chipExpr || manualExpr;
  schedulePreview();
}

function toggleCbExpr() {
  var row = document.getElementById("cb-expr-row");
  var btn = document.getElementById("cb-expr-toggle");
  if (row.style.display === "none") {
    row.style.display = "block"; btn.textContent = "hide";
  } else {
    row.style.display = "none"; btn.textContent = "show";
    var inp = document.getElementById("cb-expr-inp");
    if (inp) { inp.value = ""; syncExprToState(); }
  }
}

// ════════════════════════════════════════════════════════════════════════════
// Live preview
// ════════════════════════════════════════════════════════════════════════════
function schedulePreview() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(runPreview, 600);
}

function runPreview() {
  if (!_cur || _cur.section !== "queries") return;
  var q   = _st.queries[_cur.name];
  var area = document.getElementById("preview-area");
  area.style.display = "block";
  area.innerHTML =
    '<div class="card" style="color:var(--sub);font-size:13px;">Loading preview…</div>';

  var where = [];
  if (_cb.type) where.push("type=" + _cb.type);
  _cb.activeFilters.forEach(function(f){ where.push(f.field + f.op + f.value); });
  var manualExpr = "";
  var exprInp = document.getElementById("cb-expr-inp");
  if (exprInp && document.getElementById("cb-expr-row").style.display !== "none") {
    manualExpr = exprInp.value.trim();
  }

  fetch("/browse/run", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      where:  where,
      expr:   manualExpr,
      time:   q.time || "tm",
      group:  q.group || "",
      search: q.search || "",
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (!d.ok) {
      area.innerHTML = '<div class="card"><div class="msg msg-error">' + escHtml(d.error) + '</div></div>';
      return;
    }
    area.innerHTML = '<div class="card-title" style="margin-bottom:8px;font-size:13px;' +
      'color:var(--sub);">Preview</div>' + renderPreviewResult(d.data);
  })
  .catch(function(e) {
    area.innerHTML = '<div class="card"><div class="msg msg-error">' + escHtml(String(e)) + '</div></div>';
  });
}

function renderPreviewResult(d) {
  if (!d) return '<div class="card" style="color:var(--sub);">No data</div>';
  if (d.kind === "group") return renderGroup(d);
  return renderRecords(d);
}

function summaryBar(d) {
  var parts = [];
  if (d.count !== undefined) parts.push('<span>'+d.count+' records</span>');
  if (d.total_fmt)  parts.push('<span>Total: <strong>'+d.total_fmt+'</strong></span>');
  if (d.avg_fmt)    parts.push('<span>Avg: <strong>'+d.avg_fmt+'</strong></span>');
  if (d.time_label) parts.push('<span style="color:var(--sub)">'+d.time_label+'</span>');
  return parts.length
    ? '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:8px;">' +
      parts.join("") + '</div>'
    : "";
}

function renderGroup(d) {
  var hasTot = d.has_amount;
  var heads = hasTot
    ? '<th>Group</th><th style="text-align:right">Count</th><th style="text-align:right">Total</th>'
    : '<th>Group</th><th style="text-align:right">Count</th>';
  var rows = (d.rows||[]).map(function(r) {
    return hasTot
      ? '<tr><td>'+r.key+'</td><td style="text-align:right">'+r.count+'</td><td style="text-align:right">'+r.total_fmt+'</td></tr>'
      : '<tr><td>'+r.key+'</td><td style="text-align:right">'+r.count+'</td></tr>';
  }).join("");
  var foot = hasTot
    ? '<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">'+d.grand_count+'</td><td style="text-align:right">'+d.grand_total_fmt+'</td></tr>'
    : '<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">'+d.grand_count+'</td></tr>';
  return '<div class="card">' + summaryBar(d) +
    '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>' + heads +
    '</tr></thead><tbody>' + rows + foot + '</tbody></table></div></div>';
}

function renderRecords(d) {
  if (!d.records || !d.records.length)
    return '<div class="card" style="color:var(--sub);text-align:center;padding:24px;">No records found.</div>';
  var cols  = (d.columns||[]).filter(function(c){ return c.indexOf("_")!==0; });
  var heads = cols.map(function(c){ return '<th>'+c+'</th>'; }).join("");
  var rows  = d.records.slice(0,50).map(function(r) {
    return '<tr>' + cols.map(function(c){ return '<td>'+(r[c]||"")+'</td>'; }).join("") + '</tr>';
  }).join("");
  var more  = d.records.length > 50
    ? '<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--sub);' +
      'font-size:12px;padding:6px;">…'+(d.records.length-50)+' more records</td></tr>' : "";
  return '<div class="card">' + summaryBar(d) +
    '<div style="overflow-x:auto;"><table class="data-table">' +
    '<thead><tr>' + heads + '</tr></thead>' +
    '<tbody>' + rows + more + '</tbody></table></div></div>';
}

// ════════════════════════════════════════════════════════════════════════════
// Metric editor
// ════════════════════════════════════════════════════════════════════════════
function makeMetricEditor(name) {
  var m   = _st.metrics[name];
  var div = document.createElement("div");
  var qNames = Object.keys(_st.queries);

  var kindOpts = ["avg","sum","max","min","ratio"].map(function(k) {
    return '<option value="'+k+'"'+(k===m.kind?' selected':'')+'>'+
      {avg:"Average (avg)",sum:"Total (sum)",max:"Maximum (max)",
       min:"Minimum (min)",ratio:"Ratio (ratio)"}[k]+'</option>';
  }).join("");

  var baseOpts = '<option value="">— pick a query —</option>' +
    qNames.map(function(n){
      return '<option value="'+n+'"'+(n===m.base?' selected':'')+'>'+n+'</option>';
    }).join("");

  var base2Opts = '<option value="">— pick a query —</option>' +
    qNames.map(function(n){
      return '<option value="'+n+'"'+(n===m.base2?' selected':'')+'>'+n+'</option>';
    }).join("");

  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<label>Metric type</label>' +
    '<select id="m-kind" onchange="onMetricKindChange(this.value)">' + kindOpts + '</select>' +
    '<div class="hint" style="margin-top:4px;">avg = mean amount · sum = total · max/min = extremes · ratio = count A ÷ count B × 100%</div>' +

    '<label style="margin-top:12px;display:block;">Base query</label>' +
    '<select id="m-base" onchange="_st.metrics[_cur.name].base=this.value">' + baseOpts + '</select>' +

    '<div id="ratio2-row" style="display:'+(m.kind==="ratio"?"block":"none")+';">' +
      '<label style="margin-top:12px;display:block;">Second query (denominator)</label>' +
      '<select id="m-base2" onchange="_st.metrics[_cur.name].base2=this.value">' + base2Opts + '</select>' +
      '<div class="hint" style="margin-top:4px;">ratio = count(base) ÷ count(second) × 100%</div>' +
    '</div>';
  div.appendChild(card);
  return div;
}

function onMetricKindChange(kind) {
  _st.metrics[_cur.name].kind = kind;
  document.getElementById("ratio2-row").style.display = kind==="ratio" ? "block" : "none";
}

// ════════════════════════════════════════════════════════════════════════════
// Dashboard editor
// ════════════════════════════════════════════════════════════════════════════
function makeDashboardEditor(name) {
  var db  = _st.dashboards[name];
  var div = document.createElement("div");
  var card = document.createElement("div");
  card.className = "card";

  var allNames = Object.keys(_st.queries).concat(Object.keys(_st.metrics));
  var avail    = allNames.filter(function(n){ return db.metrics.indexOf(n)===-1; });
  var addOpts  = avail.map(function(n){
    var tag = _st.metrics[n] ? "metric" : "query";
    return '<option value="'+n+'">'+n+' ('+tag+')</option>';
  }).join("");

  card.innerHTML =
    '<div class="card-title">Items on Home dashboard</div>' +
    '<div class="hint" style="margin-bottom:10px;">' +
      'Choose queries and metrics to show as stat cards on the Home screen. Order matters.' +
    '</div>' +
    '<div id="db-chips" class="chip-group" style="margin-bottom:10px;"></div>' +
    '<div style="display:flex;gap:8px;">' +
      '<select id="db-add-sel" style="flex:1;">' +
        '<option value="">— add item —</option>' + addOpts +
      '</select>' +
      '<button onclick="addDashItem()" class="btn btn-ghost btn-sm">Add</button>' +
    '</div>';
  div.appendChild(card);
  renderDashChips(db, card.querySelector("#db-chips"));
  return div;
}

function renderDashChips(db, container) {
  container.innerHTML = "";
  (db.metrics||[]).forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "dash-chip";
    var tag = _st.metrics[item] ? "metric" : "query";
    chip.innerHTML =
      '<span style="font-size:11px;color:var(--sub);margin-right:3px;">('+tag+')</span>' +
      item + ' <button onclick="removeDashItem('+i+')">×</button>';
    container.appendChild(chip);
  });
}

function addDashItem() {
  var sel  = document.getElementById("db-add-sel");
  var item = sel.value; if (!item) return;
  var db = _st.dashboards[_cur.name];
  if (db.metrics.indexOf(item)===-1) db.metrics.push(item);
  var opt = sel.querySelector('option[value="'+item+'"]');
  if (opt) opt.remove();
  sel.value = "";
  renderDashChips(db, document.getElementById("db-chips"));
}

function removeDashItem(idx) {
  var db      = _st.dashboards[_cur.name];
  var removed = db.metrics.splice(idx, 1)[0];
  renderDashChips(db, document.getElementById("db-chips"));
  var sel = document.getElementById("db-add-sel");
  var opt = document.createElement("option");
  opt.value = removed; opt.textContent = removed;
  sel.appendChild(opt);
}

// ════════════════════════════════════════════════════════════════════════════
// Delete
// ════════════════════════════════════════════════════════════════════════════
function askDelete() {
  if (!_cur) return;
  _delPending = {section:_cur.section, name:_cur.name};
  document.getElementById("del-msg-text").textContent =
    "Delete '" + _cur.name + "' from " + _cur.section + "? This cannot be undone.";
  document.getElementById("del-modal").style.display = "flex";
}

function closeDeleteModal() {
  _delPending = null;
  document.getElementById("del-modal").style.display = "none";
}

function confirmDelete() {
  if (!_delPending) return;
  var s = _delPending.section, n = _delPending.name;
  closeDeleteModal();
  var kindMap = {queries:"query", metrics:"metric", dashboards:"dashboard"};
  fetch("/query-builder/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name:n, kind:kindMap[s]})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.ok) {
      delete _st[s][n];
      _cur = null;
      renderTabs();
      document.getElementById("entry-editor").style.display = "none";
      document.getElementById("preview-area").style.display = "none";
      document.getElementById("entry-empty").style.display  = "block";
      showMsg("✔ Deleted", true);
    } else {
      showMsg("✖ " + d.error, false);
    }
  })
  .catch(function(e){ showMsg("✖ " + e, false); });
}

// ════════════════════════════════════════════════════════════════════════════
// Save all
// ════════════════════════════════════════════════════════════════════════════
function saveAll() {
  var btn = document.getElementById("save-btn");
  btn.disabled = true; btn.textContent = "Saving…";
  fetch("/query-builder/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(_st)
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    btn.disabled = false; btn.textContent = "💾 Save All";
    showMsg(d.ok ? "✔ Saved to queries.toml" : "✖ " + d.error, d.ok);
  })
  .catch(function(e){
    btn.disabled = false; btn.textContent = "💾 Save All";
    showMsg("✖ " + e, false);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// Utils
// ════════════════════════════════════════════════════════════════════════════
function showMsg(text, ok) {
  var el = document.getElementById("save-msg");
  el.textContent = text;
  el.style.color = ok ? "var(--success)" : "var(--error)";
  el.style.display = "inline";
  if (ok) setTimeout(function(){ el.style.display="none"; }, 3000);
}

function escAttr(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                      .replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById("del-modal").addEventListener("click", function(e) {
  if (e.target === this) closeDeleteModal();
});
</script>

{% endblock %}
