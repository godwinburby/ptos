{% extends "base.html" %}
{% block content %}

<div class="page-title">Query Builder</div>

<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;">
  <button onclick="addEntry()" class="btn btn-primary btn-sm">+ New</button>
  <button onclick="saveAll()"  class="btn btn-success btn-sm" id="save-btn">💾 Save All</button>
  <div id="save-msg" style="font-size:13px;display:none;"></div>
</div>

<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">

  <!-- ── Left panel ── -->
  <div id="entry-list"
       style="width:170px;flex-shrink:0;background:var(--card);
              border:1px solid var(--border);border-radius:12px;padding:10px;">
    <div style="font-size:11px;font-weight:700;color:var(--sub);
                letter-spacing:.5px;margin-bottom:6px;">QUERIES</div>
    <div id="tabs-queries"></div>
    <div style="font-size:11px;font-weight:700;color:var(--sub);
                letter-spacing:.5px;margin-top:12px;margin-bottom:6px;">METRICS</div>
    <div id="tabs-metrics"></div>
    <div style="font-size:11px;font-weight:700;color:var(--sub);
                letter-spacing:.5px;margin-top:12px;margin-bottom:6px;">DASHBOARDS</div>
    <div id="tabs-dashboards"></div>
  </div>

  <!-- ── Right panel ── -->
  <div id="entry-editor" style="flex:1;min-width:280px;display:none;"></div>
  <div id="entry-empty"
       style="flex:1;padding:40px;text-align:center;color:var(--sub);font-size:14px;">
    Select an entry on the left, or click <strong>+ New</strong>.
  </div>

</div>

<!-- delete modal -->
<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:300px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;color:var(--error);margin-bottom:10px;">Delete?</div>
    <div id="del-msg-text" style="font-size:14px;color:var(--sub);margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="confirmDelete()" class="btn btn-sm"
              style="flex:1;background:var(--error);color:#fff;border:none;">Delete</button>
      <button onclick="closeDeleteModal()" class="btn btn-ghost btn-sm" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<style>
  .q-tab {
    display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;
    border:none;background:none;font-size:13px;font-weight:600;color:var(--sub);
    cursor:pointer;margin-bottom:2px;transition:all .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .q-tab:hover  { background:var(--bg);color:var(--text); }
  .q-tab.active { background:var(--accent-lt);color:var(--accent); }
  .dash-chip {
    display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
    border-radius:16px;font-size:13px;font-weight:600;
    background:var(--card);border:1.5px solid var(--border);color:var(--text);margin:3px;
  }
  .dash-chip button { background:none;border:none;color:var(--sub);
    cursor:pointer;font-size:13px;padding:0;line-height:1;font-weight:700; }
  .qb-chip {
    display:inline-flex;align-items:center;gap:4px;padding:6px 12px;
    border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    transition:all .15s;margin:3px;
  }
  .qb-chip:hover    { border-color:var(--accent);color:var(--accent); }
  .qb-chip.active   { background:var(--accent);border-color:var(--accent);color:#fff; }
  .qb-chip.selected { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .qb-active-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
    border-radius:20px;font-size:13px;font-weight:600;margin:3px;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);
  }
  .qb-active-chip button {
    background:none;border:none;color:var(--accent);
    cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700;
  }
  .qb-preview {
    font-family:'Consolas','Courier New',monospace;font-size:13px;
    background:#1E2130;color:#D4D8E8;padding:12px 14px;border-radius:8px;
    line-height:1.8;word-break:break-all;min-height:56px;
    border:1px solid var(--border);
  }
  .p-name  { color:#82AAFF;font-weight:700; }
  .p-where { color:#C3E88D; }
  .p-time  { color:#7EC8E3; }
  .p-opt   { color:#FFCB6B; }
  .p-dim   { color:#697098; }
</style>

<script>
var _st = { queries:{}, metrics:{}, dashboards:{} };
var _cur = null;
var _delPending = null;
var _types    = {{ types | tojson }};
var _timeOpts = {{ time_options | tojson }};
var _fieldCache = {};   // {type: [{name, options, is_int}]}

// ── Boot ──────────────────────────────────────────────────────────────────────
(function() {
  var q = {{ queries | tojson }};
  var reserved = ["metrics","dashboards","due"];
  Object.entries(q).forEach(function(e) {
    var k = e[0], v = e[1];
    if (reserved.indexOf(k)!==-1 || typeof v!=="object") return;
    var parsed = _parseWhere(v.where||"");
    _st.queries[k] = {
      where:        v.where||"",
      time:         v.time||"tm",
      sum:          !!v.sum,
      group:        Array.isArray(v.group)?v.group[0]:(v.group||""),
      search:       v.search||"",
      _chips:       parsed.chips,
      _exprManual:  parsed.manual,
      _activeField: null,
    };
  });
  // metrics — skip derived
  Object.entries(q.metrics||{}).forEach(function(e) {
    var k = e[0], m = e[1];
    if ("derived" in m) return;
    var kind="avg",base="",base2="";
    if ("ratio" in m && Array.isArray(m.ratio))
      { kind="ratio"; base=m.ratio[0]||""; base2=m.ratio[1]||""; }
    else if ("avg" in m) { kind="avg"; base=m.avg; }
    else if ("sum" in m) { kind="sum"; base=m.sum; }
    else if ("max" in m) { kind="max"; base=m.max; }
    else if ("min" in m) { kind="min"; base=m.min; }
    _st.metrics[k] = { kind, base, base2 };
  });
  Object.entries(q.dashboards||{}).forEach(function(e) {
    _st.dashboards[e[0]] = { metrics: e[1].metrics||[] };
  });
  renderTabs();
  var first = Object.keys(_st.queries)[0];
  if (first) select("queries", first);
})();

// ── Parse simple where expression into chips + manual remainder ───────────────
// Handles field=value AND field=value — anything else stays in manual expr box
function _parseWhere(expr) {
  var chips = [], manual = [];
  if (!expr) return {chips, manual:""};
  expr.trim().split(/\s+AND\s+/i).forEach(function(p) {
    p = p.trim();
    var m = p.match(/^([a-z_][a-z0-9_]*)=([^\s()|&]+)$/i);
    if (m) chips.push({ field:m[1].toLowerCase(), op:"=", value:m[2] });
    else if (p) manual.push(p);
  });
  return { chips, manual: manual.join(" AND ") };
}

// ── Tab rendering ─────────────────────────────────────────────────────────────
function renderTabs() {
  _renderSection("tabs-queries",    _st.queries,    "queries");
  _renderSection("tabs-metrics",    _st.metrics,    "metrics");
  _renderSection("tabs-dashboards", _st.dashboards, "dashboards");
}
function _renderSection(elId, data, section) {
  var el = document.getElementById(elId);
  el.innerHTML = "";
  var keys = Object.keys(data);
  if (!keys.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--border);padding:4px 8px;">none</div>';
    return;
  }
  keys.forEach(function(name) {
    var btn = document.createElement("button");
    btn.className = "q-tab" +
      (_cur&&_cur.section===section&&_cur.name===name?" active":"");
    btn.textContent = name; btn.title = name;
    btn.addEventListener("click", function(){ select(section, name); });
    el.appendChild(btn);
  });
}

function select(section, name) {
  _cur = {section, name};
  renderTabs();
  document.getElementById("entry-editor").style.display = "block";
  document.getElementById("entry-empty").style.display  = "none";
  renderEditor();
}

// ── Add new ───────────────────────────────────────────────────────────────────
function addEntry() {
  var kind = prompt("What kind?\n  q = query\n  m = metric\n  d = dashboard","q");
  if (!kind) return;
  kind = kind.trim().toLowerCase();
  var section = kind==="m"?"metrics":kind==="d"?"dashboards":"queries";
  var name = prompt("Name (lowercase, underscores):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
  if (!name) return;
  if (_st[section][name]) { alert("'"+name+"' already exists."); return; }
  if (section==="queries")
    _st.queries[name]    = {where:"",time:"tm",sum:false,group:"",search:"",_chips:[],_exprManual:"",_activeField:null};
  else if (section==="metrics")
    _st.metrics[name]    = {kind:"avg",base:"",base2:""};
  else
    _st.dashboards[name] = {metrics:[]};
  renderTabs();
  select(section, name);
}

// ── Editor router ─────────────────────────────────────────────────────────────
function renderEditor() {
  var ed = document.getElementById("entry-editor");
  ed.innerHTML = "";
  if (!_cur) return;
  var s=_cur.section, n=_cur.name;
  // header
  var hdr = document.createElement("div");
  hdr.className = "card"; hdr.style.marginBottom = "12px";
  hdr.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<div style="flex:1;"><label>Name</label>' +
        '<input type="text" id="ed-name" value="'+n+'" oninput="onNameChange()"' +
        ' style="font-size:16px;font-weight:700;"></div>' +
      '<div style="margin-top:18px;">' +
        '<button onclick="askDelete()" class="btn btn-ghost btn-sm"' +
        ' style="color:var(--error);border-color:var(--error);">Delete</button>' +
      '</div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--sub);margin-top:6px;">' +
    (s==="queries"?"Base query — filter records by type, fields, and time":
     s==="metrics"?"Metric — computed value over a base query":
     "Dashboard — group of queries and metrics shown on Home")+'</div>';
  ed.appendChild(hdr);
  if (s==="queries")     _buildQueryEditor(ed, n);
  else if (s==="metrics") ed.appendChild(_buildMetricEditor(n));
  else                    ed.appendChild(_buildDashEditor(n));
}

function onNameChange() {
  var newName = document.getElementById("ed-name").value.trim()
                       .toLowerCase().replace(/[^a-z0-9_]/g,"_");
  var s=_cur.section, old=_cur.name;
  if (!newName||newName===old||_st[s][newName]) return;
  _st[s][newName]=_st[s][old]; delete _st[s][old];
  _cur.name=newName; renderTabs();
}

// ══════════════════════════════════════════════════════════════════════════════
// QUERY EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildQueryEditor(container, name) {
  var q = _st.queries[name];

  // 1. Type chips
  var c1 = _mkCard("Record type",
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px;">'+
    'Pick a type to load field chips. Leave as "all types" to query everything.</div>'+
    '<div id="qb-type-chips" class="chip-group"></div>');
  container.appendChild(c1);

  // 2. Field/value chip area
  var c2 = document.createElement("div");
  c2.className = "card"; c2.style.marginBottom = "10px";
  c2.id = "qb-field-card";
  c2.style.display = _typeFromChips(q) ? "block" : "none";
  c2.innerHTML =
    '<label>Filter by field</label>'+
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px;">'+
    'Tap a field → tap a value to add it as a filter.</div>'+
    '<div id="qb-active-chips" class="chip-group" style="min-height:10px;margin-bottom:10px;"></div>'+
    '<div style="font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px;">FIELDS</div>'+
    '<div id="qb-field-chips" class="chip-group" style="margin-bottom:8px;"></div>'+
    '<div id="qb-value-area" style="display:none;padding:10px;background:var(--bg);'+
    'border-radius:8px;border:1px solid var(--border);">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'+
        '<span style="font-size:11px;color:var(--sub);font-weight:700;">VALUES FOR '+
        '<span id="qb-val-label" style="color:var(--accent);"></span></span>'+
        '<button onclick="closeValueArea()" style="background:none;border:none;color:var(--sub);'+
        'cursor:pointer;font-size:16px;line-height:1;">✕</button>'+
      '</div>'+
      '<div id="qb-value-chips" class="chip-group" style="margin-bottom:6px;"></div>'+
      '<div id="qb-val-text" style="display:none;gap:8px;margin-top:6px;">'+
        '<input type="text" id="qb-val-input" placeholder="type a value…" style="flex:1;font-size:14px;"'+
        ' onkeydown="if(event.key===\'Enter\') addTextChip()">'+
        '<button onclick="addTextChip()" class="btn btn-ghost btn-sm" style="margin-top:6px;">Add</button>'+
      '</div>'+
    '</div>';
  container.appendChild(c2);

  // 3. Time window
  container.appendChild(_mkCard("Time window",
    '<select id="qb-time" onchange="_updateQ(\'time\',this.value)">'+
    _timeOpts.map(function(o){
      return '<option value="'+o[1]+'"'+(o[1]===q.time?" selected":"")+'>'+o[0]+'</option>';
    }).join("")+'</select>'));

  // 4. Expression filter (collapsed)
  var c4 = document.createElement("div");
  c4.className = "card"; c4.style.marginBottom = "10px";
  c4.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;">'+
      '<label style="margin:0;">Expression filter '+
        '<span style="font-size:11px;color:var(--sub);font-weight:400;">(optional, advanced)</span></label>'+
      '<button id="expr-toggle" onclick="toggleExpr(this)"'+
      ' style="background:none;border:none;font-size:11px;color:var(--accent);cursor:pointer;font-weight:700;">'+
      (q._exprManual?'hide':'show')+'</button>'+
    '</div>'+
    '<div id="qb-expr-area" style="display:'+(q._exprManual?'block':'none')+';margin-top:8px;">'+
      '<input type="text" id="qb-expr" value="'+_esc(q._exprManual||'')+'"'+
      ' placeholder="type=expense AND (domain=self OR domain=home)"'+
      ' style="font-family:monospace;font-size:13px;"'+
      ' oninput="_onExprInput(this.value)">'+
      '<div class="hint" style="margin-top:4px;">= != &gt; &lt; ~ !~ AND OR NOT ( ) — ANDed with chip filters</div>'+
    '</div>';
  container.appendChild(c4);

  // 5. Search
  container.appendChild(_mkCard("Full-text search",
    '<input type="text" id="qb-search" value="'+_esc(q.search)+'"'+
    ' placeholder="keyword…" oninput="_updateQ(\'search\',this.value)">'));

  // 6. Options
  var c6 = document.createElement("div");
  c6.className = "card"; c6.style.marginBottom = "10px";
  c6.innerHTML =
    '<label>Options</label>'+
    '<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;">'+
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;">'+
        '<input type="checkbox" id="qb-sum"'+(q.sum?" checked":"")+
        ' onchange="_updateQ(\'sum\',this.checked)"'+
        ' style="width:16px;height:16px;accent-color:var(--accent);">'+
        '<span>Sum amount</span></label>'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<label style="font-weight:600;white-space:nowrap;">Group by</label>'+
        '<input type="text" id="qb-group" value="'+_esc(q.group)+'"'+
        ' placeholder="field…" style="width:120px;"'+
        ' oninput="_updateQ(\'group\',this.value)">'+
      '</div>'+
    '</div>';
  container.appendChild(c6);

  // 7. Preview
  var c7 = document.createElement("div");
  c7.className = "card"; c7.style.marginBottom = "10px";
  c7.innerHTML =
    '<label style="display:flex;align-items:center;justify-content:space-between;">'+
      '<span>Query preview</span>'+
      '<a id="qb-run-link" href="/queries" target="_blank"'+
      ' class="btn btn-ghost btn-sm" style="font-size:12px;">▶ Run in Queries</a>'+
    '</label>'+
    '<div class="hint" style="margin-bottom:8px;">Live view of what will be saved. Read-only.</div>'+
    '<div id="qb-preview" class="qb-preview"></div>';
  container.appendChild(c7);

  // ── now render chips ──────────────────────────────────────────────────────
  _renderTypeChips(q);
  var sel = _typeFromChips(q);
  if (sel) {
    _fetchFields(sel, function() {
      _renderFieldChips(q);
      _renderActiveChips(q);
      _updatePreview(q);
    });
  } else {
    _updatePreview(q);
  }
}

// ── helpers scoped to query editor ───────────────────────────────────────────
function _typeFromChips(q) {
  var c = (q._chips||[]).find(function(c){ return c.field==="type"; });
  return c ? c.value : null;
}

function _buildWhereExpr(q) {
  var parts = (q._chips||[]).map(function(c){ return c.field+c.op+c.value; });
  var manual = (q._exprManual||"").trim();
  if (manual) parts.push(manual);
  return parts.join(" AND ");
}

function _updateQ(field, val) {
  if (!_cur||_cur.section!=="queries") return;
  _st.queries[_cur.name][field] = val;
  _updatePreview(_st.queries[_cur.name]);
}

function _onExprInput(val) {
  if (!_cur) return;
  _st.queries[_cur.name]._exprManual = val;
  _updatePreview(_st.queries[_cur.name]);
}

function toggleExpr(btn) {
  var area = document.getElementById("qb-expr-area");
  var open = area.style.display==="none";
  area.style.display = open ? "block" : "none";
  btn.textContent = open ? "hide" : "show";
  if (!open && _cur) {
    _st.queries[_cur.name]._exprManual = "";
    _updatePreview(_st.queries[_cur.name]);
  }
}

function _renderTypeChips(q) {
  var el = document.getElementById("qb-type-chips");
  if (!el) return;
  el.innerHTML = "";
  var sel = _typeFromChips(q);
  // all types chip
  var all = document.createElement("button");
  all.className = "qb-chip" + (!sel?" active":"");
  all.textContent = "all types";
  all.addEventListener("click", function(){ _onTypeClick(null, q); });
  el.appendChild(all);
  _types.forEach(function(t) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (t===sel?" active":"");
    chip.textContent = t;
    chip.addEventListener("click", function(){ _onTypeClick(t, q); });
    el.appendChild(chip);
  });
}

function _onTypeClick(type, q) {
  q._chips = (q._chips||[]).filter(function(c){ return c.field!=="type"; });
  if (type) q._chips.unshift({field:"type",op:"=",value:type});
  q._activeField = null;
  _renderTypeChips(q);
  var fc = document.getElementById("qb-field-card");
  if (type) {
    fc.style.display = "block";
    _fetchFields(type, function() {
      _renderFieldChips(q);
      _renderActiveChips(q);
      _updatePreview(q);
    });
  } else {
    fc.style.display = "none";
    // remove all non-type chips when clearing type
    q._chips = [];
    _renderActiveChips(q);
    _updatePreview(q);
  }
}

function _fetchFields(type, cb) {
  if (_fieldCache[type]) { cb(); return; }
  fetch("/api/type_fields/"+encodeURIComponent(type))
  .then(function(r){ return r.json(); })
  .then(function(data) {
    _fieldCache[type] = (data.fields||[]).filter(function(f){
      return !f.is_int && f.name!=="type";
    });
    cb();
  })
  .catch(function(){ _fieldCache[type]=[]; cb(); });
}

function _renderFieldChips(q) {
  var el = document.getElementById("qb-field-chips");
  if (!el) return;
  el.innerHTML = "";
  var type = _typeFromChips(q);
  (_fieldCache[type]||[]).forEach(function(f) {
    var active  = q._activeField===f.name;
    var hasChip = (q._chips||[]).some(function(c){ return c.field===f.name; });
    var chip = document.createElement("button");
    chip.className = "qb-chip"+(active?" active":hasChip?" selected":"");
    chip.textContent = f.name;
    chip.addEventListener("click", function(){ _onFieldClick(f, q); });
    el.appendChild(chip);
  });
}

function _onFieldClick(fdef, q) {
  if (q._activeField===fdef.name) { closeValueArea(); return; }
  q._activeField = fdef.name;
  _renderFieldChips(q);
  var va = document.getElementById("qb-value-area");
  var vl = document.getElementById("qb-val-label");
  var vc = document.getElementById("qb-value-chips");
  var vt = document.getElementById("qb-val-text");
  va.style.display = "block";
  vl.textContent = fdef.name;
  vc.innerHTML = "";
  if (fdef.options && fdef.options.length) {
    vt.style.display = "none";
    fdef.options.forEach(function(opt) {
      var already = (q._chips||[]).some(function(c){
        return c.field===fdef.name && c.value===opt;
      });
      var chip = document.createElement("button");
      chip.className = "qb-chip"+(already?" active":"");
      chip.textContent = opt;
      chip.addEventListener("click", function() {
        _toggleValueChip(fdef.name, opt, q);
        chip.className = "qb-chip"+((q._chips||[]).some(function(c){
          return c.field===fdef.name&&c.value===opt;
        })?" active":"");
      });
      vc.appendChild(chip);
    });
  } else {
    vt.style.display = "flex";
    setTimeout(function(){
      var inp = document.getElementById("qb-val-input");
      if (inp) inp.focus();
    },50);
  }
}

function _toggleValueChip(field, value, q) {
  var idx = (q._chips||[]).findIndex(function(c){
    return c.field===field&&c.value===value;
  });
  if (idx!==-1) q._chips.splice(idx,1);
  else q._chips.push({field,op:"=",value});
  _renderActiveChips(q);
  _updatePreview(q);
}

function addTextChip() {
  if (!_cur) return;
  var q = _st.queries[_cur.name];
  var inp = document.getElementById("qb-val-input");
  var val = inp ? inp.value.trim() : "";
  if (!val||!q._activeField) return;
  q._chips = (q._chips||[]).filter(function(c){ return c.field!==q._activeField; });
  q._chips.push({field:q._activeField,op:"=",value:val});
  inp.value = "";
  closeValueArea();
  _renderFieldChips(q);
  _renderActiveChips(q);
  _updatePreview(q);
}

function closeValueArea() {
  var va = document.getElementById("qb-value-area");
  if (va) va.style.display = "none";
  if (_cur&&_st.queries[_cur.name]) {
    _st.queries[_cur.name]._activeField = null;
    _renderFieldChips(_st.queries[_cur.name]);
  }
}

function _renderActiveChips(q) {
  var el = document.getElementById("qb-active-chips");
  if (!el) return;
  el.innerHTML = "";
  (q._chips||[]).filter(function(c){ return c.field!=="type"; })
  .forEach(function(c, i) {
    var chip = document.createElement("span");
    chip.className = "qb-active-chip";
    chip.innerHTML = _esc(c.field+c.op+c.value) +
      ' <button onclick="_removeActiveChip('+i+')">×</button>';
    el.appendChild(chip);
  });
}

window._removeActiveChip = function(visualIdx) {
  if (!_cur) return;
  var q = _st.queries[_cur.name];
  var nonType = (q._chips||[]).filter(function(c){ return c.field!=="type"; });
  var chipToRemove = nonType[visualIdx];
  if (!chipToRemove) return;
  var realIdx = (q._chips||[]).indexOf(chipToRemove);
  if (realIdx!==-1) q._chips.splice(realIdx,1);
  _renderFieldChips(q);
  _renderActiveChips(q);
  _updatePreview(q);
};

function _updatePreview(q) {
  q.where = _buildWhereExpr(q);
  var el = document.getElementById("qb-preview");
  if (!el) return;
  var name = _cur?_cur.name:"query";
  var timeLabel = (function(){
    for (var i=0;i<_timeOpts.length;i++) if (_timeOpts[i][1]===q.time) return _timeOpts[i][0];
    return q.time;
  })();
  var lines = [];
  lines.push('<span class="p-dim">[</span><span class="p-name">'+_esc(name)+
             '</span><span class="p-dim">]</span>');
  if (q.where)
    lines.push('where = <span class="p-where">"'+_esc(q.where)+'"</span>');
  lines.push('time  = <span class="p-time">"'+_esc(q.time)+'"</span>'+
             '<span class="p-dim">  ← '+_esc(timeLabel)+'</span>');
  if (q.group)
    lines.push('group = <span class="p-opt">["'+_esc(q.group)+'"]</span>');
  if (q.search)
    lines.push('search = <span class="p-opt">"'+_esc(q.search)+'"</span>');
  if (q.sum)
    lines.push('sum   = <span class="p-opt">true</span>');
  el.innerHTML = lines.join("<br>");
  var link = document.getElementById("qb-run-link");
  if (link) link.href = "/queries?run=q:"+encodeURIComponent(name)+"&time="+encodeURIComponent(q.time);
}

// ══════════════════════════════════════════════════════════════════════════════
// METRIC EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildMetricEditor(name) {
  var m = _st.metrics[name];
  var div = document.createElement("div");
  var qNames = Object.keys(_st.queries);
  var kindMap = {
    avg:"Average — mean amount across records",
    sum:"Total — sum of amount field",
    max:"Maximum — highest amount",
    min:"Minimum — lowest amount",
    ratio:"Ratio — count(A) ÷ count(B) × 100%"
  };
  var kindOpts = Object.keys(kindMap).map(function(k){
    return '<option value="'+k+'"'+(k===m.kind?" selected":"")+'>'+kindMap[k]+'</option>';
  }).join("");
  div.appendChild(_mkCard("Metric type",
    '<select id="m-kind" onchange="onMetricKindChange(this.value)">'+kindOpts+'</select>'));
  var baseOpts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base?" selected":"")+'>'+n+'</option>';
  }).join("");
  div.appendChild(_mkCard("Base query",
    '<select id="m-base" onchange="_st.metrics[_cur.name].base=this.value">'+
    '<option value="">— pick a query —</option>'+baseOpts+'</select>',
    "Which base query to compute this metric on."));
  var base2Opts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base2?" selected":"")+'>'+n+'</option>';
  }).join("");
  var r2 = _mkCard("Second query (ratio denominator)",
    '<select id="m-base2" onchange="_st.metrics[_cur.name].base2=this.value">'+
    '<option value="">— pick a query —</option>'+base2Opts+'</select>',
    "ratio = count(base query) ÷ count(second query) × 100%");
  r2.id = "ratio2-row";
  r2.style.display = m.kind==="ratio"?"block":"none";
  div.appendChild(r2);
  return div;
}
function onMetricKindChange(kind) {
  _st.metrics[_cur.name].kind = kind;
  var r = document.getElementById("ratio2-row");
  if (r) r.style.display = kind==="ratio"?"block":"none";
}

// ══════════════════════════════════════════════════════════════════════════════
// DASHBOARD EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildDashEditor(name) {
  var db = _st.dashboards[name];
  var div = document.createElement("div");
  var card = document.createElement("div");
  card.className = "card"; card.style.marginBottom = "10px";
  var allNames = Object.keys(_st.queries).concat(Object.keys(_st.metrics));
  var opts = allNames.filter(function(n){ return db.metrics.indexOf(n)===-1; })
    .map(function(n){
      return '<option value="'+n+'">'+n+' ('+(_st.metrics[n]?"metric":"query")+')</option>';
    }).join("");
  card.innerHTML =
    '<label>Items</label>'+
    '<div class="hint" style="margin-bottom:10px;">Choose queries and metrics to show on Home. Order matters.</div>'+
    '<div id="db-chips" class="chip-group" style="margin-bottom:10px;"></div>'+
    '<div style="display:flex;gap:8px;">'+
      '<select id="db-add-sel" style="flex:1;"><option value="">— add item —</option>'+opts+'</select>'+
      '<button onclick="addDashItem()" class="btn btn-ghost btn-sm">Add</button>'+
    '</div>';
  div.appendChild(card);
  _renderDashChips(db);
  return div;
}
function _renderDashChips(db) {
  var el = document.getElementById("db-chips");
  if (!el) return;
  el.innerHTML = "";
  (db.metrics||[]).forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "dash-chip";
    chip.innerHTML =
      '<span style="color:var(--sub);font-size:11px;margin-right:3px;">'+
      (_st.metrics[item]?"metric":"query")+'</span>'+
      item+' <button onclick="removeDashItem('+i+')">×</button>';
    el.appendChild(chip);
  });
}
function addDashItem() {
  var sel = document.getElementById("db-add-sel");
  var item = sel.value; if (!item||!_cur) return;
  var db = _st.dashboards[_cur.name];
  if (db.metrics.indexOf(item)===-1) db.metrics.push(item);
  _renderDashChips(db);
  var opt = sel.querySelector('option[value="'+item+'"]');
  if (opt) opt.remove(); sel.value="";
}
function removeDashItem(idx) {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var removed = db.metrics.splice(idx,1)[0];
  _renderDashChips(db);
  var sel = document.getElementById("db-add-sel");
  if (sel && removed) {
    var opt = document.createElement("option");
    opt.value = removed; opt.textContent = removed; sel.appendChild(opt);
  }
}

// ── Shared helpers ────────────────────────────────────────────────────────────
function _mkCard(label, inputHTML, hint) {
  var w = document.createElement("div");
  w.className = "card"; w.style.marginBottom = "10px";
  w.innerHTML = '<label>'+label+'</label>'+inputHTML+
    (hint?'<div class="hint" style="margin-top:4px;">'+hint+'</div>':"");
  return w;
}
function _esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Delete ────────────────────────────────────────────────────────────────────
function askDelete() {
  if (!_cur) return;
  _delPending = {section:_cur.section, name:_cur.name};
  document.getElementById("del-msg-text").textContent =
    "Delete "+_cur.section.slice(0,-1)+" '"+_cur.name+"'?";
  document.getElementById("del-modal").style.display = "flex";
}
function closeDeleteModal() {
  _delPending = null;
  document.getElementById("del-modal").style.display = "none";
}
function confirmDelete() {
  if (!_delPending) return;
  var s=_delPending.section, n=_delPending.name;
  closeDeleteModal();
  fetch("/query-builder/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:n, kind:s==="queries"?"query":s==="metrics"?"metric":"dashboard"})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.ok) {
      delete _st[s][n]; _cur=null; renderTabs();
      document.getElementById("entry-editor").style.display = "none";
      document.getElementById("entry-empty").style.display  = "block";
      showMsg("✔ Deleted",true);
    } else showMsg("✖ "+d.error,false);
  })
  .catch(function(e){ showMsg("✖ "+e,false); });
}

// ── Save all ──────────────────────────────────────────────────────────────────
function saveAll() {
  // sync all where expressions from chips before saving
  Object.keys(_st.queries).forEach(function(n) {
    _st.queries[n].where = _buildWhereExpr(_st.queries[n]);
  });
  var payload = { metrics:_st.metrics, dashboards:_st.dashboards, queries:{} };
  Object.entries(_st.queries).forEach(function(e) {
    var k=e[0],v=e[1];
    payload.queries[k] = {where:v.where,time:v.time,sum:v.sum,group:v.group,search:v.search};
  });
  var btn = document.getElementById("save-btn");
  btn.disabled=true; btn.textContent="Saving…";
  fetch("/query-builder/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    btn.disabled=false; btn.textContent="💾 Save All";
    if (d.ok) showMsg("✔ Saved to queries.toml",true);
    else      showMsg("✖ "+d.error,false);
  })
  .catch(function(e){
    btn.disabled=false; btn.textContent="💾 Save All";
    showMsg("✖ "+e,false);
  });
}

function showMsg(text, ok) {
  var el = document.getElementById("save-msg");
  el.textContent=text; el.style.color=ok?"var(--success)":"var(--error)";
  el.style.display="inline";
  if (ok) setTimeout(function(){ el.style.display="none"; },3000);
}

document.getElementById("del-modal").addEventListener("click", function(e) {
  if (e.target===this) closeDeleteModal();
});
</script>

{% endblock %}
