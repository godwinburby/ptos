{% extends "base.html" %}

{% set qb_tp_html %}
{% with prefix = "qb-" %}
{% include "_time_picker.html" %}
{% endwith %}
{% endset %}

{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
  <div class="page-title" style="margin:0;">Query Builder</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button onclick="addEntry()" class="btn btn-primary btn-sm">+ New</button>
    <button onclick="saveAll()"  class="btn btn-success btn-sm" id="save-btn">💾 Save All</button>
    <button onclick="resetQuery()" class="btn btn-ghost btn-sm" id="reset-btn">Clear</button>
    <div id="save-msg" style="font-size:13px;display:none;"></div>
  </div>
</div>

<!-- ── Section tabs row ── -->
<div class="qb-sec-groups">
  <div class="qb-sec-group">
    <span class="qb-sec-group-label">Data</span>
    <div class="qb-section-bar">
      <button class="qb-sec-tab active" data-sec="queries"    onclick="switchSection('queries')">Queries</button>
      <button class="qb-sec-tab"        data-sec="metrics"    onclick="switchSection('metrics')">Metrics</button>
      <button class="qb-sec-tab"        data-sec="dashboards" onclick="switchSection('dashboards')">Dashboards</button>
      <button class="qb-sec-tab"        data-sec="aliases"    onclick="switchSection('aliases')">Aliases</button>
    </div>
  </div>
  <div class="qb-sec-group">
    <span class="qb-sec-group-label">Views</span>
    <div class="qb-section-bar">
      <button class="qb-sec-tab"        data-sec="due"        onclick="switchSection('due')">Due</button>
      <button class="qb-sec-tab"        data-sec="boards"     onclick="switchSection('boards')">Boards</button>
      <button class="qb-sec-tab"        data-sec="habits"     onclick="switchSection('habits')">Habits</button>
      <button class="qb-sec-tab"        data-sec="calendars"  onclick="switchSection('calendars')">Calendars</button>
      <button class="qb-sec-tab"        data-sec="thresholds" onclick="switchSection('thresholds')">Thresholds</button>
    </div>
  </div>
</div>

<!-- ── Item chips row ── -->
<div class="qb-item-bar">
  <div id="tabs-queries"    class="qb-item-strip"></div>
  <div id="tabs-metrics"    class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-dashboards" class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-aliases"    class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-due"        class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-boards"     class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-habits"     class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-calendars"  class="qb-item-strip" style="display:none;"></div>
  <div id="tabs-thresholds" class="qb-item-strip" style="display:none;"></div>
</div>

<!-- ── Editor ── -->
<div id="entry-editor" style="margin-top:14px;display:none;"></div>
<div id="entry-empty"
     style="margin-top:40px;text-align:center;color:var(--sub);font-size:14px;">
  Select an entry above, or click <strong>+ New</strong>.
</div>

<!-- delete modal -->
<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:300px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;color:var(--error);margin-bottom:10px;">Delete?</div>
    <div id="del-msg-text" style="font-size:14px;color:var(--sub);margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="confirmDelete()" class="btn btn-sm"
              style="flex:1;background:var(--error);color:#fff;border:none;">Delete</button>
      <button onclick="closeDeleteModal()" class="btn btn-ghost btn-sm" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<!-- Record delete modal injected by RecordTable -->

<style>

    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .qb-sec-group {
    display:flex;align-items:center;gap:8px;min-width:0;
  }
  .qb-sec-group-label {
    font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--sub);white-space:nowrap;
  }

  /* ── Section tab bar ─────────────────────────────────────────────────────── */
  .qb-section-bar {
    display:flex;gap:4px;padding:4px;
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;margin-bottom:0;

    scrollbar-width:none;
  }

  }

    display:inline-block;font-size:10px;font-weight:700;
    background:rgba(255,255,255,.25);color:inherit;
    padding:1px 5px;border-radius:8px;margin-left:5px;
  }

    background:var(--border);color:var(--sub);

  /* ── Item chip bar ───────────────────────────────────────────────────────── */

    background:var(--card);border:1px solid var(--border);

  }

  }

  /* ── Editor/empty area ───────────────────────────────────────────────────── */
  .dash-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
    border-radius:20px;font-size:13px;font-weight:600;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);margin:3px;
  }

  .qb-preview {

  }
  .p-name  { color:#82AAFF;font-weight:700; }
  .p-where { color:#C3E88D; }

<script src="/static/js/filter_builder.js?v=2"></script>
<script src="/static/js/chips.js"></script>
<script src="/static/js/record_table.js?v=2"></script>
<script src="/static/js/time_picker.js"></script>
<script src="/static/js/drag.js"></script>
<script>
var _st = { queries:{}, metrics:{}, dashboards:{}, aliases:{}, due:{}, boards:{}, habits:{}, calendars:{}, thresholds:{} };
var _cur = null;
var _delPending = null;
var _types    = {{ types | tojson }};
var _timeOpts = {{ time_options | tojson }};

function _boardTimeOpts() {
  var skip = {year:1, month:1, date:1, range:1};
  var opts = _timeOpts.filter(function(o) { return !skip[o[1]]; });
  var has3m = opts.some(function(o) { return o[1] === 'last-3-months'; });
  if (!has3m) {
    var idx = 6;
    for (var i = 0; i < opts.length; i++) {
      if (opts[i][1] === 'lm') { idx = i + 1; break; }
    }
    opts.splice(idx, 0, ['Last 3 months', 'last-3-months']);
  }
  return opts;
}

// Initialize due from backend config
var _dueFromBackend = {{ due_config | tojson }};
Object.entries(_dueFromBackend).forEach(function(e) {
  _st.due[e[0]] = e[1];
});
var _fieldCache = {};   // {type: [{name, options, is_int}]}
var _cacheSet  = [];    // maintain insertion order for eviction
var _liveTimer = null;

// ── Boot ──────────────────────────────────────────────────────────────────────
(function() {
  var q = {{ queries | tojson }};
  var reserved = ["metrics","dashboards", "due"];
  Object.entries(q).forEach(function(e) {
    var k = e[0], v = e[1];
    if (reserved.indexOf(k)!==-1 || typeof v!=="object") return;
    if (k.startsWith("due.")) return;      // Skip due configs - loaded separately
    if (k.startsWith("board.")) return;    // Skip board configs - loaded separately
    if (k.startsWith("habit.")) return;    // Skip habit configs - loaded separately
    if (k.startsWith("calendar.")) return; // Skip calendar configs - loaded separately
    if (k.startsWith("threshold.")) return; // Skip threshold configs - loaded separately
    if (v.alias) {
      _st.aliases[k] = { alias: v.alias };
      return;
    }
    var parsed = _parseWhere(v.where||"");
    _st.queries[k] = {
      where:        v.where||"",
      time:         v.time||"tm",
      sum:          !!v.sum,
      group:        Array.isArray(v.group)?v.group[0]:(v.group||""),
      search:       v.search||"",
      sort:         v.sort||"",
      _chips:       parsed.chips,
      _exprManual:  parsed.manual,
      _activeField: null,
    };
  });
  // metrics — include all (derived metrics have .derived expression)
  Object.entries(q.metrics||{}).forEach(function(e) {
    var k = e[0], m = e[1];
    var kind="avg",base="",base2="",derived="",unit_field="",unit_weights={};
    if ("derived" in m) {
      derived = m.derived;
    } else if ("ratio" in m && Array.isArray(m.ratio)) {
      kind="ratio"; base=m.ratio[0]||""; base2=m.ratio[1]||"";
    } else if ("avg" in m) {
      kind="avg"; base=m.avg;
      unit_field = m.unit_field || "";
      unit_weights = m.unit_weights || {};
    } else if ("sum" in m) { kind="sum"; base=m.sum; }
    else if ("max" in m) { kind="max"; base=m.max; }
    else if ("min" in m) { kind="min"; base=m.min; }
    // Preserve any extra raw fields
    var raw = {};
    Object.keys(m).forEach(function(f) {
      if (["avg","sum","max","min","ratio","derived","unit_field","unit_weights"].indexOf(f)===-1) {
        raw[f] = m[f];
      }
    });
    _st.metrics[k] = { kind, base, base2, derived, unit_field, unit_weights, _raw: raw };
  });
  Object.entries(q.dashboards||{}).forEach(function(e) {
    _st.dashboards[e[0]] = { metrics: e[1].metrics||[], groups: Object.assign({}, e[1].groups)||{}, ungrouped_label: e[1].ungrouped_label||"" };
  });
  // Boards
  var _bkBoards = {{ boards | tojson }};
  Object.entries(_bkBoards).forEach(function(e) {
    var name = e[0].replace(/^board\./, '');
    var rawCtf = e[1].card_title_fields || '';
    var ctfArr = typeof rawCtf === 'string' ? rawCtf.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : (Array.isArray(rawCtf) ? rawCtf : []);
    _st.boards[name] = { columns: e[1].columns||[], time_window: e[1].time_window||'this-month', limit: e[1].limit||0, card_title_fields: ctfArr, rollup_field: e[1].rollup_field||'', rollup_op: e[1].rollup_op||'count', match_field: e[1].match_field||'' };
  });
  // Habits
  var _bkHabits = {{ habits | tojson }};
  Object.entries(_bkHabits).forEach(function(e) {
    var name = e[0].replace(/^habit\./, '');
    _st.habits[name] = { filters: e[1].filters||[], weeks: e[1].weeks||12 };
  });
  // Calendars
  var _bkCalendars = {{ calendars | tojson }};
  Object.entries(_bkCalendars).forEach(function(e) {
    var name = e[0].replace(/^calendar\./, '');
    _st.calendars[name] = { filters: e[1].filters||[], time_window: e[1].time_window||'this-month' };
  });
  // Thresholds
  var _bkThresholds = {{ thresholds | tojson }};
  Object.entries(_bkThresholds).forEach(function(e) {
    var name = e[0].replace(/^threshold\./, '');
    _st.thresholds[name] = { metric: e[1].metric||'', agg: e[1].agg||'', sum_field: e[1].sum_field||'', value: e[1].value||'', direction: e[1].direction||'max', time: e[1].time||'', unit: e[1].unit||'' };
  });
  renderTabs();
  // Check URL params for edit mode
  var params = new URLSearchParams(window.location.search);
  var editName = params.get("edit");
  var editSection = params.get("section");
  if (editName && editSection && _st[editSection]) {
    // Load existing item for editing
    switchSection(editSection);
    select(editSection, editName);
  } else {
    // Default: select first query
    switchSection("queries");
    var first = Object.keys(_st.queries)[0];
    if (first) select("queries", first);
  }
})();

// ── Parse simple where expression into chips + manual remainder ───────────────
// Handles field=value AND field=value — anything else stays in manual expr box
function _parseWhere(expr) {
  var chips = [], manual = [];
  if (!expr) return {chips, manual:""};
  expr.trim().split(/\s+AND\s+/i).forEach(function(p) {
    p = p.trim();
    var m = p.match(/^([a-z_][a-z0-9_]*)=([^\s()|&]+)$/i);
    if (m) chips.push({ field:m[1].toLowerCase(), op:"=", value:m[2] });
    else if (p) manual.push(p);
  });
  return { chips, manual: manual.join(" AND ") };
}

// ── Section switching ─────────────────────────────────────────────────────────
var _curSection = "queries";

function switchSection(sec) {
  _curSection = sec;
  // update section tab highlight
  document.querySelectorAll(".qb-sec-tab").forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.sec === sec);
  });
  // show only the matching item strip
  ["queries","metrics","dashboards","aliases","due","boards","habits","calendars","thresholds"].forEach(function(s) {
    var el = document.getElementById("tabs-"+s);
    if (el) el.style.display = s === sec ? "flex" : "none";
  });
}

// ── Tab rendering ─────────────────────────────────────────────────────────────
function renderTabs() {
  _renderSection("tabs-queries",    _st.queries,    "queries");
  _renderSection("tabs-metrics",    _st.metrics,    "metrics");
  _renderSection("tabs-dashboards", _st.dashboards, "dashboards");
  _renderSection("tabs-aliases",    _st.aliases,    "aliases");
  renderDueTabs();
  _renderSection("tabs-boards",     _st.boards,     "boards");
  _renderSection("tabs-habits",     _st.habits,     "habits");
  _renderSection("tabs-calendars",  _st.calendars,  "calendars");
  _renderSection("tabs-thresholds", _st.thresholds, "thresholds");
  _updateSectionCounts();
}

function _updateSectionCounts() {
  var counts = {
    queries:    Object.keys(_st.queries).length,
    metrics:    Object.keys(_st.metrics).length,
    dashboards: Object.keys(_st.dashboards).length,
    aliases:    Object.keys(_st.aliases).length,
    due:        Object.keys(_st.due).length,
    boards:     Object.keys(_st.boards).length,
    habits:     Object.keys(_st.habits).length,
    calendars:  Object.keys(_st.calendars).length,
    thresholds: Object.keys(_st.thresholds).length,
  };
  document.querySelectorAll(".qb-sec-tab").forEach(function(btn) {
    var sec = btn.dataset.sec;
    var existing = btn.querySelector(".sec-count");
    if (existing) existing.remove();
    if (counts[sec] > 0) {
      var badge = document.createElement("span");
      badge.className = "sec-count";
      badge.textContent = counts[sec];
      btn.appendChild(badge);
    }
  });
}

function _extraClassMap(data, section) {
  var map = {};
  var keys = Object.keys(data);
  keys.forEach(function(name) {
    if (section === "metrics" && data[name].derived) map[name] = "chip-derived";
    else if (section === "aliases") map[name] = "chip-alias";
  });
  return map;
}

function _renderSection(elId, data, section) {
  var el = document.getElementById(elId);
  if (!el) return;
  var keys = Object.keys(data);
  var selected = (_cur && _cur.section === section) ? _cur.name : null;
  var extraMap = _extraClassMap(data, section);
  // Build display names with badges for derived metrics
  var displayNames = {};
  keys.forEach(function(name) {
    var label = name;
    if (section === "metrics" && data[name].derived) {
      label = name + ' ⚡';
    } else if (section === "aliases") {
      label = name + ' ↳';
    }
    displayNames[name] = label;
  });
  renderChipGroup(el, keys, selected, function(name) { select(section, name); }, extraMap, displayNames);
}

function renderDueTabs() {
  _renderSection("tabs-due", _st.due, "due");
}

function select(section, name) {
  _cur = {section, name};
  if (_curSection !== section) switchSection(section);
  renderTabs();
  document.getElementById("entry-editor").style.display = "block";
  document.getElementById("entry-empty").style.display  = "none";
  renderEditor();
}

// ── Reset current query ───────────────────────────────────────────────────────
function _clearTime() {
  var sel = document.getElementById("qb-time-select");
  if (sel) sel.value = "";
  if (window._qb_tp) window._qb_tp.reset();
  _updateQ("time", "");
}

function resetQuery() {
  _clearTime();
  _cur = null;
  document.getElementById("entry-editor").style.display = "none";
  document.getElementById("entry-empty").style.display = "block";
  renderTabs();
}

// ── Add new ───────────────────────────────────────────────────────────────────
function addEntry() {
  var kind = prompt("What kind?\n  q = query\n  m = metric\n  d = dashboard\n  a = alias\n  u = due\n  b = board\n  h = habit\n  c = calendar\n  t = threshold","q");
  if (!kind) return;
  kind = kind.trim().toLowerCase();
  var section = kind==="m"?"metrics":kind==="d"?"dashboards":kind==="a"?"aliases":kind==="u"?"due":kind==="b"?"boards":kind==="h"?"habits":kind==="c"?"calendars":kind==="t"?"thresholds":"queries";
  var name = prompt("Name (lowercase, underscores):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
  if (!name) return;
  if (_st[section] && _st[section][name]) { alert("'"+name+"' already exists."); return; }
  if (section==="queries")
    _st.queries[name]    = {where:"",time:"tm",sum:false,group:"",search:"",_chips:[],_exprManual:"",_activeField:null};
  else if (section==="metrics")
    _st.metrics[name]    = {kind:"avg",base:"",base2:""};
  else if (section==="aliases")
    _st.aliases[name]    = {alias:""};
  else if (section==="due")
    _st.due[name]      = {type:"followup",key:"client",sort_by:"",days:7,exclude_results:[]};
  else if (section==="boards")
    _st.boards[name]   = {columns:[]};
  else if (section==="habits")
    _st.habits[name]   = {filters:[],weeks:12};
  else if (section==="calendars")
    _st.calendars[name] = {filters:[],time_window:'this-month'};
  else if (section==="thresholds")
    _st.thresholds[name] = {metric:"",agg:"sum",sum_field:"",value:"",direction:"max",time:"",unit:""};
  else
    _st.dashboards[name] = {metrics:[], groups:{}, ungrouped_label:""};
  renderTabs();
  select(section, name);
}

// ── Editor router ─────────────────────────────────────────────────────────────
function renderEditor() {
  var ed = document.getElementById("entry-editor");
  ed.innerHTML = "";
  if (!_cur) return;
  var s=_cur.section, n=_cur.name;
  if (s==="aliases") {
    _buildAliasEditor(ed, n);
    return;
  }
  if (s==="due") {
    showDueEditor();
    return;
  }
  if (s==="boards") {
    showBoardEditor();
    return;
  }
  if (s==="habits") {
    showHabitEditor();
    return;
  }
  if (s==="calendars") {
    showCalendarEditor();
    return;
  }
  if (s==="thresholds") {
    showThresholdEditor();
    return;
  }
  // header
  var hdr = document.createElement("div");
  hdr.className = "card"; hdr.style.marginBottom = "12px";
  hdr.innerHTML =

  container.appendChild(_mkCard("Full-text search",

  var c6 = document.createElement("div");

      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;">'+

// ── helpers scoped to query editor ───────────────────────────────────────────
function _typeFromChips(q) {
  var c = (q._chips||[]).find(function(c){ return c.field==="type"; });
  return c ? c.value : null;
}

function _buildWhereExpr(q) {
  var chips  = q._chips || [];
  var manual = (q._exprManual || "").trim();
  if (!chips.length) return manual;
  // Group same-field chips with OR, different fields with AND
  var byField = {}, order = [];
  chips.forEach(function(c) {
    if (!byField[c.field]) { byField[c.field] = []; order.push(c.field); }
    byField[c.field].push(c);
  });
  var parts = order.map(function(f) {
    var grp = byField[f];
    if (grp.length === 1) return grp[0].field + grp[0].op + grp[0].value;
    return "(" + grp.map(function(c){ return c.field+c.op+c.value; }).join(" OR ") + ")";
  });
  if (manual) parts.push(manual);
  return parts.join(" AND ");
}

function _buildFullWhereExpr(q) {
  return _buildWhereExpr(q);
}

function _buildChipFilters(q) {
  return (q._chips||[]).map(function(c){ return c.field+c.op+c.value; });
}

function _getContextStr(q) {
  var ctx = {};
  (q._chips||[]).forEach(function(c) {
    if (c.field !== "type") ctx[c.field] = c.value;
  });
  return Object.keys(ctx).sort().map(function(k){ return k+":"+ctx[k]; }).join(",");
}

function _updateQ(field, val) {
  if (!_cur||_cur.section!=="queries") return;
  _st.queries[_cur.name][field] = val;
  _updatePreview(_st.queries[_cur.name]);
  triggerLivePreview();
}

function _onExprInput(val) {
  if (!_cur) return;
  _st.queries[_cur.name]._exprManual = val;
  _updatePreview(_st.queries[_cur.name]);
  triggerLivePreview();
}

// ── FilterBuilder owns these — stubs kept for any remaining call sites ──────
function _renderTypeChips(q)  { if (q&&q._fb) q._fb._renderTypeRow(); }
function _fetchFields(t, q, cb) {
  if (!q || !q._fb) { if (cb) cb(); return; }
  var ctxStr = _getContextStr(q);
  var cacheKey = t + "?" + ctxStr;
  if (_fieldCache[cacheKey]) { cb(); return; }
  if (_cacheSet.length >= 20) {
    var oldKey = _cacheSet.shift();
    delete _fieldCache[oldKey];
  }
  var url = "/api/type_fields/" + encodeURIComponent(t);
  if (ctxStr) url += "?context=" + encodeURIComponent(ctxStr);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      _fieldCache[cacheKey] = {
        fields: (data.fields||[]).filter(function(f){ return !f.is_int && f.name!=="type"; }),
        dimensions: data.dimensions || []
      };
      _cacheSet.push(cacheKey);
      cb();
    })
    .catch(function() {
      _fieldCache[cacheKey] = { fields: [], dimensions: [] };
      _cacheSet.push(cacheKey);
      cb();
    });
}
function _renderFieldChips(q) { if (q&&q._fb) q._fb._renderFieldRow(); }
function _renderTagsSection(q){ if (q&&q._fb) q._fb._renderTagsSection(); }
function _renderActiveChips(q){ if (q&&q._fb) q._fb._renderActiveChips(); }
function _updateGroupSortDropdowns(q) {
  var grp = document.getElementById("qb-group");
  var sort = document.getElementById("qb-sort");
  if (!grp || !sort) return;
  var type = _typeFromChips(q);
  var ctxStr = _getContextStr(q);
  var cacheKey = type + "?" + ctxStr;
  var dims = (_fieldCache[cacheKey] || {}).dimensions || [];
  grp.innerHTML = '<option value="">— select —</option>';
  sort.innerHTML = '<option value="">— select —</option>';
  dims.forEach(function(d) {
    grp.innerHTML += '<option value="'+d+'">'+d+'</option>';
    sort.innerHTML += '<option value="'+d+'">'+d+'</option>';
  });
  if (q.group && grp.querySelector('option[value="'+q.group+'"]')) grp.value = q.group;
  if (q.sort && sort.querySelector('option[value="'+q.sort+'"]')) sort.value = q.sort;
}

function _toggleTagChip(value, q) {
  if (q && q._fb) { q._fb._toggleChip("tag", "=", value); }
  else {
    var chips = q._chips || [];
    var idx = chips.findIndex(function(c){return c.field==="tag"&&c.value===value;});
    if (idx !== -1) chips.splice(idx,1); else chips.push({field:"tag",op:"=",value:value});
    q._chips = chips;
  }
  q.where = _buildWhereExpr(q);
  _updatePreview(q);
  triggerLivePreview();
}

function _onFieldClick(fdef, q) {
  if (q && q._fb) q._fb._onFieldClick(fdef);
}

function _toggleValueChip(field, value, q) {
  if (q && q._fb) q._fb._toggleChip(field, "=", value);
  else {
    var idx = (q._chips||[]).findIndex(function(c){return c.field===field&&c.value===value;});
    if (!q._chips) q._chips = [];
    if (idx !== -1) q._chips.splice(idx,1);
    else q._chips.push({field:field,op:"=",value:value});
  }
  q.where = _buildWhereExpr(q);
  _updatePreview(q);
  triggerLivePreview();
}

function _toggleValueChip(field, value, q) {
  var idx = (q._chips||[]).findIndex(function(c){
    return c.field===field&&c.value===value;
  });
  if (idx!==-1) q._chips.splice(idx,1);
  else q._chips.push({field,op:"=",value});
  
  _renderActiveChips(q);
  _updatePreview(q);
  triggerLivePreview();
  
  // Re-fetch fields when parent chips change (to update child field options and tags)
  var type = _typeFromChips(q);
  if (type && field !== "type") {
    _fetchFields(type, q, function() {
      _renderFieldChips(q);
      _renderTagsSection(q);
      _updateGroupSortDropdowns(q);
      closeValueArea();
    });
  }
}

function closeValueArea() {
  if (!_cur) return;
  var q = _st.queries[_cur.name];

function _updatePreview(q) {
  q.where = _buildWhereExpr(q);
  var el = document.getElementById("qb-preview");
  if (!el) return;
  var name = _cur?_cur.name:"query";
  var timeLabel = (function(){
    for (var i=0;i<_timeOpts.length;i++) if (_timeOpts[i][1]===q.time) return _timeOpts[i][0];
    return q.time;
  })();
  var lines = [];
  lines.push('<span class="p-dim">[</span><span class="p-name">'+_esc(name)+
             '</span><span class="p-dim">]</span>');
  if (q.where)
    lines.push('where = <span class="p-where">"'+_esc(q.where)+'"</span>');
  lines.push('time  = <span class="p-time">"'+_esc(q.time)+'"</span>'+
             '<span class="p-dim">  ← '+_esc(timeLabel)+'</span>');
  if (q.group)
    lines.push('group = <span class="p-opt">["'+_esc(q.group)+'"]</span>');
  if (q.sort)
    lines.push('sort  = <span class="p-opt">"'+_esc(q.sort)+'"</span>');
  if (q.search)
    lines.push('search = <span class="p-opt">"'+_esc(q.search)+'"</span>');
  if (q.sum)
    lines.push('sum   = <span class="p-opt">true</span>');
  el.innerHTML = lines.join("<br>");
  
  // Sync FilterBuilder textarea with updated expression
  if (q._fb) q._fb.setExpr(_buildWhereExpr(q));
}

// METRIC EDITOR
// ══════════════════════════════════════════════════════════════════════════════
function _buildMetricEditor(name) {
  var m = _st.metrics[name];
  var div = document.createElement("div");
  var qNames = Object.keys(_st.queries);

  // ── Derived metric: editable expression with reference inserter ───────────
  if (m.derived) {
    var refs = Object.keys(_st.queries).map(function(n){
      return '<option value="'+n+'">query: '+n+'</option>';
    }).join("") +
    Object.keys(_st.metrics).filter(function(n){ return n!==name && !_st.metrics[n].derived; })
      .map(function(n){
      return '<option value="'+n+'">metric: '+n+'</option>';
    }).join("");
    div.appendChild(_mkCard("Metric type",
      '<input type="text" value="Derived" readonly'+
      ' style="background:var(--accent-lt);color:var(--accent);font-weight:700;border-color:var(--accent);">'));
    div.appendChild(_mkCard("Expression",
      '<input type="text" id="m-derived" value="'+_esc(m.derived)+'"'+
      ' placeholder="e.g. income - expense"'+
      ' style="font-family:monospace;" oninput="_st.metrics[_cur.name].derived=this.value">',
      "Math expression using other metrics. Type or use the inserter below."));
    div.appendChild(_mkCard("Insert reference",
      '<select id="m-ref" onchange="insertDerivedRef(this.value); this.value=\'\';">'+
        '<option value="">— pick a query or metric —</option>'+refs+'</select>',
      "Select to insert with spaces for operators."));
    return div;
  }

  // ── Regular metric: show editor ───────────────────────────────────────────
  var kindMap = {
    avg:"Average — mean amount across records",
    sum:"Total — sum of amount field",
    max:"Maximum — highest amount",
    min:"Minimum — lowest amount",
    ratio:"Ratio — (A ÷ B) × 100% (plain queries count records; sum metrics use summed value)"
  };
  var kindOpts = Object.keys(kindMap).map(function(k){
    return '<option value="'+k+'"'+(k===m.kind?" selected":"")+'>'+kindMap[k]+'</option>';
  }).join("");
  div.appendChild(_mkCard("Metric type",
    '<select id="m-kind" onchange="onMetricKindChange(this.value)">'+kindOpts+'</select>'));

  // Base query dropdown (used by sum, avg, min, max)
  var baseOpts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base?" selected":"")+'>'+n+'</option>';
  }).join("");
  // Ratio operands: base queries (→ record count) plus resolvable sum/avg metrics (→ value),
  // so ratios can compare monetary sums, not just record counts.
  var mNames = Object.keys(_st.metrics).filter(function(n){
    return n!==name && !_st.metrics[n].derived;
  });
  var mOpts = mNames.map(function(n){
    var kind = _st.metrics[n].kind || "metric";
    return '<option value="'+n+'"'+(n===m.base?" selected":"")+'>'+n+' ('+kind+')</option>';
  }).join("");
  var ratioOpts = baseOpts + mOpts;
  var baseRow = _mkCard(m.kind==="ratio"?"First operand (ratio numerator)":"Base query",
    '<select id="m-base" onchange="_st.metrics[_cur.name].base=this.value">'+
    '<option value="">— pick a query or metric —</option>'+(m.kind==="ratio"?ratioOpts:baseOpts)+'</select>',
    m.kind==="ratio"
      ? "Ratio numerator. A plain query counts matching records; a sum metric uses its summed value."
      : "Which base query to compute this metric on.");
  baseRow.id = "base-row";
  div.appendChild(baseRow);

  // Ratio: second operand (denominator)
  var base2Opts = qNames.map(function(n){
    return '<option value="'+n+'"'+(n===m.base2?" selected":"")+'>'+n+'</option>';
  }).join("");
  var mOpts2 = mNames.map(function(n){
    var kind = _st.metrics[n].kind || "metric";
    return '<option value="'+n+'"'+(n===m.base2?" selected":"")+'>'+n+' ('+kind+')</option>';
  }).join("");
  var r2 = _mkCard("Second operand (ratio denominator)",
    '<select id="m-base2" onchange="_st.metrics[_cur.name].base2=this.value">'+
    '<option value="">— pick a query or metric —</option>'+base2Opts+mOpts2+'</select>',
    "ratio = first value ÷ second value × 100%. Plain queries count records; sum metrics use their summed value.");
  r2.id = "ratio2-row";
  r2.style.display = m.kind==="ratio"?"block":"none";
  div.appendChild(r2);

  // Avg: unit_field and unit_weights
  var avgOpts = _mkCard("Unit field (optional)",
    '<input type="text" id="m-unit-field" value="'+_esc(m.unit_field||'')+'"'+
    ' placeholder="e.g. fit"'+
    ' oninput="_st.metrics[_cur.name].unit_field=this.value">',
    "Field to group by for weighted average.");
  avgOpts.id = "unit-field-row";
  avgOpts.style.display = m.kind==="avg"?"block":"none";
  div.appendChild(avgOpts);

  var weightsRow = document.createElement("div");
  weightsRow.className = "card"; weightsRow.style.marginBottom = "10px";
  weightsRow.id = "unit-weights-row";
  weightsRow.style.display = m.kind==="avg"?"block":"none";
  weightsRow.innerHTML =
    '<label>Unit weights (JSON)</label>'+
    '<textarea id="m-unit-weights" rows="4" placeholder="{ \&quot;monaural\&quot;: 1, \&quot;binaural\&quot;: 2 }"'+
    ' style="width:100%;font-family:monospace;font-size:13px;padding:8px;border-radius:8px;resize:vertical;"'+
    ' oninput="onUnitWeightsChange(this.value)">'+JSON.stringify(m.unit_weights||{},null,2)+'</textarea>'+
    '<div class="hint">Key-value pairs for weighted avg. Keys must match unit_field values.</div>';
  div.appendChild(weightsRow);

  // Raw extra config

var _dragDbItem = null;
var _dragGroupOrder = null;
function _buildDashEditor(name) {
  var db = _st.dashboards[name];
  var div = document.createElement("div");
  var card = document.createElement("div");
  card.className = "card"; card.style.marginBottom = "10px";
  var allNames = Object.keys(_st.queries).concat(Object.keys(_st.metrics));
  var opts = allNames.filter(function(n){ return db.metrics.indexOf(n)===-1; })
    .map(function(n){
      var m = _st.metrics[n];
      var tag = m ? (m.derived ? "derived" : "metric") : "query";
      return '<option value="'+n+'">'+n+' ('+tag+')</option>';
    }).join("");
  card.innerHTML =
    '<label>Items</label>'+
    '<div class="hint" style="margin-bottom:10px;">Choose queries and metrics to show on Home. Grouped and ungrouped items can mix — ungrouped ones render under their own header first (renameable via its ✎). Drag an item into a group, use a group\'s + button to move items, or drag a group\'s ⠿ grip to reorder sections.</div>'+
    '<div id="db-groups"></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;">'+
      '<select id="db-add-sel" style="flex:1;"><option value="">— add item —</option>'+opts+'</select>'+
      '<button onclick="addDashItem()" class="btn btn-ghost btn-sm">Add</button>'+
      '<button onclick="addDbGroup()" class="btn btn-ghost btn-sm">+ New group</button>'+
    '</div>';
  div.appendChild(card);
  // Defer renderBoxes until after div is in DOM
  setTimeout(function() { _renderDashBoxes(db); }, 0);
  return div;
}
function _groupOf(db, item) {
  for (var g in db.groups) {
    if (db.groups[g].indexOf(item) !== -1) return g;
  }
  return null;
}
function _renderDashBoxes(db) {
  var holder = document.getElementById("db-groups");
  if (!holder) return;
  var all = db.metrics.slice();
  for (var g in db.groups) {
    db.groups[g].forEach(function(item) {
      if (all.indexOf(item) === -1) all.push(item);
    });
  }
  holder.innerHTML = "";
  var buckets = {};   // "" or group name -> [items]
  function bucket(g) {
    if (!(g in buckets)) { buckets[g] = []; }
    return buckets[g];
  }
  all.forEach(function(item) {
    var g = _groupOf(db, item);
    bucket(g === null ? "" : g).push(item);
  });
  var order = [""].concat(Object.keys(db.groups));
  order.forEach(function(g) {
    if (g === "" && !bucket("").length) return;
    holder.appendChild(_buildDashBox(db, g, buckets[g] || []));
  });
}
function _buildDashBox(db, gname, items) {
  var boxEl = document.createElement("div");
  boxEl.className = "dbg-box" + (gname ? "" : " dbg-ungrouped");
  var head = document.createElement("div");
  head.className = "dbg-head";
  var nameSpan = document.createElement("span");
  nameSpan.className = "dbg-name";
  nameSpan.textContent = gname || db.ungrouped_label || "General (ungrouped)";
  head.appendChild(nameSpan);
  var actions = document.createElement("span");
  actions.style.display = "inline-flex"; actions.style.gap = "6px";
  if (gname) {
    var grip = document.createElement("button");
    grip.className = "btn btn-ghost btn-sm dbg-handle"; grip.textContent = "⠿";
    grip.title = "Drag to reorder this group";
    grip.draggable = true;
    grip.addEventListener("dragstart", function(e) {
      _dragGroupOrder = gname;
      if (e.dataTransfer) e.dataTransfer.setData("text/plain", gname);
    });
    grip.addEventListener("dragend", function() {
      _dragGroupOrder = null;
      document.querySelectorAll(".dbg-box.drag-over").forEach(function(b) { b.classList.remove("drag-over"); });
    });
    actions.appendChild(grip);
    var mvBtn = document.createElement("button");
    mvBtn.className = "btn btn-ghost btn-sm"; mvBtn.textContent = "+";
    mvBtn.title = "Move an item into this group";
    mvBtn.addEventListener("click", function() { _toggleDbMoveRow(boxEl, gname); });
    actions.appendChild(mvBtn);
  } else {
    var ulBtn = document.createElement("button");
    ulBtn.className = "btn btn-ghost btn-sm"; ulBtn.textContent = "✎";
    ulBtn.title = "Rename the ungrouped section label";
    ulBtn.addEventListener("click", function() { renameUngrouped(); });
    actions.appendChild(ulBtn);
  }
  var renameBtn = document.createElement("button");
  renameBtn.className = "btn btn-ghost btn-sm"; renameBtn.textContent = "✎";
  renameBtn.title = "Rename group";
  renameBtn.addEventListener("click", function() { renameDbGroup(gname); });
  var delBtn = document.createElement("button");
  delBtn.className = "btn btn-ghost btn-sm"; delBtn.textContent = "×";
  delBtn.title = "Remove group (items become ungrouped)";
  delBtn.addEventListener("click", function() { deleteDbGroup(gname); });
  if (gname) { actions.appendChild(renameBtn); actions.appendChild(delBtn); }
  head.appendChild(actions);
  boxEl.appendChild(head);
  var chips = document.createElement("div");
  chips.className = "chip-group";
  items.forEach(function(item) { chips.appendChild(_dbChip(db, item)); });
  if (!items.length && gname) {
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Group is empty — drag items here or use the + button to move them in.";
    chips.appendChild(hint);
  }
  boxEl.appendChild(chips);
  boxEl.dataset.group = gname;
  boxEl.ondragover = function(e) {
    e.preventDefault();
    if (_dragDbItem || _dragGroupOrder) boxEl.classList.add("drag-over");
  };
  boxEl.ondragleave = function() { boxEl.classList.remove("drag-over"); };
  boxEl.ondrop = function(e) {
    e.preventDefault();
    boxEl.classList.remove("drag-over");
    if (_dragGroupOrder) {
      reorderDbGroup(_dragGroupOrder, boxEl.dataset.group || "");
    } else if (_dragDbItem) {
      moveDbItem(db, _dragDbItem, boxEl.dataset.group || "");
    }
    _dragDbItem = null; _dragGroupOrder = null;
  };
  return boxEl;
}
function _toggleDbMoveRow(boxEl, gname) {
  var cur = boxEl.querySelector(".dbg-moverow");
  if (cur) { cur.remove(); return; }
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var row = document.createElement("div");
  row.className = "dbg-moverow";
  var sel = document.createElement("select");
  db.metrics.forEach(function(item) {
    if (_groupOf(db, item) === gname) return;
    var m = _st.metrics[item];
    var tag = m ? (m.derived ? "derived" : "metric") : "query";
    var opt = document.createElement("option");
    opt.value = item;
    opt.textContent = item + " (" + tag + ")";
    sel.appendChild(opt);
  });
  row.appendChild(sel);
  if (!sel.options.length) {
    var empty = document.createElement("span");
    empty.className = "hint";
    empty.textContent = "Everything is already in this group.";
    row.appendChild(empty);
  } else {
    var go = document.createElement("button");
    go.className = "btn btn-ghost btn-sm";
    go.textContent = "Move →";
    go.addEventListener("click", function() {
      if (!sel.value) return;
      moveDbItem(db, sel.value, gname);
    });
    row.appendChild(go);
    sel.focus();
  }
  boxEl.appendChild(row);
}
function _dbChip(db, item) {
  var chip = document.createElement("span");
  chip.className = "dash-chip";
  chip.draggable = true;
  var m = _st.metrics[item];
  var tag = m ? (m.derived ? "derived" : "metric") : "query";
  var tagSpan = document.createElement("span");
  tagSpan.style.cssText = "color:var(--accent);opacity:.7;font-size:11px;margin-right:4px;";
  tagSpan.textContent = tag;
  var nameSpan = document.createElement("span");
  nameSpan.textContent = item;
  var rmBtn = document.createElement("button");
  rmBtn.textContent = "×";
  rmBtn.title = "Remove item";
  rmBtn.addEventListener("click", function() { removeDashItem(item); });
  chip.appendChild(tagSpan); chip.appendChild(nameSpan); chip.appendChild(rmBtn);
  chip.addEventListener("dragstart", function() {
    _dragDbItem = item;
    chip.classList.add("dragging");
  });
  chip.addEventListener("dragend", function() {
    _dragDbItem = null;
    chip.classList.remove("dragging", "drag-over");
    document.querySelectorAll(".dbg-box.drag-over").forEach(function(b) { b.classList.remove("drag-over"); });
  });

}
function addDbGroup() {
  if (!_cur) return;
  var name = prompt("Group name (shown as a section label on Home):");
  if (!name) return;
  name = name.trim();
  if (!name) return;
  var db = _st.dashboards[_cur.name];
  if (db.groups[name] !== undefined) { alert("Group '"+name+"' already exists."); return; }
  db.groups[name] = [];
  _renderDashBoxes(db);
}
function renameDbGroup(name) {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var newName = prompt("Rename group:", name);
  if (!newName) return;
  newName = newName.trim();
  if (!newName || newName === name) return;
  if (db.groups[newName] !== undefined) { alert("Group '"+newName+"' already exists."); return; }
  db.groups[newName] = db.groups[name];
  delete db.groups[name];
  _renderDashBoxes(db);
}
function deleteDbGroup(name) {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  delete db.groups[name];
  _renderDashBoxes(db);
}
function renameUngrouped() {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var label = prompt("Label for the ungrouped section (shown as a Home header; type a name or leave blank to keep it headerless):", db.ungrouped_label || "General (ungrouped)");
  if (label === null) return;
  label = label.trim();
  db.ungrouped_label = (label === "General (ungrouped)") ? "" : label;
  _renderDashBoxes(db);
}
function reorderDbGroup(src, target) {
  if (!_cur || src === target) return;
  var db = _st.dashboards[_cur.name];
  var keys = Object.keys(db.groups);
  var si = keys.indexOf(src), ti = keys.indexOf(target);
  if (si === -1) return;
  keys.splice(si, 1);
  if (ti !== -1) {
    keys.splice(ti, 0, src);
  } else {
    keys.push(src);
  }
  var out = {};
  keys.forEach(function(k) { out[k] = db.groups[k]; });
  db.groups = out;
  _renderDashBoxes(db);
}
function moveDbItem(db, item, gname) {
  if (!item) return;
  for (var g in db.groups) {
    var arr = db.groups[g];
    var i = arr.indexOf(item);
    if (i !== -1) arr.splice(i, 1);
  }
  if (gname && db.groups[gname] !== undefined) db.groups[gname].push(item);
  var mi = db.metrics.indexOf(item);
  if (mi !== -1) db.metrics.splice(mi, 1);
  db.metrics.push(item);
  _renderDashBoxes(db);
}
function addDashItem() {
  var sel = document.getElementById("db-add-sel");
  var item = sel.value; if (!item||!_cur) return;
  var db = _st.dashboards[_cur.name];
  if (db.metrics.indexOf(item)===-1) db.metrics.push(item);
  _renderDashBoxes(db);
  var opt = sel.querySelector('option[value="'+item+'"]');
  if (opt) opt.remove(); sel.value="";
}
function removeDashItem(item) {
  if (!_cur) return;
  var db = _st.dashboards[_cur.name];
  var removed = item;
  for (var g in db.groups) {
    var arr = db.groups[g];
    var i = arr.indexOf(item);
    if (i !== -1) arr.splice(i, 1);
  }
  var mi = db.metrics.indexOf(item);
  if (mi !== -1) db.metrics.splice(mi, 1);
  _renderDashBoxes(db);
  var sel = document.getElementById("db-add-sel");
  if (sel) {
    var opt = document.createElement("option");
    opt.value = removed; opt.textContent = removed; sel.appendChild(opt);
  }
}

function askDelete() {
  if (!_cur) return;
  _delPending = {section:_cur.section, name:_cur.name};
  document.getElementById("del-msg-text").textContent =
    "Delete "+_cur.section.slice(0,-1)+" '"+_cur.name+"'?";
  document.getElementById("del-modal").style.display = "flex";
}
function closeDeleteModal() {
  _delPending = null;
  document.getElementById("del-modal").style.display = "none";
}
function confirmDelete() {
  if (!_delPending) return;
  var s=_delPending.section, n=_delPending.name;
  closeDeleteModal();
  // Due/Board configs have no individual backend delete endpoint — remove from state
  // and immediately Save All so the deletion persists.
  if (s === "due" || s === "boards" || s === "habits" || s === "calendars") {
    delete _st[s][n]; _cur=null; renderTabs();
    document.getElementById("entry-editor").style.display = "none";
    document.getElementById("entry-empty").style.display  = "block";
    saveAll();
    return;
  }
  var kindMap = {queries:"query", metrics:"metric", aliases:"alias", dashboards:"dashboard"};
  fetch("/query-builder/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:n, kind:kindMap[s]||"query"})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.ok) {
      delete _st[s][n]; _cur=null; renderTabs();
      document.getElementById("entry-editor").style.display = "none";
      document.getElementById("entry-empty").style.display  = "block";
      showMsg("✔ Deleted",true);
    } else showMsg("✖ "+d.error,false);
  })
  .catch(function(e){ showMsg("✖ "+e,false); });
}

function saveAll() {
  // sync all where expressions from chips before saving
  Object.keys(_st.queries).forEach(function(n) {
    _st.queries[n].where = _buildWhereExpr(_st.queries[n]);
  });
  var payload = { metrics:_st.metrics, dashboards:_st.dashboards, queries:{}, aliases:_st.aliases, due:_st.due };
  Object.entries(_st.queries).forEach(function(e) {
    var k=e[0],v=e[1];
    payload.queries[k] = {where:v.where,time:v.time,sum:v.sum,group:v.group,search:v.search,sort:v.sort};
  });
  var btn = document.getElementById("save-btn");
  btn.disabled=true; btn.textContent="Saving…";
  fetch("/query-builder/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    btn.disabled=false; btn.textContent="💾 Save All";
    if (d.ok) showMsg("✔ Saved to queries.toml",true);
    else      showMsg("✖ "+d.error,false);
  })
  .catch(function(e){
    btn.disabled=false; btn.textContent="💾 Save All";
    showMsg("✖ "+e,false);
  });
}

function triggerLivePreview() {
  if (!_cur || _cur.section !== "queries") return;
  clearTimeout(_liveTimer);
  _liveTimer = setTimeout(function() {
    var area = document.getElementById("qb-live-area");
    if (!area) return;
    _initQbRt();
    var q = _st.queries[_cur.name];
    var grpEl = document.getElementById("qb-group");
    var sortEl = document.getElementById("qb-sort");
    var group = grpEl ? grpEl.value : "";
    var sort  = sortEl ? sortEl.value : "";
    var time = q.time || "tm";
    var from_date = null, to_date = null;
    if (time === "range") {
      var r = window._qb_tp ? window._qb_tp.getRange() : null;
      if (r) { from_date = r.from; to_date = r.to; }
    }
    area.innerHTML = '<div style="color:var(--sub);padding:16px;">Loading…</div>';
    fetch("/browse/run", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({where:_buildChipFilters(q), expr:q._exprManual||"", search:q.search||"", time:time, group:group, sort:sort, from_date:from_date, to_date:to_date})
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (!d.ok) { area.innerHTML = '<div style="color:var(--error);padding:16px;">'+_esc(d.error)+'</div>'; return; }
      var recs = d.data;
      if (recs.kind === "group") {
        var hasTot = recs.has_amount;
        var head = '<th>Group</th><th>Count</th>'+(hasTot?'<th style="text-align:right">Total</th>':'');
        var rows = (recs.rows||[]).map(function(r){
          return '<tr><td>'+_esc(r.key)+'</td><td>'+r.count+'</td>'+(hasTot?'<td style="text-align:right">'+(r.total_fmt||'')+'</td>':'')+'</tr>';
        }).join('');

          '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
      } else {
        area.innerHTML = "";
        _qbRt.render(recs);
      }
    })
    .catch(function(e){ area.innerHTML = '<div style="color:var(--error);padding:16px;">'+_esc(String(e))+'</div>'; });
  }, 400);
}

}

  });
  var btn = document.getElementById("save-btn");
  btn.disabled=true; btn.textContent="Saving…";
  fetch("/query-builder/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    btn.disabled=false; btn.textContent="💾 Save All";
    if (d.ok) showMsg("✔ Saved to queries.toml",true);
    else      showMsg("✖ "+d.error,false);
  })
  .catch(function(e){
    btn.disabled=false; btn.textContent="💾 Save All";
    showMsg("✖ "+e,false);
  });
}

}

function onThrField(field) {
  var cfg = _st.thresholds[_cur.name];
  if (!cfg) return;
  if (field === "direction") cfg.direction = document.getElementById("thr-direction").value;
  else if (field === "agg") cfg.agg = document.getElementById("thr-agg").value;
  else if (field === "time") cfg.time = document.getElementById("thr-time").value;
  else if (field === "value") {
    var sel = document.getElementById("thr-value-select");
    var num = document.getElementById("thr-value-num");
    cfg.value = (sel && sel.value) ? sel.value : (num ? num.value : "");
  }
  else cfg[field] = document.getElementById("thr-" + field.replace(/_/g, "-")).value;
}

function onThrValueSelect() {
  var cfg = _st.thresholds[_cur.name];
  if (!cfg) return;
  var sel = document.getElementById("thr-value-select");
  var num = document.getElementById("thr-value-num");
  if (!sel) return;
  if (sel.value === "") {
    num.style.display = "";
    num.focus();
    cfg.value = num.value;
  } else {
    num.style.display = "none";
    num.value = "";
    cfg.value = sel.value;
  }
}

function renderChipPicker(opts) {
  var el = document.getElementById(opts.containerId);
  if (!el) return;
  var items = opts.items();
  if (!items) items = [];
  var available = opts.available() || [];
  el.innerHTML = "";
  if (opts.emptyText && available.length === 0) {
    el.innerHTML = opts.emptyText;
    return;
  }
  items.forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "dash-chip";
    chip.textContent = item;
    chip.innerHTML += ' <button onclick="'+opts.removeFn+'('+i+')" style="background:none;border:none;cursor:pointer;color:var(--error);font-size:14px;line-height:1;padding:0;margin-left:2px;">×</button>';
    chip.dataset.index = i;
    _makeDraggable(chip, items, i, opts.onReorder, ".dash-chip");
    el.appendChild(chip);
  });
  var addContainer = document.createElement("div");
  addContainer.style.marginTop = items.length ? "8px" : "0";
  addContainer.innerHTML = '<div style="font-size:11px;color:var(--sub);margin-bottom:4px;">'+opts.addLabel+'</div>';
  available.forEach(function(item) {
    if (items.indexOf(item) !== -1) return;
    var chip = document.createElement("button");
    chip.className = "qb-chip";
    chip.textContent = '+ ' + item;
    chip.addEventListener("click", function() {
      opts.onAdd(item);
    });
    addContainer.appendChild(chip);
  });
  el.appendChild(addContainer);
}

function renderBoardColChips(selected) {
  renderChipPicker({
    containerId: "board-col-chips",
    items: function() { return _st.boards[_cur.name].columns || []; },
    available: function() { return _types; },
    removeFn: "removeBoardCol",
    addLabel: "Add column:",
    onReorder: function() {
      renderBoardColChips(_st.boards[_cur.name].columns);
      fetchBoardOverlap(_st.boards[_cur.name].columns);
    },
    onAdd: function(t) {
      var cfg = _st.boards[_cur.name];
      if (!cfg) return;
      if (!cfg.columns) cfg.columns = [];
      cfg.columns.push(t);
      renderBoardColChips(cfg.columns);
      fetchBoardOverlap(cfg.columns);
    }
  });
}

function removeBoardCol(idx) {
  var cfg = _st.boards[_cur.name];
  if (!cfg || !cfg.columns) return;
  cfg.columns.splice(idx, 1);
  renderBoardColChips(cfg.columns);
  fetchBoardOverlap(cfg.columns);
}

function onBoardTimeWindowChange() {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  cfg.time_window = document.getElementById("board-time-window").value;
}

function onBoardLimitChange() {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  var val = parseInt(document.getElementById("board-limit").value, 10);
  cfg.limit = val > 0 ? val : 0;
}

var _lastAllFields = [];
var _lastAggFields = [];

function _commonTitleFields(resp) {
  var overlap = resp.ok && resp.overlap ? resp.overlap : [];
  return overlap.filter(function(f) { return f !== "date" && f !== "type" && f !== "note"; });
}

function fetchBoardOverlap(types) {
  var area = document.getElementById("board-overlap-area");
  var fieldsEl = document.getElementById("board-overlap-fields");
  var statusEl = document.getElementById("board-overlap-status");
  if (!area || !fieldsEl || !statusEl) return;
  if (types.length < 2) {
    area.style.display = "none";
    fetch("/api/board/field-overlap", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({types: types})
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      _lastAllFields = _commonTitleFields(d);
      _lastAggFields = d.ok && d.aggregatable_all ? d.aggregatable_all : [];
      renderBoardTitleChips();
      renderBoardRollup();
    })
    .catch(function() {
      _lastAllFields = [];
      _lastAggFields = [];
      renderBoardTitleChips();
      renderBoardRollup();
    });
    return;
  }
  area.style.display = "block";
  fieldsEl.innerHTML = '<span style="color:var(--border);">Checking…</span>';
  fetch("/api/board/field-overlap", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({types: types})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.ok && d.overlap) {
      var meaningful = d.overlap.filter(function(f){ return f !== "date" && f !== "type"; });
      if (meaningful.length === 0) {
        statusEl.innerHTML = '<span style="color:var(--error);">⚠ Only date/type — cards will have no shared fields</span>';
        fieldsEl.innerHTML = 'date, type';
      } else {
        statusEl.innerHTML = '<span style="color:var(--success);">✔ ' + meaningful.length + ' shared fields</span>';
        fieldsEl.innerHTML = d.overlap.join(', ');
      }
      _lastAllFields = _commonTitleFields(d);
      _lastAggFields = d.ok && d.aggregatable_all ? d.aggregatable_all : [];
    } else {
      statusEl.innerHTML = '<span style="color:var(--error);">Error checking overlap</span>';
      fieldsEl.innerHTML = '';
      _lastAllFields = [];
      _lastAggFields = [];
    }
    renderBoardTitleChips();
    renderBoardRollup();
  })
  .catch(function() {
    statusEl.innerHTML = '<span style="color:var(--error);">Error</span>';
    fieldsEl.innerHTML = '';
    _lastAllFields = [];
    _lastAggFields = [];
    renderBoardTitleChips();
    renderBoardRollup();
  });
}

function renderBoardTitleChips() {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  renderChipPicker({
    containerId: "board-title-chips",
    items: function() { return cfg.card_title_fields || []; },
    available: function() { return _lastAllFields; },
    emptyText: '<span style="font-size:12px;color:var(--sub);">Add column types above to see available fields</span>',
    removeFn: "removeCardTitleField",
    addLabel: "Add title field:",
    onReorder: function() {
      renderBoardTitleChips();
    },
    onAdd: addCardTitleField
  });
}

function addCardTitleField(field) {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  if (!cfg.card_title_fields) cfg.card_title_fields = [];
  cfg.card_title_fields.push(field);
  renderBoardTitleChips();
}

function removeCardTitleField(idx) {
  var cfg = _st.boards[_cur.name];
  if (!cfg || !cfg.card_title_fields) return;
  cfg.card_title_fields.splice(idx, 1);
  renderBoardTitleChips();
}

function renderBoardRollup() {
  var cfg = _st.boards[_cur.name];
  var sel = document.getElementById("board-rollup-field");
  if (!cfg || !sel) return;
  if (cfg.rollup_field && _lastAggFields.indexOf(cfg.rollup_field) === -1) {
    cfg.rollup_field = "";
  }
  var cur = cfg.rollup_field || "";
  sel.innerHTML = '<option value="">— none —</option>' +
    _lastAggFields.map(function(f) {
      return '<option value="'+f+'"'+(cur===f?' selected':'')+'>'+f+'</option>';
    }).join("");
}

function onBoardRollupChange() {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  cfg.rollup_field = document.getElementById("board-rollup-field").value;
  cfg.rollup_op = document.getElementById("board-rollup-op").value;
}

function onBoardMatchFieldChange() {
  var cfg = _st.boards[_cur.name];
  if (!cfg) return;
  cfg.match_field = document.getElementById("board-match-field").value.trim();
}

function onBoardNameChange() {
  var inp = document.getElementById("board-name-input");
  if (!inp) return;
  var newName = inp.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  var old = _cur.name;
  if (!newName || newName === old || _st.boards[newName]) return;
  _st.boards[newName] = _st.boards[old];
  delete _st.boards[old];
  _cur.name = newName;
  renderTabs();
}

function renderDueTypeChips(selected) {
  var el = document.getElementById("due-type-chips");
  if (!el) return;
  el.innerHTML = "";
  _types.forEach(function(t) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (t===selected ? " active" : "");
    chip.textContent = t;
    chip.addEventListener("click", function() {
      var cfg = _st.due[_cur.name];
      if (cfg) {
        cfg.type = t;
        cfg.key = "";
        cfg.sort_by = "";
      }
      renderDueTypeChips(t);
      fetchDueFieldsForType(t);
    });
    el.appendChild(chip);
  });
}

function fetchDueFieldsForType(typeName) {
  var keyEl = document.getElementById("due-key-chips");
  var sortEl = document.getElementById("due-sort-chips");
  if (!keyEl || !sortEl) return;
  
  keyEl.innerHTML = '<span style="font-size:12px;color:var(--border);">Loading…</span>';
  sortEl.innerHTML = '<span style="font-size:12px;color:var(--border);">Loading…</span>';
  
  fetch("/api/type_fields/"+encodeURIComponent(typeName))
  .then(function(r){ return r.json(); })
  .then(function(data) {
    var fields = (data.fields||[]).filter(function(f){ return !f.is_int && f.name!=="type"; });
    var cfg = _st.due[_cur.name] || {};
    
    // Render Key chips
    keyEl.innerHTML = "";
    fields.forEach(function(f) {
      var chip = document.createElement("button");
      chip.className = "qb-chip" + (f.name === cfg.key ? " active" : "");
      chip.textContent = f.name;
      chip.addEventListener("click", function() {
        _st.due[_cur.name].key = (_st.due[_cur.name].key === f.name) ? "" : f.name;
        renderDueKeyChips(fields);
      });
      keyEl.appendChild(chip);
    });
    
    // Render Sort chips
    sortEl.innerHTML = "";
    fields.forEach(function(f) {
      var chip = document.createElement("button");
      chip.className = "qb-chip" + (f.name === cfg.sort_by ? " active" : "");
      chip.textContent = f.name;
      chip.addEventListener("click", function() {
        _st.due[_cur.name].sort_by = (_st.due[_cur.name].sort_by === f.name) ? "" : f.name;
        renderDueSortChips(fields);
      });
      sortEl.appendChild(chip);
    });
    
    // Render exclude chips
    renderDueExcludeChips();
  })
  .catch(function(){
    keyEl.innerHTML = '<span style="font-size:12px;color:var(--error);">Error loading</span>';
    sortEl.innerHTML = '<span style="font-size:12px;color:var(--error);">Error loading</span>';
  });
}

function renderDueKeyChips(fields) {
  var el = document.getElementById("due-key-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name] || {};
  el.innerHTML = "";
  fields.forEach(function(f) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (f.name === cfg.key ? " active" : "");
    chip.textContent = f.name;
    chip.addEventListener("click", function() {
      _st.due[_cur.name].key = (_st.due[_cur.name].key === f.name) ? "" : f.name;
      renderDueKeyChips(fields);
    });
    el.appendChild(chip);
  });
}

function renderDueSortChips(fields) {
  var el = document.getElementById("due-sort-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name] || {};
  el.innerHTML = "";
  fields.forEach(function(f) {
    var chip = document.createElement("button");
    chip.className = "qb-chip" + (f.name === cfg.sort_by ? " active" : "");
    chip.textContent = f.name;
    chip.addEventListener("click", function() {
      _st.due[_cur.name].sort_by = (_st.due[_cur.name].sort_by === f.name) ? "" : f.name;
      renderDueSortChips(fields);
    });
    el.appendChild(chip);
  });
}

function onDueSortChange() {
  var sel = document.getElementById("due-sort");
  if (!sel) return;
  _st.due[_cur.name].sort_by = sel.value;
}

function onDueDaysChange() {
  var inp = document.getElementById("due-days");
  if (!inp) return;
  _st.due[_cur.name].days = parseInt(inp.value) || 7;
}

function onDueNameChange() {
  var inp = document.getElementById("due-name-input");
  if (!inp) return;
  var newName = inp.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  var old = _cur.name;
  if (!newName || newName === old || _st.due[newName]) return;
  _st.due[newName] = _st.due[old];
  delete _st.due[old];
  _cur.name = newName;
  renderDueTabs();
}

function renderDueExcludeChips() {
  var el = document.getElementById("due-exclude-chips");
  if (!el) return;
  var cfg = _st.due[_cur.name];
  if (!cfg) return;
  el.innerHTML = "";
  var list = cfg.exclude_results || [];
  list.forEach(function(item, i) {
    var chip = document.createElement("span");
    chip.className = "qb-active-chip";
    chip.innerHTML = item+' <button onclick="removeDueExclude('+i+')">×</button>';
    el.appendChild(chip);
  });
}

function addDueExclude() {
  var inp = document.getElementById("due-exclude-input");
  var val = inp.value.trim();
  if (!val) return;
  var cfg = _st.due[_cur.name];
  if (!cfg) return;
  if (!cfg.exclude_results) cfg.exclude_results = [];
  if (cfg.exclude_results.indexOf(val)===-1) cfg.exclude_results.push(val);
  inp.value = "";
  renderDueExcludeChips();
}

function removeDueExclude(idx) {
  var cfg = _st.due[_cur.name];
  if (!cfg || !cfg.exclude_results) return;
  cfg.exclude_results.splice(idx, 1);
  renderDueExcludeChips();
}

function addNewDue() {
  var name = prompt("New due config name (e.g., followup, assessment, investment):");
  if (!name) return;
  name = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  if (!name || _st.due[name]) { alert("Invalid or already exists"); return; }
  _st.due[name] = {
    type: "followup",
    key: "client",
    sort_by: "intent",
    days: 7,
    exclude_results: []
  };
  select("due", name);
}

window._onQBTimeChange = function(val) {
  if (window._qb_tp) window._qb_tp.onSelectChange(val);
};

</script>
