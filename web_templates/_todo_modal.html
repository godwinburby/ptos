<!-- Shared todo modal for add + edit — included by todo.html and routines.html -->
<div class="modal-overlay" id="todo-modal">
  <div class="modal-box">
    <h3 id="todo-modal-title">New Task</h3>
    <input type="hidden" id="modal-line-no" value="">
    <input type="hidden" id="modal-target" value="">
    <div class="modal-field modal-field-bulk-hide">
      <label>Description</label>
      <input type="text" id="modal-desc" placeholder="What needs to be done?">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Priority</label>
        <select id="modal-pri">
          <option value="">None</option>
          {% for letter in "ABCDEFGHIJKLMNOPQRSTUVWXYZ" %}
          <option value="{{ letter }}">{% set lbl = priority_labels.get(letter, {'A':'Critical','B':'Important','C':'Moderate','D':'Low'}.get(letter, '')) %}{{ letter }}{% if lbl %} — {{ lbl }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="modal-field">
        <label>Due</label>
        <input type="date" id="modal-due">
      </div>
      <div class="modal-field">
        <label>Due Time</label>
        <input type="time" id="modal-due-time">
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Threshold</label>
        <input type="date" id="modal-threshold">
      </div>
      <div class="modal-field">
        <label>Threshold Time</label>
        <input type="time" id="modal-threshold-time">
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Recurrence</label>
        <select id="modal-rec">
          <option value="">None</option>
          <option value="1d">Daily</option>
          <option value="1w">Weekly</option>
          <option value="2w">Biweekly</option>
          <option value="1m">Monthly</option>
          <option value="2m">Bimonthly</option>
          <option value="3m">Quarterly</option>
          <option value="1y">Yearly</option>
          <option value="+1m">Strict Monthly</option>
          <option value="+1w">Strict Weekly</option>
          <option value="+1y">Strict Yearly</option>
        </select>
    </div>
    </div>
    <div class="modal-field">
      <label>Projects</label>
      <div class="modal-chips" id="modal-project-chips">
        {% for p in projects %}
        <span class="modal-chip" data-value="{{ p }}" onclick="toggleModalChip(this)">{{ p }}</span>
        {% endfor %}
        <span class="modal-chip modal-chip-other" onclick="toggleOtherInput(this, 'project')">+ New</span>
      </div>
      <input type="text" class="modal-other-input" id="modal-project-other" placeholder="New project name" style="display:none;" onkeydown="handleOtherKey(event, 'project')">
    </div>
    <div class="modal-field">
      <label>Contexts</label>
      <div class="modal-chips" id="modal-context-chips">
        {% for c in contexts %}
        <span class="modal-chip" data-value="{{ c }}" onclick="toggleModalChip(this)">{{ c }}</span>
        {% endfor %}
        <span class="modal-chip modal-chip-other" onclick="toggleOtherInput(this, 'context')">+ New</span>
      </div>
      <input type="text" class="modal-other-input" id="modal-context-other" placeholder="New context name" style="display:none;" onkeydown="handleOtherKey(event, 'context')">
    </div>
    <div class="modal-field modal-field-bulk-hide">
      <label>Id <span class="modal-sub">(link target)</span></label>
      <div class="modal-id-row">
        <input type="text" id="modal-id" placeholder="e.g. t7c2b8" list="link-id-list" style="flex:1;">
        <button type="button" class="btn-save" onclick="generateTodoId()" title="Generate a random id">Generate</button>
      </div>
      <datalist id="link-id-list"></datalist>
    </div>
    <div class="modal-field modal-field-bulk-hide">
      <label>Links <span class="modal-sub">(comma-separated type:id, e.g. expense:k3f9a1)</span></label>
      <input type="text" id="modal-links" placeholder="expense:k3f9a1, todo:t7c2b8" oninput="onLinksInput(this)" onkeydown="handleLinksKey(event)">
      <div class="todo-ac-list" id="modal-links-ac"></div>
    </div>
    <div class="modal-actions">
      {% if show_delete %}
      <button class="btn-cancel" id="todo-modal-delete" onclick="deleteTodoFromModal()" style="color:var(--error);border-color:var(--error);display:none;">Delete</button>
      {% endif %}
      <button class="btn-cancel" onclick="closeTodoModal()">Cancel</button>
      <button class="btn-save" id="todo-modal-save" onclick="saveTodoModal()">Add</button>
    </div>
  </div>
</div>

<script>
function openTodoModal(mode, lineNo, desc, pri, due, dueTime, threshold, thresholdTime, projects, contexts, rec, id, links) {
  const el = document.getElementById('todo-modal');
  document.getElementById('todo-modal-title').textContent = mode === 'edit' ? 'Edit Task' : 'New Task';
  document.getElementById('todo-modal-save').textContent = mode === 'edit' ? 'Save' : 'Add';
  const delBtn = document.getElementById('todo-modal-delete');
  if (delBtn) delBtn.style.display = (mode === 'edit' && lineNo) ? '' : 'none';
  document.getElementById('modal-line-no').value = mode === 'edit' ? lineNo : '';
  document.getElementById('modal-target').value = 'todo';
  document.getElementById('modal-desc').value = desc || '';
  document.getElementById('modal-pri').value = pri || '';
  document.getElementById('modal-due').value = due || '';
  document.getElementById('modal-due-time').value = dueTime || '';
  document.getElementById('modal-threshold').value = threshold || '';
  document.getElementById('modal-threshold-time').value = thresholdTime || '';
  document.getElementById('modal-rec').value = rec || '';
  document.getElementById('modal-id').value = id || '';
  document.getElementById('modal-links').value = (links || '').split(',').filter(Boolean).join(', ');

  var projList = (projects || '').split(/\s+/).filter(Boolean);
  document.querySelectorAll('#modal-project-chips .modal-chip:not(.modal-chip-other)').forEach(function(c) {
    c.classList.toggle('selected', projList.indexOf(c.dataset.value) !== -1);
  });
  var ctxList = (contexts || '').split(/\s+/).filter(Boolean);
  document.querySelectorAll('#modal-context-chips .modal-chip:not(.modal-chip-other)').forEach(function(c) {
    c.classList.toggle('selected', ctxList.indexOf(c.dataset.value) !== -1);
  });

  document.getElementById('modal-project-other').style.display = 'none';
  document.getElementById('modal-project-other').value = '';
  document.getElementById('modal-context-other').style.display = 'none';
  document.getElementById('modal-context-other').value = '';

  el.classList.add('open');
  document.getElementById('modal-desc').focus();
}

function openAdd() { openTodoModal('add'); }

function openEdit(lineNo, desc, pri, due, dueTime, threshold, thresholdTime, projects, contexts, rec, id, links) {
  openTodoModal('edit', lineNo, desc, pri, due, dueTime, threshold, thresholdTime, projects, contexts, rec, id, links);
}

function openEditDone(lineNo, desc, pri, due, dueTime, threshold, thresholdTime, projects, contexts, rec, id, links) {
  openTodoModal('edit', lineNo, desc, pri, due, dueTime, threshold, thresholdTime, projects, contexts, rec, id, links);
  document.getElementById('modal-target').value = 'done';
  document.getElementById('todo-modal-title').textContent = 'Edit Done Task';
}

function generateTodoId() {
  var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  var out = '';
  for (var i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('modal-id').value = out;
}

var _acLinksIdx = -1, _acLinksItems = [];

function onLinksInput(inputEl) {
  var input = inputEl || document.getElementById('modal-links');
  var val = input.value;
  var pos = input.selectionStart;
  var before = val.substring(0, pos);
  var words = before.split(/[\s,]+/);
  var token = words[words.length - 1] || '';
  var list = document.getElementById('modal-links-ac');
  if (!token || !window._linkIdItems) { list.classList.remove('open'); return; }
  var q = token.toLowerCase();
  _acLinksItems = window._linkIdItems.filter(function(it) {
    return it.target.toLowerCase().indexOf(q) !== -1;
  });
  if (!_acLinksItems.length) { list.classList.remove('open'); return; }
  _acLinksIdx = -1;
  list.innerHTML = _acLinksItems.map(function(it, i) {
    return '<div class="todo-ac-item" data-idx="'+i+'">'+it.target+' <span class="ac-desc">'+it.label+'</span></div>';
  }).join('');
  list.classList.add('open');
}

function handleLinksKey(e) {
  var list = document.getElementById('modal-links-ac');
  if (!list.classList.contains('open')) { onLinksInput(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); _acLinksIdx = Math.min(_acLinksIdx + 1, _acLinksItems.length - 1); _acLinksHighlight(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _acLinksIdx = Math.max(_acLinksIdx - 1, 0); _acLinksHighlight(); }
  else if (e.key === 'Enter' && _acLinksIdx >= 0) { e.preventDefault(); pickLinksAC(_acLinksIdx); }
  else if (e.key === 'Escape') { list.classList.remove('open'); }
  else { onLinksInput(); }
}

function _acLinksHighlight() {
  var list = document.getElementById('modal-links-ac');
  list.querySelectorAll('.todo-ac-item').forEach(function(el, i) { el.classList.toggle('active', i === _acLinksIdx); });
}

function pickLinksAC(idx) {
  var input = document.getElementById('modal-links');
  var item = _acLinksItems[idx];
  if (!item) return;
  var val = input.value;
  var pos = input.selectionStart;
  var before = val.substring(0, pos);
  var words = before.split(/[\s,]+/);
  var token = words[words.length - 1] || '';
  var tokenStart = before.lastIndexOf(token);
  var newVal = before.substring(0, tokenStart) + item.target + val.substring(pos);
  input.value = newVal.replace(/,\s*,/g, ', ').trim();
  var newPos = tokenStart + item.target.length;
  input.setSelectionRange(newPos, newPos);
  input.focus();
  document.getElementById('modal-links-ac').classList.remove('open');
}

function closeTodoModal() {
  document.getElementById('todo-modal').classList.remove('open');
  document.querySelectorAll('.modal-field-bulk-hide').forEach(function(f) { f.style.display = ''; });
}

function deleteTodoFromModal() {
  var lineNo = document.getElementById('modal-line-no').value;
  if (!lineNo) return;
  if (!confirm('Delete this task?')) return;
  var target = document.getElementById('modal-target').value || 'todo';
  var url = target === 'done' ? '/todo/delete-done' : '/todo/delete';
  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({line_no: parseInt(lineNo)})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) { window.location.reload(); }
    else { alert(d.error || 'Failed'); }
  })
  .catch(function() { alert('Network error'); });
}

function toggleModalChip(el) {
  el.classList.toggle('selected');
}

function toggleOtherInput(chipEl, type) {
  var input = document.getElementById('modal-' + type + '-other');
  if (input.style.display === 'none') {
    input.style.display = 'block';
    input.focus();
  } else {
    var val = input.value.trim();
    if (val) {
      var chip = document.createElement('span');
      chip.className = 'modal-chip selected';
      chip.dataset.value = val;
      chip.textContent = val;
      chip.onclick = function() { toggleModalChip(this); };
      chipEl.parentNode.insertBefore(chip, chipEl);
      input.value = '';
    }
    input.style.display = 'none';
  }
}

function handleOtherKey(e, type) {
  if (e.key === 'Enter') {
    e.preventDefault();
    var otherChip = document.querySelector('#modal-' + type + '-chips .modal-chip-other');
    toggleOtherInput(otherChip, type);
  }
}

function _collectChips(containerId) {
  var chips = document.querySelectorAll('#' + containerId + ' .modal-chip.selected');
  return Array.from(chips).map(function(c) { return c.dataset.value; });
}

function _presetChip(containerId, value) {
  var chips = document.querySelectorAll('#' + containerId + ' .modal-chip:not(.modal-chip-other)');
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].dataset.value === value) {
      chips[i].classList.add('selected');
      return;
    }
  }
  var otherInput = document.getElementById(containerId.replace('-chips', '-other'));
  if (otherInput) {
    otherInput.value = value;
    otherInput.style.display = 'block';
  }
}

function saveTodoModal() {
  var lineNo = document.getElementById('modal-line-no').value;
  var desc = document.getElementById('modal-desc').value.trim();
  var pri = document.getElementById('modal-pri').value.trim().toUpperCase();
  var due = document.getElementById('modal-due').value;
  var dueTime = document.getElementById('modal-due-time').value;
  var threshold = document.getElementById('modal-threshold').value;
  var thresholdTime = document.getElementById('modal-threshold-time').value;

  var otherProj = document.getElementById('modal-project-other').value.trim();
  var otherCtx = document.getElementById('modal-context-other').value.trim();
  var projs = _collectChips('modal-project-chips');
  var ctxs = _collectChips('modal-context-chips');
  if (otherProj) projs.push(otherProj);
  if (otherCtx) ctxs.push(otherCtx);
  var rec = document.getElementById('modal-rec').value;
  var tid = document.getElementById('modal-id').value.trim().replace(/[^\w-]/g, '');
  var links = document.getElementById('modal-links').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);

  if (typeof _selMode !== 'undefined' && _selMode && lineNo) {
    var updates = {};
    if (pri) updates.priority = pri;
    if (due) updates.due = dueTime ? due + 'T' + dueTime : due;
    if (threshold) updates.threshold = thresholdTime ? threshold + 'T' + thresholdTime : threshold;
    if (rec) updates.rec = rec;
    if (projs.length) updates.projects = projs.map(function(p) { return '+' + p.replace(/^\+/, ''); });
    if (ctxs.length) updates.contexts = ctxs.map(function(c) { return '@' + c.replace(/^@/, ''); });
    if (Object.keys(updates).length === 0) { alert('No changes to apply'); return; }
    fetch('/todo/bulk-edit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({line_nos: Object.keys(_selLines).map(Number), updates: updates})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { window.location.reload(); }
      else { alert(d.error || 'Failed to bulk edit'); }
    })
    .catch(function() { alert('Network error'); });
    return;
  }

  if (!desc) { alert('Description is required'); return; }

  if (lineNo) {
    var updates = {
      description: desc,
      priority: pri || null,
      due: due ? (dueTime ? due + 'T' + dueTime : due) : null,
      threshold: threshold ? (thresholdTime ? threshold + 'T' + thresholdTime : threshold) : null,
      rec: rec || null,
      projects: projs.map(function(p) { return '+' + p.replace(/^\+/, ''); }),
      contexts: ctxs.map(function(c) { return '@' + c.replace(/^@/, ''); })
    };
    if (tid) updates.id = tid;
    else if (!document.getElementById('modal-id').value.trim()) updates.id = null;
    updates.links = links;
    var target = document.getElementById('modal-target').value || 'todo';
    var editUrl = target === 'done' ? '/todo/edit-done' : '/todo/edit';
    fetch(editUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({line_no: parseInt(lineNo), updates: updates})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { window.location.reload(); }
      else { alert(d.error || 'Failed to save'); }
    })
    .catch(function() { alert('Network error'); });
  } else {
    var line = desc;
    if (pri) line = '(' + pri + ') ' + line;
    projs.forEach(function(p) { line += ' +' + p.replace(/^\+/, ''); });
    ctxs.forEach(function(c) { line += ' @' + c.replace(/^@/, ''); });
    if (due) line += ' due:' + due + (dueTime ? 'T' + dueTime : '');
    if (threshold) line += ' t:' + threshold + (thresholdTime ? 'T' + thresholdTime : '');
    if (tid) line += ' id:' + tid;
    if (links.length) line += ' links:' + links.join(',');
    fetch('/todo/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: line})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { window.location.reload(); }
      else { alert(d.error || 'Failed to add todo'); }
    })
    .catch(function() { alert('Network error'); });
  }
}

document.getElementById('todo-modal').addEventListener('click', function(e) {
  if (e.target === this) closeTodoModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeTodoModal();
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    openAdd();
  }
});
</script>
