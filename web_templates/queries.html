{% extends "base.html" %}
{% block content %}

<div class="page-title">Queries</div>

<div class="card">
  <div class="field-group">
    <label>Query / Metric / Dashboard</label>
    <select id="q-select" onchange="runQuery()">
      <option value="">— select —</option>
      {% if queries %}<optgroup label="Queries">
        {% for n in queries %}<option value="q:{{ n }}">{{ n }}</option>{% endfor %}
      </optgroup>{% endif %}
      {% if metrics %}<optgroup label="Metrics">
        {% for n in metrics %}<option value="m:{{ n }}">{{ n }}</option>{% endfor %}
      </optgroup>{% endif %}
      {% if dashboards %}<optgroup label="Dashboards">
        {% for n in dashboards %}<option value="d:{{ n }}">{{ n }}</option>{% endfor %}
      </optgroup>{% endif %}
    </select>
  </div>
    <div class="field-group">
    <label>Time Override</label>
    <select id="q-time" onchange="onQTimeChange(this.value)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
      <option value="">(query default)</option>
      {% for label, code in time_options %}
      <option value="{{ code }}" {% if code == current_time %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <!-- month picker on its own row for mobile -->
  <div id="q-custom-time" class="field-group" style="display:none;">
    <label>Custom Month</label>
    <button id="q-month-picker-btn" onclick="qTogglePicker(event)"
            style="display:flex;align-items:center;justify-content:space-between;
                   padding:9px 12px;border-radius:6px;border:1px solid var(--border);
                   background:var(--bg);color:var(--text);font-size:14px;font-weight:500;
                   cursor:pointer;min-width:140px;">
      <span id="q-month-text">{% if custom_time and custom_time|length >= 7 %}{{ custom_time[:7] }}{% else %}Pick a month{% endif %}</span>
      <span style="font-size:10px;color:var(--sub);">▼</span>
    </button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-ghost btn-sm" onclick="clearOut()">✕ Clear</button>
  </div>
</div>

<!-- queries month picker popup -->
<div id="q-month-picker-popup"
     style="display:none;position:fixed;z-index:600;
            background:var(--card);border:1px solid var(--border);
            border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.22);
            padding:16px;width:252px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <button onclick="qShiftYear(-1)"
            style="background:none;border:none;font-size:20px;color:var(--text);
                   cursor:pointer;padding:2px 10px;border-radius:6px;line-height:1;">&lt;</button>
    <span id="q-picker-year" style="font-weight:700;font-size:15px;color:var(--text);"></span>
    <button onclick="qShiftYear(1)"
            style="background:none;border:none;font-size:20px;color:var(--text);
                   cursor:pointer;padding:2px 10px;border-radius:6px;line-height:1;">&gt;</button>
  </div>
  <div id="q-picker-grid"
       style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;"></div>
</div>

<!-- Delete modal -->
<div id="q-del-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:340px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--error);">Delete Record</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:8px;">This cannot be undone (backup is kept).</div>
    <div id="q-del-line" style="font-family:monospace;font-size:12px;background:var(--bg);
         padding:8px;border-radius:6px;word-break:break-all;margin-bottom:14px;"></div>
    <div id="q-del-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;background:var(--error);" onclick="qDoDelete()">Delete</button>
      <button class="btn btn-ghost"   style="flex:1;" onclick="qCloseDelete()">Cancel</button>
    </div>
  </div>
</div>

<div id="result-area"></div>

<script>
// ── Queries month picker ─────────────────────────────────────────────────────
(function() {
  var MONTHS  = ["Jan","Feb","Mar","Apr","May","Jun",
                 "Jul","Aug","Sep","Oct","Nov","Dec"];
  var yearMin = {{ year_range[0] }};
  var yearMax = {{ year_range[-1] }};
  var selYear = new Date().getFullYear();
  var selMonth = null;

  function render() {
    document.getElementById("q-picker-year").textContent = selYear;
    var grid = document.getElementById("q-picker-grid");
    grid.innerHTML = "";
    MONTHS.forEach(function(name, i) {
      var mm = String(i + 1).padStart(2, "0");
      var active = (selMonth === mm);
      var btn = document.createElement("button");
      btn.textContent = name;
      btn.style.cssText =
        "padding:9px 0;border-radius:8px;cursor:pointer;font-size:13px;" +
        "border:1px solid " + (active ? "var(--accent)" : "var(--border)") + ";" +
        "background:"       + (active ? "var(--accent)" : "var(--bg)")     + ";" +
        "color:"            + (active ? "#fff"           : "var(--text)")  + ";" +
        "font-weight:"      + (active ? "700"            : "400")          + ";";
      btn.addEventListener("click", function() {
        selMonth = mm;
        qClose();
        document.getElementById("q-month-text").textContent =
          selYear + "-" + mm;
        runQuery();
      });
      grid.appendChild(btn);
    });
  }

  window.qShiftYear = function(d) {
    var n = selYear + d;
    if (n < yearMin || n > yearMax) return;
    selYear = n; render();
  };

  window.qTogglePicker = function(e) {
    e.stopPropagation();
    var pop = document.getElementById("q-month-picker-popup");
    if (pop.style.display === "none") {
      render();
      var btn  = document.getElementById("q-month-picker-btn");
      var rect = btn.getBoundingClientRect();
      pop.style.top  = (rect.bottom + window.scrollY + 6) + "px";
      var POP_W = 260;
      pop.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - POP_W)) + "px";
      pop.style.display = "block";
    } else { qClose(); }
  };

  function qClose() {
    document.getElementById("q-month-picker-popup").style.display = "none";
  }
  window._qCloseMonthPicker = qClose;

  document.addEventListener("click", function(e) {
    var pop = document.getElementById("q-month-picker-popup");
    if (!pop || pop.style.display === "none") return;
    if (!pop.contains(e.target) && e.target.id !== "q-month-picker-btn") qClose();
  });

  window._qGetTime = function() {
    var t = document.getElementById("q-time").value;
    if (t === "custom") {
      return (selMonth) ? selYear + "-" + selMonth : null;
    }
    return t || null;
  };
  
  // Restore state from URL params
  (function() {
    var params = new URLSearchParams(window.location.search);
    var time = params.get("time");
    if (time === "custom") {
      var ct = params.get("custom_time");
      if (ct && ct.length >= 7) {
        document.getElementById("q-time").value = "custom";
        document.getElementById("q-custom-time").style.display = "block";
        selYear = parseInt(ct.substring(0, 4));
        selMonth = ct.substring(5, 7);
        document.getElementById("q-month-text").textContent = ct.substring(0, 7);
      }
    }
  })();
})();

function onQTimeChange(val) {
  var div = document.getElementById("q-custom-time");
  if (val === "custom") {
    div.style.display = "flex";
  } else {
    div.style.display = "none";
    window._qCloseMonthPicker();
    if (val) runQuery();
  }
}

function runQuery() {
  const raw  = document.getElementById("q-select").value;
  const time = window._qGetTime();
  // if custom chosen but no month picked yet, wait
  if (document.getElementById("q-time").value === "custom" && !time) return;
  const area = document.getElementById("result-area");
  if (!raw) return;
  const [kind, ...rest] = raw.split(":");
  const name = rest.join(":");
  area.innerHTML = '<div class="card" style="color:var(--sub);font-size:13px;">Loading…</div>';
  fetch("/queries/run", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({kind, name, time})
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) { area.innerHTML = errorCard(d.error); return; }
    area.innerHTML = renderResult(d.data);
  })
  .catch(e => { area.innerHTML = errorCard(String(e)); });
}

function clearOut() {
  document.getElementById("q-select").value = "";
  document.getElementById("q-time").value = "";
  document.getElementById("q-custom-time").style.display = "none";
  window._qCloseMonthPicker();
  document.getElementById("q-month-text").textContent = "Pick a month";
  document.getElementById("result-area").innerHTML = "";
}

function errorCard(msg) {
  return `<div class="card"><div class="msg msg-error">${msg}</div></div>`;
}

function renderResult(d) {
  if (!d) return errorCard("No data");
  switch(d.kind) {
    case "dashboard": return renderDashboard(d);
    case "metric":    return renderMetric(d);
    case "group":     return renderGroup(d);
    case "pivot":     return renderPivot(d);
    case "trend":     return renderTrend(d);
    case "records":   return renderRecords(d);
    default:          return errorCard("Unknown result type");
  }
}

function exprBadge(d) {
  if (!d.where_expr && !d.query_name) return "";
  const name = d.query_name ? `<strong>${d.query_name}</strong>` : "";
  const expr = d.where_expr
    ? `<code style="font-size:11px;background:var(--bg);padding:2px 8px;
         border-radius:4px;color:var(--sub);word-break:break-all;">${d.where_expr}</code>`
    : "";
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
               font-size:13px;color:var(--sub);margin-bottom:10px;">
    ${name}${expr}
  </div>`;
}

function renderDashboard(d) {
  const items = (d.items||[]).map(i =>
    `<div class="stat-card">
      <div class="stat-label">${i.name.replace(/_/g," ")}</div>
      <div class="stat-value" style="font-size:20px;">${i.value}</div>
      <div class="stat-sub">${d.period||""}</div>
    </div>`).join("");
  return `<div class="card"><div class="card-title">Dashboard · ${d.name}</div>
    <div class="stat-grid">${items}</div></div>`;
}

function renderMetric(d) {
  return `<div class="card">
    <div class="card-title">Metric</div>
    <div style="font-size:28px;font-weight:800;color:var(--accent);">${d.value}</div>
    <div style="font-size:13px;color:var(--sub);margin-top:4px;">${d.name.replace(/_/g," ")}</div>
  </div>`;
}

function renderGroup(d) {
  const hasTot = d.has_amount;
  const heads  = hasTot
    ? `<th>Group</th><th style="text-align:right">Count</th><th style="text-align:right">Total</th>`
    : `<th>Group</th><th style="text-align:right">Count</th>`;
  const rows = (d.rows||[]).map(r => hasTot
    ? `<tr><td>${r.key}</td><td style="text-align:right">${r.count}</td><td style="text-align:right">${r.total_fmt}</td></tr>`
    : `<tr><td>${r.key}</td><td style="text-align:right">${r.count}</td></tr>`).join("");
  const foot = hasTot
    ? `<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">${d.grand_count}</td><td style="text-align:right">${d.grand_total_fmt}</td></tr>`
    : `<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">${d.grand_count}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Grouped by ${(d.fields||[]).join(", ")} · ${d.time_label}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
    ${summaryBar(d)}
  </div>`;
}

function renderPivot(d) {
  const cols  = d.cols || [];
  const heads = `<th>${d.row_field}</th>${cols.map(c=>`<th style="text-align:right">${c}</th>`).join("")}<th style="text-align:right">Total</th>`;
  const rows  = (d.rows||[]).map(r => {
    const cells = cols.map(c=>`<td style="text-align:right">${r[c]||0}</td>`).join("");
    return `<tr><td>${r.label}</td>${cells}<td style="text-align:right;font-weight:700">${r.total}</td></tr>`;
  }).join("");
  const totCells = cols.map(c=>`<td style="text-align:right;font-weight:700">${(d.col_totals||{})[c]||0}</td>`).join("");
  const foot = `<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td>${totCells}<td style="text-align:right">${d.grand}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Pivot · ${d.row_field} × ${d.col_field} · ${d.time_label}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
  </div>`;
}

function renderTrend(d) {
  const has  = d.has_amount;
  const head = has
    ? `<th>Period</th><th style="text-align:right">Count</th><th style="text-align:right">Total</th><th style="text-align:right">Avg</th>`
    : `<th>Period</th><th style="text-align:right">Count</th>`;
  const rows = (d.periods||[]).map(p => has
    ? `<tr><td>${p.label}</td><td style="text-align:right">${p.count}</td><td style="text-align:right">${p.total_fmt}</td><td style="text-align:right">${p.avg_fmt}</td></tr>`
    : `<tr><td>${p.label}</td><td style="text-align:right">${p.count}</td></tr>`).join("");
  return `<div class="card">
    <div class="card-title">Trend · ${d.filter_str}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

// ── Records with edit/delete ──────────────────────────────────────────────────
let _qRecords = [];

function renderRecords(d) {
  if (!d.records || !d.records.length)
    return `<div class="card" style="color:var(--sub);text-align:center;padding:24px;">No records found.</div>`;
  _qRecords = d.records;
  const cols  = (d.columns || []).filter(c => !c.startsWith("_"));
  const heads = cols.map(c=>`<th>${c}</th>`).join("") + `<th style="width:80px"></th>`;
  const rows  = d.records.map((r,i) => {
    const cells = cols.map(c=>`<td>${r[c]||""}</td>`).join("");
    const acts  = r._line
      ? `<td style="white-space:nowrap;">
           <a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;"
             href="/edit?filepath=${encodeURIComponent(r._filepath)}&lineno=${r._lineno}&line=${encodeURIComponent(r._line)}&return_to=${encodeURIComponent(window.location.pathname)}">✎</a>
           <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);"
             onclick="qOpenDelete(${i})">✕</button>
         </td>`
      : `<td></td>`;
    return `<tr>${cells}${acts}</tr>`;
  }).join("");
  return `<div class="card">
    ${exprBadge(d)}
    ${summaryBar(d)}
    <div style="overflow-x:auto;margin-top:8px;"><table class="data-table">
      <thead><tr>${heads}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function summaryBar(d) {
  const parts = [];
  if (d.count !== undefined) parts.push(`<span>${d.count} records</span>`);
  if (d.total_fmt) parts.push(`<span>Total: <strong>${d.total_fmt}</strong></span>`);
  if (d.avg_fmt)   parts.push(`<span>Avg: <strong>${d.avg_fmt}</strong></span>`);
  if (d.time_label) parts.push(`<span style="color:var(--sub)">${d.time_label}</span>`);
  return parts.length
    ? `<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:8px;">${parts.join("")}</div>`
    : "";
}

// ── Delete modal ──────────────────────────────────────────────────────────────
let _qDelRecord = null;

function qOpenDelete(idx) {
  const r = _qRecords[idx];
  if (!r || !r._line) return;
  _qDelRecord = r;
  document.getElementById("q-del-line").textContent  = r._line;
  document.getElementById("q-del-msg").style.display = "none";
  document.getElementById("q-del-dialog").style.display = "flex";
}

function qCloseDelete() {
  document.getElementById("q-del-dialog").style.display = "none";
}

function qDoDelete() {
  if (!_qDelRecord) return;
  const msg = document.getElementById("q-del-msg");
  fetch("/api/records/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      filepath: _qDelRecord._filepath,
      old_line: _qDelRecord._line,
      lineno:   _qDelRecord._lineno
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) { qCloseDelete(); runQuery(); }
    else { msg.textContent = d.error; msg.style.display = "block"; }
  })
  .catch(e => { msg.textContent = String(e); msg.style.display = "block"; });
}

document.getElementById("q-del-dialog").addEventListener("click", function(e) {
  if (e.target === this) qCloseDelete();
});

// ── Auto-run from URL params (?run=name&time=code) ────────────────────────────
(function() {
  var params = new URLSearchParams(window.location.search);
  var run    = params.get("run");
  var time   = params.get("time") || "";
  if (!run) return;

  // find the matching option in q-select
  var sel = document.getElementById("q-select");
  var found = null;
  for (var i = 0; i < sel.options.length; i++) {
    var opt = sel.options[i];
    // options are formatted as "q:name", "m:name", "d:name"
    var parts = opt.value.split(":");
    if (parts.length >= 2 && parts.slice(1).join(":") === run) {
      found = opt.value; break;
    }
  }
  if (!found) return;
  sel.value = found;

  // set time override if provided
  var timeSel = document.getElementById("q-time");
  if (time && timeSel) {
    // check if it's a valid option
    for (var j = 0; j < timeSel.options.length; j++) {
      if (timeSel.options[j].value === time) {
        timeSel.value = time; break;
      }
    }
  }

  // scroll results into view after run
  runQuery();
  setTimeout(function() {
    var area = document.getElementById("result-area");
    if (area) area.scrollIntoView({behavior:"smooth", block:"start"});
  }, 600);
})();
</script>
{% endblock %}
