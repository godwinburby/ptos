{% extends "base.html" %}
{% block content %}

<div class="page-title">Queries</div>

<div class="card">
  <div class="chip-section" style="border-top:3px solid var(--accent);">
    <div class="chip-section-header" onclick="toggleSection(this)">
      <div class="chip-section-label" style="color:var(--accent);">Queries</div>
      <span class="chip-toggle">−</span>
    </div>
    <div id="q-chip-group" class="chip-group"></div>
  </div>
  {% if metrics %}
  <div class="chip-section collapsed" style="border-top:3px solid var(--success);">
    <div class="chip-section-header" onclick="toggleSection(this)">
      <div class="chip-section-label" style="color:var(--success);">Metrics</div>
      <span class="chip-toggle">+</span>
    </div>
    <div id="m-chip-group" class="chip-group"></div>
  </div>
  {% endif %}
  {% if dashboards %}
  <div class="chip-section collapsed" style="border-top:3px solid var(--warn);">
    <div class="chip-section-header" onclick="toggleSection(this)">
      <div class="chip-section-label" style="color:var(--warn);">Dashboards</div>
      <span class="chip-toggle">+</span>
    </div>
    <div id="d-chip-group" class="chip-group"></div>
  </div>
  {% endif %}
  {% if thresholds %}
  <div class="chip-section collapsed" style="border-top:3px solid #E74C3C;">
    <div class="chip-section-header" onclick="toggleSection(this)">
      <div class="chip-section-label" style="color:#E74C3C;">Thresholds</div>
      <span class="chip-toggle">+</span>
    </div>
    <div id="t-chip-group" class="chip-group"></div>
  </div>
  {% endif %}
  <div class="field-group">
    <label>Time Override</label>
    <select id="q-time-select" onchange="onQTimeChange(this.value)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
      <option value="">(query default)</option>
      {% for label, code in time_options %}
      <option value="{{ code }}" {% if code == current_time %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  {% with prefix="q-" %}
  {% include "_time_picker.html" %}
  {% endwith %}
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <button class="btn btn-ghost btn-sm" onclick="clearOut()">✕ Clear</button>
    <a id="builder-link" href="/query-builder" class="btn btn-ghost btn-sm">Query Builder</a>
  </div>
</div>


<!-- Delete modal injected by RecordTable -->

<div id="result-area"></div>

<script src="/static/js/record_table.js"></script>
<script src="/static/js/time_picker.js"></script>
<script src="/static/js/chips.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
var _qKind = null;
var _qName = null;
var _qNames = {{ queries | tojson }};
var _mNames = {{ metrics | tojson }};
var _dNames = {{ dashboards | tojson }};
var _tNames = {{ thresholds | tojson }};

function _selectChip(kind, name) {
  _qKind = kind;
  _qName = name;
  _renderAllChips();
  runQuery();
}

function _selectThreshold(name) {
  _qKind = "t";
  _qName = name;
  _renderAllChips();
  var area = document.getElementById("result-area");
  area.innerHTML = '<div class="card" style="color:var(--sub);font-size:13px;">Loading…</div>';
  fetch("/api/thresholds/status")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { area.innerHTML = errorCard(d.error || "Failed to load thresholds"); return; }
      var match = (d.thresholds || []).filter(function(t) { return t.name === name; });
      area.innerHTML = renderThresholdResult(match);
    })
    .catch(function(e) { area.innerHTML = errorCard(String(e)); });
  var builderLink = document.getElementById("builder-link");
  if (builderLink) builderLink.href = "/query-builder";
}

function toggleSection(el) {
  var section = el.parentElement;
  section.classList.toggle("collapsed");
  el.querySelector(".chip-toggle").textContent =
    section.classList.contains("collapsed") ? "+" : "−";
}

function _renderAllChips() {
  var selected = (_qKind === "q") ? _qName : null;
  var el = document.getElementById("q-chip-group");
  if (el) renderChipGroup(el, _qNames, selected, function(n) { _selectChip("q", n); });
  selected = (_qKind === "m") ? _qName : null;
  el = document.getElementById("m-chip-group");
  if (el) renderChipGroup(el, _mNames, selected, function(n) { _selectChip("m", n); });
  selected = (_qKind === "d") ? _qName : null;
  el = document.getElementById("d-chip-group");
  if (el) renderChipGroup(el, _dNames, selected, function(n) { _selectChip("d", n); });
  el = document.getElementById("t-chip-group");
  if (el) renderChipGroup(el, _tNames, (_qKind==="t")?_qName:null, function(n) { _selectThreshold(n); });
}

// ── Queries TimePicker ─────────────────────────────────────────────────────
var tp;
(function() {
  tp = new TimePicker({
    prefix: "q-",
    yearMin: {{ year_range[0] }},
    yearMax: {{ year_range[-1] }},
    onChange: function(code) { if (_qName) runQuery(); }
  });

  // Restore state from URL params
  (function() {
    var params = new URLSearchParams(window.location.search);
    var time = params.get("time");
    if (time === "range") {
      tp.setTime("range", null, params.get("from_date"), params.get("to_date"));
    } else if (time) {
      tp.setTime(time, params.get("custom_time"));
    }
  })();
})();

function onQTimeChange(val) { tp.onSelectChange(val); }

window._qGetTime = function() { return tp.getTime(); };

function runQuery() {
  var time = window._qGetTime();
  // if custom chosen but no value picked yet, wait
  const timeVal = document.getElementById("q-time-select").value;
  if (timeVal === "custom" && !time) return;
  var from_date = null, to_date = null;
  if (time === "range" && tp) {
    var r = tp.getRange();
    if (r) { from_date = r.from; to_date = r.to; }
  }
  const area = document.getElementById("result-area");
  var kind = _qKind, name = _qName;
  if (!kind || !name) return;
  // update builder link with selected item
  const builderLink = document.getElementById("builder-link");
  if (builderLink) {
    if (kind === "q") {
      builderLink.href = "/query-builder?edit=" + encodeURIComponent(name) + "&section=queries";
    } else if (kind === "m") {
      builderLink.href = "/query-builder?edit=" + encodeURIComponent(name) + "&section=metrics";
    } else if (kind === "d") {
      builderLink.href = "/query-builder?edit=" + encodeURIComponent(name) + "&section=dashboards";
    } else {
      builderLink.href = "/query-builder";
    }
  }
  area.innerHTML = '<div class="card" style="color:var(--sub);font-size:13px;">Loading…</div>';
  fetch("/queries/run", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({kind, name, time, from_date, to_date})
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) { area.innerHTML = errorCard(d.error); return; }
    const data = d.data;
    if (!data) { area.innerHTML = errorCard("No data"); return; }
    if (data.kind === "records") {
      renderRecords(data);
    } else {
      area.innerHTML = renderResult(data);
    }
  })
  .catch(e => { area.innerHTML = errorCard(String(e)); });
}

function clearOut() {
  _qKind = null;
  _qName = null;
  document.getElementById("q-time-select").value = "";
  if (tp) tp.reset();
  document.getElementById("result-area").innerHTML = "";
  _renderAllChips();
}

function errorCard(msg) {
  return `<div class="card"><div class="msg msg-error">${msg}</div></div>`;
}

function renderResult(d) {
  if (!d) return errorCard("No data");
  switch(d.kind) {
    case "dashboard": return renderDashboard(d);
    case "metric":    return renderMetric(d);
    case "group":     return renderGroup(d);
    case "pivot":     return renderPivot(d);
    case "trend":     return renderTrend(d);
    case "records":   return renderRecords(d);
    default:          return errorCard("Unknown result type");
  }
}

function exprBadge(d) {
  if (!d.where_expr && !d.query_name) return "";
  const name = d.query_name ? `<strong>${d.query_name}</strong>` : "";
  const expr = d.where_expr
    ? `<code style="font-size:11px;background:var(--bg);padding:2px 8px;
         border-radius:4px;color:var(--sub);word-break:break-all;">${d.where_expr}</code>`
    : "";

  // Build extras
  const parts = [];
  if (d.query_group) parts.push(`<span style="color:var(--accent);">⬇ ${Array.isArray(d.query_group) ? d.query_group.join(", ") : d.query_group}</span>`);
  if (d.query_sort) parts.push(`<span style="color:var(--warn);">⬆ ${d.query_sort}</span>`);
  if (d.query_sum) parts.push(`<span>∑</span>`);
  if (d.query_search) parts.push(`<span>🔍 "${d.query_search}"</span>`);
  if (d.query_pivot) parts.push(`<span>⊞</span>`);
  if (d.query_trend) parts.push(`<span>↗ ${d.query_trend}</span>`);

  return `<div style="font-size:13px;color:var(--sub);margin-bottom:10px;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${name}${expr}
    </div>
    ${parts.length ? `<div style="margin-top:6px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;">${parts.join("")}</div>` : ""}
  </div>`;
}

function renderDashboard(d) {
  const items = (d.items||[]).map(i =>
    `<div class="stat-card">
      <div class="stat-label">${i.name.replace(/_/g," ")}</div>
      <div class="stat-value" style="font-size:20px;">${i.value}</div>
      <div class="stat-sub">${d.time_label||""}</div>
    </div>`).join("");
  return `<div class="card"><div class="card-title">Dashboard · ${d.name}</div>
    ${exprBadge(d)}
    <div class="stat-grid">${items}</div></div>`;
}

function renderMetric(d) {
  return `<div class="card">
    <div class="card-title">Metric</div>
    ${exprBadge(d)}
    <div style="font-size:28px;font-weight:800;color:var(--accent);">${d.value}</div>
    <div style="font-size:13px;color:var(--sub);margin-top:4px;">${d.name.replace(/_/g," ")}</div>
  </div>`;
}

function renderGroup(d) {
  const hasTot = d.has_amount;
  const heads  = hasTot
    ? `<th>Group</th><th class="numeric">Count</th><th class="numeric">Total</th>`
    : `<th>Group</th><th class="numeric">Count</th>`;
  const rows = (d.rows||[]).map(r => hasTot
    ? `<tr><td>${r.key}</td><td class="numeric">${r.count}</td><td class="numeric">${r.total_fmt}</td></tr>`
    : `<tr><td>${r.key}</td><td class="numeric">${r.count}</td></tr>`).join("");
  const foot = hasTot
    ? `<tr class="total-row"><td>Total</td><td class="numeric">${d.grand_count}</td><td class="numeric">${d.grand_total_fmt}</td></tr>`
    : `<tr class="total-row"><td>Total</td><td class="numeric">${d.grand_count}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Grouped by ${(d.fields||[]).join(", ")} · ${d.time_label}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
    ${summaryBar(d)}
  </div>`;
}

function renderPivot(d) {
  const cols  = d.cols || [];
  const heads = `<th>${d.row_field}</th>${cols.map(c=>`<th class="numeric">${c}</th>`).join("")}<th class="numeric">Total</th>`;
  const rows  = (d.rows||[]).map(r => {
    const cells = cols.map(c=>`<td class="numeric">${r[c]||0}</td>`).join("");
    return `<tr><td>${r.label}</td>${cells}<td class="numeric" style="font-weight:700">${r.total}</td></tr>`;
  }).join("");
  const totCells = cols.map(c=>`<td class="numeric" style="font-weight:700">${(d.col_totals||{})[c]||0}</td>`).join("");
  const foot = `<tr class="total-row"><td>Total</td>${totCells}<td class="numeric">${d.grand}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Pivot · ${d.row_field} × ${d.col_field} · ${d.time_label}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
  </div>`;
}

function renderTrend(d) {
  const has  = d.has_amount;
  const head = has
    ? `<th>Period</th><th class="numeric">Count</th><th class="numeric">Total</th><th class="numeric">Avg</th>`
    : `<th>Period</th><th class="numeric">Count</th>`;
  const rows = (d.periods||[]).map(p => has
    ? `<tr><td>${p.label}</td><td class="numeric">${p.count}</td><td class="numeric">${p.total_fmt}</td><td class="numeric">${p.avg_fmt}</td></tr>`
    : `<tr><td>${p.label}</td><td class="numeric">${p.count}</td></tr>`).join("");
  return `<div class="card">
    <div class="card-title">Trend · ${d.filter_str}</div>
    ${exprBadge(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function renderThresholdResult(thresholds) {
  if (!thresholds || !thresholds.length) return '<div class="card" style="color:var(--sub);">No thresholds configured.</div>';
  var statusLabel = function(t) {
    if (t.direction === "max") {
      return t.status === "over" ? "OVER" : t.status === "warning" ? "WARN" : "OK";
    } else {
      return t.status === "met" ? "MET" : t.status === "warning" ? "WARN" : "OK";
    }
  };
  var bars = thresholds.map(function(t) {
    var pct = Math.min(t.pct || 0, 100);
    return '<div class="thr-card" style="margin-bottom:8px;">' +
      '<div class="thr-row">' +
        '<span class="thr-name">' + (t.name||'').replace(/_/g,' ') + '</span>' +
        '<div class="thr-bar-wrap">' +
          '<div class="thr-bar-bg">' +
            '<div class="thr-bar-fill ' + (t.status||'') + '" style="width:' + pct + '%"></div>' +
          '</div>' +
        '</div>' +
        '<span class="thr-vals">' +
          pct.toFixed(0) + '% &nbsp; ' + (t.raw||0) + ' / ' + (t.target||0) +
          (t.unit ? ' (' + t.unit + ')' : '') +
          (t.direction === 'max' ? ' max' : ' min') +
        '</span>' +
        '<span class="thr-status ' + (t.status||'') + '">' + statusLabel(t) + '</span>' +
      '</div>' +
    '</div>';
  }).join("");
  return '<div class="card"><div class="card-title">Thresholds</div>' + bars + '</div>';
}

// ── Records: delegated to RecordTable ────────────────────────────────────────
function summaryBar(d) {
  const parts = [];
  if (d.count !== undefined) parts.push(`<span>${d.count} records</span>`);
  if (d.total_fmt) parts.push(`<span>Total: <strong>${d.total_fmt}</strong></span>`);
  if (d.avg_fmt)   parts.push(`<span>Avg: <strong>${d.avg_fmt}</strong></span>`);
  if (d.time_label) parts.push(`<span style="color:var(--sub)">${d.time_label}</span>`);
  return parts.length
    ? `<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:8px;">${parts.join("")}</div>`
    : "";
}

function renderRecords(d) {
  var area = document.getElementById("result-area");
  if (area) area.innerHTML = "";
  if (_rt) _rt.render(d);
  // inject query badge above the table (RecordTable clears innerHTML)
  var badge = exprBadge(d);
  if (badge.trim() && area && area.firstChild) {
    var wrap = document.createElement("div");
    wrap.innerHTML = badge;
    area.insertBefore(wrap, area.firstChild);
  }
  return "";
}

// ── RecordTable instance ─────────────────────────────────────────────────────
var _fieldTypes = {{ field_types | tojson }};
var _rt = new RecordTable({
  containerId: "result-area",
  enableBulk: true,
  fieldTypes: _fieldTypes,
  onRefresh: function() { runQuery(); }
});
RecordTable._sort    = function(th,col){ _rt._sort(th,col); };
RecordTable._check   = function(cb){ _rt._check(cb); };
RecordTable._selAll  = function(cb){ _rt._selAll(cb); };
RecordTable._openDel = function(r){ _rt._openDel(r); };
RecordTable._del     = function(){ _rt._del(); };
RecordTable._delClose= function(){ _rt._delClose(); };
RecordTable._bkDelOpen   =function(){ _rt._bkDelOpen(); };
RecordTable._bkDelClose  =function(){ _rt._bkDelClose(); };
RecordTable._bkDelConfirm=function(){ _rt._bkDelConfirm(); };
RecordTable._bkSetOpen   =function(){ _rt._bkSetOpen(); };
RecordTable._bkSetClose  =function(){ _rt._bkSetClose(); };
RecordTable._bkSetConfirm=function(){ _rt._bkSetConfirm(); };
RecordTable._bkPrev      =function(){ _rt._bkPrev(); };
RecordTable._bkClear     =function(){ _rt._bkClear(); };
RecordTable._bkFieldChange=function(){ _rt._bkFieldChange(); };

// ── Initial render ───────────────────────────────────────────────────────────
_renderAllChips();

// ── Auto-run from URL params (?run=name&time=code&kind=q|m|d) ────────────────
(function() {
  var params = new URLSearchParams(window.location.search);
  var run    = params.get("run");
  var kind   = params.get("kind") || "q";
  var time   = params.get("time") || "";
  if (!run) return;

  // find in the matching list
  var names;
  if (kind === "m") names = _mNames;
  else if (kind === "d") names = _dNames;
  else names = _qNames;
  if (names.indexOf(run) === -1) return;

  _qKind = kind;
  _qName = run;

  // set time override if provided
  if (time) {
    if (tp) tp.setTime(time, params.get("custom_time"));
  }

  _renderAllChips();
  runQuery();
  setTimeout(function() {
    var area = document.getElementById("result-area");
    if (area) area.scrollIntoView({behavior:"smooth", block:"start"});
  }, 600);
})();
</script>
{% endblock %}
