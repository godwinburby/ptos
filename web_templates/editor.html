{% extends "base.html" %}
{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
  <div class="page-title" style="margin:0;">Log Editor</div>
  <select id="file-select" onchange="window.location='/editor?file='+this.value"
          style="width:auto;padding:7px 10px;font-size:13px;">
    {% for f in log_files %}
    <option value="{{ f }}" {% if f==current_file %}selected{% endif %}>{{ f }}</option>
    {% endfor %}
  </select>
</div>

{% if msg %}<div class="msg msg-{{ msg_type }}">{{ msg }}</div>{% endif %}

<div class="card" style="padding:0;">
  <textarea id="log-editor" spellcheck="false"
            style="width:100%;min-height:520px;resize:vertical;
                   font-family:'Consolas',monospace;font-size:13px;
                   line-height:1.65;padding:16px;border:none;
                   border-radius:12px;background:#fff;outline:none;">{{ content }}</textarea>
</div>

<div style="display:flex;gap:10px;align-items:center;">
  <button class="btn btn-primary" onclick="saveFile()" id="save-btn">
    Save <span style="font-size:11px;opacity:.7;">Ctrl+S</span>
  </button>
  <span id="save-status" style="font-size:13px;font-weight:600;"></span>
  <span style="font-size:11px;color:var(--sub);margin-left:auto;">.bak written before each save</span>
</div>

<script>
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "s") { e.preventDefault(); saveFile(); }
});
function saveFile() {
  const file    = "{{ current_file }}";
  const content = document.getElementById("log-editor").value;
  const btn     = document.getElementById("save-btn");
  const status  = document.getElementById("save-status");
  btn.disabled  = true; btn.textContent = "Saving…";

  fetch("/editor/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({file, content})
  })
  .then(r => r.json())
  .then(d => {
    status.textContent = d.ok ? "✔ Saved" : "✖ " + d.error;
    status.style.color = d.ok ? "var(--success)" : "var(--error)";
    btn.disabled = false; btn.textContent = "Save";
    setTimeout(() => status.textContent = "", 2500);
  })
  .catch(() => {
    status.textContent = "✖ Failed";
    status.style.color = "var(--error)";
    btn.disabled = false; btn.textContent = "Save";
  });
}
</script>
{% endblock %}
