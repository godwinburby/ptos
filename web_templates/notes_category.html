{% extends "base.html" %}
{% block content %}

<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
  <a href="/notes" style="color:var(--accent);text-decoration:none;font-size:14px;">Notes</a>
  <span style="color:var(--sub);">/</span>
  <div class="page-title" style="margin:0;">{{ category }}</div>
</div>

<div class="card" style="margin-bottom:16px;">
  <div style="font-weight:700;font-size:15px;margin-bottom:10px;">New Note</div>
  <form id="create-form" style="display:flex;gap:8px;align-items:center;">
    <input type="text" id="title-input" placeholder="Note title"
           style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
                  background:var(--card);color:var(--text);font-size:14px;">
    <button type="submit" class="btn btn-primary btn-sm">Create</button>
  </form>
</div>

{% if notes %}
  {% for n in notes %}
  <a href="/notes/{{ category }}/{{ n.slug }}" class="card"
     style="display:block;margin-bottom:10px;text-decoration:none;cursor:pointer;padding:14px 16px;">
    <div style="font-weight:700;font-size:15px;color:var(--text);">{{ n.title }}</div>
    {% if n.date %}
    <div style="font-size:12px;color:var(--sub);margin-top:2px;">{{ n.date }}</div>
    {% endif %}
  </a>
  {% endfor %}
{% else %}
  <div class="card" style="text-align:center;padding:32px;color:var(--sub);">
    <div style="font-size:13px;">No notes in this category yet.</div>
  </div>
{% endif %}

<script>
document.getElementById("create-form").addEventListener("submit", function(e) {
  e.preventDefault();
  var title = document.getElementById("title-input").value.trim();
  if (!title) return;
  fetch("/notes/create", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({category: "{{ category }}", title: title})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) window.location.href = "/notes/{{ category }}/" + d.slug;
    else alert(d.error || "Failed to create note");
  });
});
</script>
{% endblock %}
