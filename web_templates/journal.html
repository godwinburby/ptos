{% extends "base.html" %}
{% block content %}

<!-- date nav -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
  <a href="/journal?date={{ prev_date }}"
     style="padding:10px 16px;border-radius:8px;border:1px solid var(--border);
            background:var(--card);color:var(--text);text-decoration:none;
            font-size:20px;line-height:1;">‹</a>

  <div style="text-align:center;">
    <div style="font-size:17px;font-weight:800;color:var(--text);">{{ date }}</div>
    {% if date == today %}
    <div style="font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px;">TODAY</div>
    {% endif %}
  </div>

  {% if date < today %}
  <a href="/journal?date={{ next_date }}"
     style="padding:10px 16px;border-radius:8px;border:1px solid var(--border);
            background:var(--card);color:var(--text);text-decoration:none;
            font-size:20px;line-height:1;">›</a>
  {% else %}
  <span style="padding:10px 16px;color:var(--border);font-size:20px;line-height:1;">›</span>
  {% endif %}
</div>

{% if msg %}
<div class="msg msg-{{ 'success' if msg == 'saved' else 'error' }}">
  {{ '✔ Saved' if msg == 'saved' else msg }}
</div>
{% endif %}

{% include "_markdown_editor.html" with context %}

<div style="margin-top:10px;display:flex;gap:8px;">
  <button onclick="window._mdEditorTriggerSave(false)" class="btn btn-success" style="flex:1;" id="save-btn-2">
    Save Journal
  </button>
  <button onclick="deleteJournal()" class="btn btn-ghost" style="color:var(--danger,#e55);border:1px solid var(--danger,#e55);">
    Delete
  </button>
</div>

<script>
window._mdSaveFn = function(silent) {
  var content = document.getElementById("journal-editor").value;
  if (silent && !content.trim()) return;
  var btn = document.getElementById("save-btn-2");
  if (!silent && btn) { btn.disabled=true; btn.textContent="Saving…"; }
  fetch("/journal/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({date:"{{ date }}", content:content})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!silent && btn) {
      btn.disabled = false;
      btn.textContent = d.ok ? "✔ Saved" : "Error — retry";
      setTimeout(function(){ btn.textContent = "Save Journal"; }, d.ok ? 2000 : 3000);
    }
  })
  .catch(function(){
    if (!silent && btn) { btn.disabled=false; btn.textContent="Save Journal"; }
  });
};
function deleteJournal() {
  if (!confirm("Delete this journal entry?")) return;
  fetch("/journal/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({date:"{{ date }}"})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.ok) window.location.href = "/journal?date={{ today }}";
    else alert(d.error || "Delete failed");
  })
  .catch(function(){ alert("Delete failed"); });
}
</script>
{% endblock %}
