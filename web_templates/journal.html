{% extends "base.html" %}
{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
  <div class="page-title" style="margin:0;">Journal</div>
  <div style="display:flex;gap:6px;align-items:center;">
    <a href="/journal?date={{ prev_date }}" class="btn btn-ghost btn-sm">◀</a>
    <input type="date" id="date-jump" value="{{ date }}" max="{{ today }}"
           onchange="if(this.value) window.location='/journal?date='+this.value"
           style="width:auto;padding:7px 10px;font-size:13px;">
    {% if next_date <= today %}
    <a href="/journal?date={{ next_date }}" class="btn btn-ghost btn-sm">▶</a>
    {% endif %}
    <a href="/journal" class="btn btn-ghost btn-sm">Today</a>
  </div>
</div>

{% if msg %}
<div class="msg msg-{{ msg_type }}">{{ msg }}</div>
{% endif %}

<div class="card" style="padding:0;">
  <textarea id="journal-editor" name="content"
            style="width:100%;min-height:520px;resize:vertical;
                   font-family:'Consolas',monospace;font-size:14px;
                   line-height:1.7;padding:18px;border:none;
                   border-radius:12px;background:#fff;outline:none;"
            spellcheck="false">{{ content }}</textarea>
</div>

<div style="display:flex;gap:10px;align-items:center;">
  <button class="btn btn-primary" onclick="saveJournal()" id="save-btn">
    Save <span style="font-size:11px;opacity:.7;">Ctrl+S</span>
  </button>
  <span id="save-status" style="font-size:13px;font-weight:600;"></span>
</div>

<script>
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "s") { e.preventDefault(); saveJournal(); }
});

function saveJournal() {
  const content = document.getElementById("journal-editor").value;
  const btn     = document.getElementById("save-btn");
  const status  = document.getElementById("save-status");
  btn.disabled  = true; btn.textContent = "Saving…";

  fetch("/journal/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({date: "{{ date }}", content})
  })
  .then(r => r.json())
  .then(d => {
    status.textContent = d.ok ? "✔ Saved" : "✖ " + d.error;
    status.style.color = d.ok ? "var(--success)" : "var(--error)";
    btn.disabled = false; btn.textContent = "Save";
    setTimeout(() => status.textContent = "", 2500);
  })
  .catch(() => {
    status.textContent = "✖ Failed";
    status.style.color = "var(--error)";
    btn.disabled = false; btn.textContent = "Save";
  });
}
</script>
{% endblock %}
