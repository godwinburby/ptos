{% extends "base.html" %}
{% block content %}

<!-- date nav -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
  <a href="/journal?date={{ prev_date }}"
     style="padding:10px 16px;border-radius:8px;border:1px solid var(--border);
            background:var(--card);color:var(--text);text-decoration:none;
            font-size:20px;line-height:1;">‹</a>

  <div style="text-align:center;">
    <div style="font-size:17px;font-weight:800;color:var(--text);">{{ date }}</div>
    {% if date == today %}
    <div style="font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px;">TODAY</div>
    {% endif %}
  </div>

  {% if date < today %}
  <a href="/journal?date={{ next_date }}"
     style="padding:10px 16px;border-radius:8px;border:1px solid var(--border);
            background:var(--card);color:var(--text);text-decoration:none;
            font-size:20px;line-height:1;">›</a>
  {% else %}
  <span style="padding:10px 16px;color:var(--border);font-size:20px;line-height:1;">›</span>
  {% endif %}
</div>

{% if msg %}
<div class="msg msg-{{ 'success' if msg == 'saved' else 'error' }}">
  {{ '✔ Saved' if msg == 'saved' else msg }}
</div>
{% endif %}

<!-- mode toggle + save -->
<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
  <button id="btn-edit"    onclick="setMode('edit')"    class="btn btn-sm btn-primary">✎ Edit</button>
  <button id="btn-preview" onclick="setMode('preview')" class="btn btn-sm btn-ghost">👁 Preview</button>
  <button id="btn-split"   onclick="setMode('split')"   class="btn btn-sm btn-ghost"
          style="display:none;">⬛ Split</button>
  <button id="save-btn"    onclick="saveJournal(false)" class="btn btn-sm btn-success"
          style="margin-left:auto;">Save</button>
</div>

<div id="journal-wrap" style="display:flex;gap:12px;">
  <div id="editor-pane" style="flex:1;min-width:0;">
    <textarea id="journal-editor"
      style="width:100%;min-height:65vh;padding:16px;
             font-family:'Consolas','Courier New',monospace;
             font-size:16px;line-height:1.85;
             background:var(--card);color:var(--text);
             border:1.5px solid var(--border);border-radius:10px;
             resize:vertical;outline:none;"
      placeholder="Start writing…"
      oninput="onEditorInput()">{{ content }}</textarea>
  </div>
  <div id="preview-pane"
       style="display:none;flex:1;min-width:0;padding:18px;
              background:var(--card);border:1px solid var(--border);
              border-radius:10px;min-height:65vh;overflow-y:auto;
              font-size:16px;line-height:1.85;">
  </div>
</div>

<div style="margin-top:10px;">
  <button onclick="saveJournal(false)" class="btn btn-success btn-full" id="save-btn-2">
    Save Journal
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<style>
  #preview-pane h1,#preview-pane h2,#preview-pane h3,#preview-pane h4 {
    font-weight:800;margin:18px 0 8px;color:var(--text);line-height:1.3;
  }
  #preview-pane h1 { font-size:22px;border-bottom:2px solid var(--border);padding-bottom:6px; }
  #preview-pane h2 { font-size:18px;color:var(--accent); }
  #preview-pane h3 { font-size:16px; }
  #preview-pane h4 { font-size:15px;color:var(--sub); }
  #preview-pane p  { margin:8px 0; }
  #preview-pane ul,#preview-pane ol { margin:8px 0 8px 22px; }
  #preview-pane li { margin:4px 0; }
  #preview-pane li input[type=checkbox] {
    margin-right:7px;accent-color:var(--accent);
    width:16px;height:16px;vertical-align:middle;
  }
  #preview-pane code {
    font-family:'Consolas','Courier New',monospace;font-size:14px;
    background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--accent);
  }
  #preview-pane pre {
    background:var(--bg);padding:14px;border-radius:8px;overflow-x:auto;margin:12px 0;
  }
  #preview-pane pre code { background:none;padding:0;color:var(--text);font-size:14px; }
  #preview-pane blockquote {
    border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;
    color:var(--sub);font-style:italic;background:var(--accent-lt);
    border-radius:0 8px 8px 0;
  }
  #preview-pane hr  { border:none;border-top:2px solid var(--border);margin:18px 0; }
  #preview-pane strong { font-weight:700; }
  #preview-pane em     { font-style:italic;color:var(--sub); }
  #preview-pane a      { color:var(--accent);text-decoration:none; }
  #preview-pane table  { width:100%;border-collapse:collapse;font-size:14px;margin:12px 0; }
  #preview-pane th,#preview-pane td {
    padding:8px 10px;border:1px solid var(--border);text-align:left;
  }
  #preview-pane th { background:var(--bg);font-weight:700; }
  @media (min-width:768px) { #btn-split { display:inline-flex !important; } }
</style>

<script>
if (typeof marked !== "undefined") {
  marked.setOptions({ gfm:true, breaks:true });
  var _r = new marked.Renderer();
  var _origLI = _r.listitem.bind(_r);
  _r.listitem = function(text, task, checked) {
    if (task)
      return '<li style="list-style:none;margin-left:-22px;"><input type="checkbox" ' +
             (checked?"checked":"") + ' disabled> ' + text + '</li>';
    return _origLI(text, task, checked);
  };
  marked.use({ renderer: _r });
}

var _mode = "edit", _saveTimer = null, _dirty = false;

function renderPreview() {
  var src = document.getElementById("journal-editor").value;
  var pane = document.getElementById("preview-pane");
  pane.innerHTML = typeof marked !== "undefined"
    ? marked.parse(src)
    : "<pre style='white-space:pre-wrap'>" +
        src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + "</pre>";
}

function setMode(m) {
  _mode = m;
  ["edit","preview","split"].forEach(function(id) {
    document.getElementById("btn-"+id).className =
      "btn btn-sm " + (m===id ? "btn-primary" : "btn-ghost");
  });
  var ep = document.getElementById("editor-pane");
  var pp = document.getElementById("preview-pane");
  if (m === "edit")    { ep.style.display="block"; pp.style.display="none"; }
  else if (m === "preview") { renderPreview(); ep.style.display="none"; pp.style.display="block"; }
  else { renderPreview(); ep.style.display="block"; pp.style.display="block"; }
}

function onEditorInput() {
  _dirty = true;
  if (_mode !== "edit") renderPreview();
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() { saveJournal(true); }, 2500);
}

function saveJournal(silent) {
  clearTimeout(_saveTimer); _dirty = false;
  var content = document.getElementById("journal-editor").value;
  // Don't silently overwrite with empty — require explicit save for blank content
  if (silent && !content.trim()) return;
  var btns = ["save-btn","save-btn-2"].map(function(id){ return document.getElementById(id); });
  if (!silent) btns.forEach(function(b){ if(b){ b.disabled=true; b.textContent="Saving…"; } });
  fetch("/journal/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({date:"{{ date }}", content:content})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!silent) btns.forEach(function(b){
      if (!b) return;
      b.disabled = false;
      b.textContent = d.ok
        ? (b.id==="save-btn" ? "✔ Saved" : "✔ Saved")
        : "Error — retry";
      setTimeout(function(){
        b.textContent = b.id==="save-btn" ? "Save" : "Save Journal";
      }, d.ok ? 2000 : 3000);
    });
  })
  .catch(function(){
    if (!silent) btns.forEach(function(b){
      if(b){ b.disabled=false; b.textContent="Save Journal"; }
    });
  });
}

document.addEventListener("keydown", function(e) {
  if ((e.ctrlKey||e.metaKey) && e.key==="s") { e.preventDefault(); saveJournal(false); }
});
window.addEventListener("beforeunload", function(e) {
  if (_dirty) { e.preventDefault(); e.returnValue=""; }
});
</script>
{% endblock %}
