{% extends "base.html" %}
{% block content %}

<div class="page-title">Browse</div>

<div class="card">
  <div class="field-group">
    <label>Type</label>
    <select id="b-type" onchange="onTypeChange()">
      <option value="">All types</option>
      {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
  </div>
  <div class="field-row-2">
    <div class="field-group">
      <label>Time</label>
      <select id="b-time">
        {% for label, code in time_options %}
        <option value="{{ code }}" {% if code=='tm' %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field-group">
      <label>Group by</label>
      <select id="b-group"><option value="">(none)</option></select>
    </div>
  </div>
  <div class="field-group">
    <label>Search</label>
    <input type="text" id="b-search" placeholder="full-text search…"
           oninput="debouncedBrowse()">
  </div>
  <div class="field-group">
    <label>Expression filter</label>
    <input type="text" id="b-expr"
           placeholder='e.g. type=expense AND (domain=self OR domain=home)'
           oninput="debouncedBrowse()" style="font-family:monospace;font-size:13px;">
    <div class="hint">Operators: = != &gt; &lt; &gt;= &lt;= ~(contains) !~(not contains) · AND OR NOT ( )</div>
  </div>
  <div id="field-filters" style="display:none;"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-success btn-sm" onclick="exportCSV()">↓ CSV</button>
    <button class="btn btn-primary btn-sm" onclick="showSaveQuery()">💾 Save as Query</button>
    <button class="btn btn-ghost btn-sm"   onclick="clearBrowse()">✕ Clear</button>
  </div>
</div>

<!-- Save as Query dialog -->
<div id="query-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:320px;
              box-shadow:0 8px 32px rgba(0,0,0,.18);">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px;">Save as Query</div>
    <div class="field-group">
      <label>Query name</label>
      <input type="text" id="query-name-input" placeholder="e.g. my_expenses"
             style="text-transform:lowercase;"
             oninput="this.value=this.value.replace(/[^a-z0-9_]/g,'')">
      <div class="hint">lowercase letters, numbers, underscores</div>
    </div>
    <div id="query-preview" style="font-size:12px;color:var(--sub);
         background:var(--bg);padding:8px;border-radius:6px;
         margin-bottom:10px;font-family:monospace;word-break:break-all;"></div>
    <div id="query-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1" onclick="doSaveQuery()">Save</button>
      <button class="btn btn-ghost"   style="flex:1" onclick="hideQueryDialog()">Cancel</button>
    </div>
  </div>
</div>

<div id="result-area"></div>

<!-- Delete modal -->
<div id="del-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:340px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--error);">Delete Record</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:8px;">This cannot be undone (backup is kept).</div>
    <div id="del-line" style="font-family:monospace;font-size:12px;background:var(--bg);
         padding:8px;border-radius:6px;word-break:break-all;margin-bottom:14px;"></div>
    <div id="del-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;background:var(--error);" onclick="doDelete()">Delete</button>
      <button class="btn btn-ghost"   style="flex:1;" onclick="closeDelete()">Cancel</button>
    </div>
  </div>
</div>

<script>
function onTypeChange() {
  const type = document.getElementById("b-type").value;
  const ff   = document.getElementById("field-filters");
  const grp  = document.getElementById("b-group");
  grp.innerHTML = '<option value="">(none)</option>';
  ff.innerHTML  = ""; ff.style.display = "none";
  if (!type) { runBrowse(); return; }
  fetch("/api/type_fields/" + encodeURIComponent(type))
  .then(r => r.json())
  .then(data => {
    (data.dimensions||[]).forEach(f => {
      const o = document.createElement("option");
      o.value = f; o.textContent = f; grp.appendChild(o);
    });
    (data.fields||[]).forEach(f => {
      if (!f.options||!f.options.length) return;
      const wrap = document.createElement("div");
      wrap.className = "field-group";
      wrap.innerHTML = `<label>${f.name}</label>
        <select id="ff-${f.name}" onchange="runBrowse()">
          <option value="">(any)</option>
          ${f.options.map(o=>`<option value="${o}">${o}</option>`).join("")}
        </select>`;
      ff.appendChild(wrap);
    });
    ff.style.display = ff.children.length ? "block" : "none";
    runBrowse();
  });
}

// wire time and group selects
document.getElementById("b-time").addEventListener("change", runBrowse);
document.getElementById("b-group").addEventListener("change", runBrowse);

// debounce for search input — wait 500ms after user stops typing
let _searchTimer = null;
function debouncedBrowse() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(runBrowse, 500);
}

function _params() {
  const type  = document.getElementById("b-type").value;
  const time  = document.getElementById("b-time").value;
  const search= document.getElementById("b-search").value.trim();
  const group = document.getElementById("b-group").value;
  const expr  = document.getElementById("b-expr").value.trim();
  const where = [];
  if (type) where.push("type=" + type);
  document.querySelectorAll("[id^='ff-']").forEach(sel => {
    if (sel.value) where.push(sel.id.replace("ff-","") + "=" + sel.value);
  });
  return {where, expr, time, search, group};
}

function runBrowse() {
  const area = document.getElementById("result-area");
  area.innerHTML = '<div class="card" style="color:var(--sub);font-size:13px;">Loading…</div>';
  fetch("/browse/run", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(_params())
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) { area.innerHTML = errorCard(d.error); return; }
    area.innerHTML = renderResult(d.data);
  })
  .catch(e => {
    area.innerHTML = errorCard(String(e));
  });
}

function exportCSV() {
  const form  = document.createElement("form");
  form.method = "POST"; form.action = "/browse/export";
  const inp   = document.createElement("input");
  inp.type = "hidden"; inp.name = "params";
  inp.value = JSON.stringify(_params());
  form.appendChild(inp);
  document.body.appendChild(form); form.submit(); document.body.removeChild(form);
}

function clearBrowse() {
  ["b-type","b-search","b-group","b-expr"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("b-time").value = "tm";
  document.getElementById("field-filters").innerHTML = "";
  document.getElementById("field-filters").style.display = "none";
  document.getElementById("result-area").innerHTML = "";
}

function errorCard(msg) {
  return `<div class="card"><div class="msg msg-error">${msg}</div></div>`;
}

function summaryBar(d) {
  const parts = [];
  if (d.count !== undefined) parts.push(`<span>${d.count} records</span>`);
  if (d.total_fmt) parts.push(`<span>Total: <strong>${d.total_fmt}</strong></span>`);
  if (d.avg_fmt)   parts.push(`<span>Avg: <strong>${d.avg_fmt}</strong></span>`);
  if (d.time_label) parts.push(`<span style="color:var(--sub)">${d.time_label}</span>`);
  return parts.length
    ? `<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:10px;">${parts.join("")}</div>`
    : "";
}

function renderResult(d) {
  if (!d) return errorCard("No data");
  if (d.kind === "group") return renderGroup(d);
  return renderRecords(d);
}

function renderGroup(d) {
  const hasTot = d.has_amount;
  const heads  = hasTot
    ? `<th>Group</th><th style="text-align:right">Count</th><th style="text-align:right">Total</th>`
    : `<th>Group</th><th style="text-align:right">Count</th>`;
  const rows = (d.rows||[]).map(r => hasTot
    ? `<tr><td>${r.key}</td><td style="text-align:right">${r.count}</td><td style="text-align:right">${r.total_fmt}</td></tr>`
    : `<tr><td>${r.key}</td><td style="text-align:right">${r.count}</td></tr>`).join("");
  const foot = hasTot
    ? `<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">${d.grand_count}</td><td style="text-align:right">${d.grand_total_fmt}</td></tr>`
    : `<tr style="font-weight:700;border-top:2px solid var(--border)"><td>Total</td><td style="text-align:right">${d.grand_count}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Grouped by ${(d.fields||[]).join(", ")} · ${d.time_label}</div>
    ${summaryBar(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
  </div>`;
}

function renderRecords(d) {
  if (!d.records||!d.records.length)
    return `<div class="card" style="color:var(--sub);text-align:center;padding:32px;">No records found.</div>`;
  const cols  = d.columns||[];
  const heads = cols.map(c=>`<th>${c}</th>`).join("") + `<th style="width:80px"></th>`;
  const rows  = d.records.map((r,i) => {
    const cells = cols.map(c=>`<td>${r[c]||""}</td>`).join("");
    const acts  = r._line
      ? `<td style="white-space:nowrap;">
           <a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;"
             href="/edit?filepath=${encodeURIComponent(r._filepath)}&lineno=${r._lineno}&line=${encodeURIComponent(r._line)}&return_to=${encodeURIComponent(window.location.pathname)}">✎</a>
           <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);"
             onclick='openDelete(${i})'>✕</button>
         </td>`
      : `<td></td>`;
    return `<tr>${cells}${acts}</tr>`;
  }).join("");
  // store records for modal access
  window._browseRecords = d.records;
  return `<div class="card">
    ${summaryBar(d)}
    <div style="overflow-x:auto;"><table class="data-table">
      <thead><tr>${heads}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

// ── Delete modal ──────────────────────────────────────────────────────────────
let _editRecord = null;

function openDelete(idx) {
  const r = (window._browseRecords || [])[idx];
  if (!r || !r._line) return;
  _editRecord = r;
  document.getElementById("del-line").textContent   = r._line;
  document.getElementById("del-msg").style.display  = "none";
  document.getElementById("del-dialog").style.display = "flex";
}

function closeDelete() { document.getElementById("del-dialog").style.display = "none"; }

function doDelete() {
  if (!_editRecord) return;
  const msg = document.getElementById("del-msg");
  fetch("/api/records/delete", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      filepath: _editRecord._filepath,
      old_line: _editRecord._line,
      lineno:   _editRecord._lineno
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) { closeDelete(); runBrowse(); }
    else { msg.textContent = d.error; msg.style.display = "block"; }
  })
  .catch(e => { msg.textContent = String(e); msg.style.display = "block"; });
}


// ── Save as Query ─────────────────────────────────────────────────────────────
function showSaveQuery() {
  const p = _params();
  const msg = document.getElementById("query-msg");
  msg.style.display = "none";
  document.getElementById("query-name-input").value = "";

  // build unified expression preview (mirrors server-side _filters_to_expr)
  const parts = [];
  if (p.where.length) parts.push(...p.where);
  let exprPreview = "";
  if (p.expr && parts.length) {
    const combined = parts.join(" AND ");
    exprPreview = `(${combined}) AND (${p.expr})`;
  } else if (p.expr) {
    exprPreview = p.expr;
  } else if (parts.length) {
    exprPreview = parts.join(" AND ");
  }

  const previewLines = [];
  if (exprPreview) previewLines.push(`where = "${exprPreview}"`);
  previewLines.push(`time  = "${p.time}"`);
  if (p.group)  previewLines.push(`group = ["${p.group}"]`);
  if (p.search) previewLines.push(`search = "${p.search}"`);
  document.getElementById("query-preview").textContent = previewLines.join("\n");

  const dlg = document.getElementById("query-dialog");
  dlg.style.display = "flex";
  document.getElementById("query-name-input").focus();
}

function hideQueryDialog() {
  document.getElementById("query-dialog").style.display = "none";
}

function doSaveQuery() {
  const name = document.getElementById("query-name-input").value.trim();
  const msg  = document.getElementById("query-msg");
  if (!name) { msg.textContent = "Enter a name."; msg.style.display="block"; return; }
  const p = _params();
  fetch("/api/save_query", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, where: p.where, expr: p.expr, time: p.time,
                          group: p.group, search: p.search})
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      hideQueryDialog();
      const btn = document.querySelector('[onclick="showSaveQuery()"]');
      btn.textContent = `✔ Saved as '${d.name}'`;
      btn.style.background = "var(--success)";
      setTimeout(() => { btn.textContent = "💾 Save as Query"; btn.style.background = ""; }, 3000);
    } else {
      msg.textContent = d.error;
      msg.style.display = "block";
    }
  })
  .catch(e => { msg.textContent = String(e); msg.style.display="block"; });
}

document.getElementById("query-dialog").addEventListener("click", function(e) {
  if (e.target === this) hideQueryDialog();
});
document.getElementById("query-name-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSaveQuery();
  if (e.key === "Escape") hideQueryDialog();
});
document.getElementById("del-dialog").addEventListener("click", function(e) {
  if (e.target === this) closeDelete();
});
</script>
{% endblock %}
