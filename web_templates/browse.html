{% extends "base.html" %}
{% block content %}

<style>
  .qb-chip {
    display:inline-flex;align-items:center;gap:4px;padding:6px 12px;
    border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    transition:all .15s;margin:3px;
  }
  .qb-chip:hover    { border-color:var(--accent);color:var(--accent); }
  .qb-chip.active   { background:var(--accent);border-color:var(--accent);color:#fff; }
  .qb-chip.selected { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .qb-active-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
    border-radius:20px;font-size:13px;font-weight:600;margin:3px;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);
  }
  .qb-active-chip button { background:none;border:none;color:var(--accent);
    cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700; }
</style>

<div class="page-title">Browse</div>

<div class="card">
  <!-- ── FilterBuilder ── -->
  <div id="browse-filter" style="margin-bottom:12px;"></div>

  <!-- ── Time and Group ── -->
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Time</label>
      <select id="b-time" onchange="onBTimeChange(this.value)">
        {% for label, code in time_options %}
        <option value="{{ code }}" {% if code == current_time %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="b-custom-time" class="field-group" style="display:none;flex:1;min-width:140px;">
      <label>Custom Month</label>
      <button id="b-month-picker-btn" onclick="bTogglePicker(event)"
              style="display:flex;align-items:center;justify-content:space-between;
                     padding:9px 12px;border-radius:6px;border:1px solid var(--border);
                     background:var(--bg);color:var(--text);font-size:14px;font-weight:500;
                     cursor:pointer;min-width:140px;">
        <span id="b-month-text">{% if custom_time and custom_time|length >= 7 %}{{ custom_time[:7] }}{% else %}Pick a month{% endif %}</span>
        <span style="font-size:10px;color:var(--sub);">▼</span>
      </button>
    </div>
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Group by</label>
      <select id="b-group" onchange="runBrowse()"><option value="">— select —</option></select>
    </div>
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Sort by</label>
      <select id="b-sort" onchange="runBrowse()">
        <option value="">— select —</option>
      </select>
    </div>
  </div>

  <!-- ── Search ── -->
  <div class="field-group" style="margin-bottom:12px;">
    <label>Search</label>
    <input type="text" id="b-search" placeholder="full-text search…"
           oninput="debouncedBrowse()">
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-success btn-sm" onclick="exportCSV()">↓ CSV</button>
    <button class="btn btn-primary btn-sm" onclick="showSaveQuery()">💾 Save as Query</button>
    <button class="btn btn-ghost btn-sm" onclick="clearBrowse()">✕ Clear</button>
  </div>
</div>

<!-- Save as Query dialog -->
<div id="query-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:320px;
              box-shadow:0 8px 32px rgba(0,0,0,.18);">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px;">Save as Query</div>
    <div class="field-group">
      <label>Query name</label>
      <input type="text" id="query-name-input" placeholder="e.g. my_expenses"
             style="text-transform:lowercase;"
             oninput="this.value=this.value.replace(/[^a-z0-9_]/g,'')">
      <div class="hint">lowercase letters, numbers, underscores</div>
    </div>
    <div id="query-preview" style="font-size:12px;color:var(--sub);
         background:var(--bg);padding:8px;border-radius:6px;
         margin-bottom:10px;font-family:monospace;word-break:break-all;"></div>
    <div id="query-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1" onclick="doSaveQuery()">Save</button>
      <button class="btn btn-ghost"   style="flex:1" onclick="hideQueryDialog()">Cancel</button>
    </div>
  </div>
</div>

<!-- browse month picker popup -->
<div id="b-month-picker-popup"
     style="display:none;position:fixed;z-index:600;
            background:var(--card);border:1px solid var(--border);
            border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.22);
            padding:16px;width:252px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <button onclick="bShiftYear(-1)"
            style="background:none;border:none;font-size:20px;color:var(--text);
                   cursor:pointer;padding:2px 10px;border-radius:6px;line-height:1;">&lt;</button>
    <span id="b-picker-year" style="font-weight:700;font-size:15px;color:var(--text);"></span>
    <button onclick="bShiftYear(1)"
            style="background:none;border:none;font-size:20px;color:var(--text);
                   cursor:pointer;padding:2px 10px;border-radius:6px;line-height:1;">&gt;</button>
  </div>
  <div id="b-picker-grid"
       style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;"></div>
</div>

<div id="result-area"></div>

<!-- Delete modal -->
<div id="del-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:340px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--error);">Delete Record</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:8px;">This cannot be undone (backup is kept).</div>
    <div id="del-line" style="font-family:monospace;font-size:12px;background:var(--bg);
         padding:8px;border-radius:6px;word-break:break-all;margin-bottom:14px;"></div>
    <div id="del-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;background:var(--error);" onclick="doDelete()">Delete</button>
      <button class="btn btn-ghost"   style="flex:1;" onclick="closeDelete()">Cancel</button>
    </div>
  </div>
</div>


<!-- Bulk action bar (appears when rows selected) -->
<div id="bulk-bar"
     style="display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
            background:var(--card);border:1.5px solid var(--accent);border-radius:12px;
            padding:10px 16px;box-shadow:0 4px 24px rgba(0,0,0,.18);
            display:none;align-items:center;gap:10px;z-index:400;white-space:nowrap;">
  <span id="bulk-count" style="font-size:13px;font-weight:700;color:var(--accent);min-width:80px;"></span>
  <button class="btn btn-ghost btn-sm" onclick="bulkSetOpen()" style="font-size:12px;">✎ Set Field</button>
  <button class="btn btn-ghost btn-sm" onclick="bulkDeleteOpen()"
          style="font-size:12px;color:var(--error);">✕ Delete</button>
  <button class="btn btn-ghost btn-sm" onclick="clearSelection()" style="font-size:12px;">✕ Deselect</button>
</div>

<!-- Bulk delete confirm dialog -->
<div id="bulk-del-dialog"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
            z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:340px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:var(--error);">Bulk Delete</div>
    <div id="bulk-del-msg-top" style="font-size:13px;color:var(--sub);margin-bottom:14px;"></div>
    <div id="bulk-del-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;background:var(--error);"
              onclick="bulkDeleteConfirm()">Delete All</button>
      <button class="btn btn-ghost" style="flex:1;"
              onclick="document.getElementById('bulk-del-dialog').style.display='none'">Cancel</button>
    </div>
  </div>
</div>

<!-- Bulk set dialog -->
<div id="bulk-set-dialog"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
            z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:360px;
              box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px;">Set Field on Selected</div>
    <div class="field-group" style="margin-bottom:10px;">
      <label style="font-size:12px;">Field name</label>
      <input type="text" id="bulk-set-field" placeholder="e.g. status, category"
             style="font-size:14px;">
    </div>
    <div class="field-group" style="margin-bottom:14px;">
      <label style="font-size:12px;">New value</label>
      <input type="text" id="bulk-set-value" placeholder="new value"
             style="font-size:14px;">
    </div>
    <div id="bulk-set-preview"
         style="font-size:12px;color:var(--sub);font-family:monospace;
                background:var(--bg);padding:8px;border-radius:6px;
                margin-bottom:12px;display:none;"></div>
    <div id="bulk-set-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="bulkSetConfirm()">Apply</button>
      <button class="btn btn-ghost"   style="flex:1;"
              onclick="document.getElementById('bulk-set-dialog').style.display='none'">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
var _types = {{ types | tojson }};

// ── FilterBuilder instance ───────────────────────────────────────────────────
var _fb = null;
document.addEventListener("DOMContentLoaded", function() {
  _fb = new FilterBuilder({
    containerId: "browse-filter",
    types: _types,
    onRun: function(expr) { runBrowse(); }
  });
  _fb.init();

  // Restore URL params
  var params = new URLSearchParams(window.location.search);
  var time = params.get("time");
  if (time === "custom") {
    var ct = params.get("custom_time");
    if (ct && ct.length >= 7) {
      document.getElementById("b-time").value = "custom";
      document.getElementById("b-custom-time").style.display = "block";
      document.getElementById("b-month-text").textContent = ct.substring(0, 7);
    }
  }
});

// ── Legacy stubs (called by remaining browse code) ───────────────────────────
function renderTypeChips()  {}
function renderActiveChips(){}
function renderFieldChips() {}
function renderTagsSection(){}
function fetchFields()      {}
function toggleChip(f,v)    { if (_fb) _fb._toggleChip(f,"=",v); }
function closeValueRow()    { if (_fb) _fb.closeValueRow(); }
function addTextFilter()    { if (_fb) _fb.addTextValue(); }
function syncExprFromChips(){ if (_fb) _fb._syncExprFromChips(); }
function chipsToExpr(chips) { return _fb ? _fb._chipsToExpr() : ""; }
function updateWherePreview(){ if (_fb) _fb._syncExprFromChips(); }
function parseExprToChips(e){ return _fb ? _fb._parseExpr(e) : []; }
function onExprInput()      { if (_fb) _fb._onExprInput(); }
window.toggleAdvancedMode   = function() {};
window.applyAdvancedExpr    = function() {};
window.cancelAdvancedExpr   = function() {};
window.toggleExprMode       = function() {};

// Legacy _browse shim — keeps _params() and clearBrowse() working
var _browse = {
  get type() { return _fb ? _fb._type : null; },
  get chips(){ return _fb ? _fb._chips : []; },
  exprManual: "",
  search: "",
  _activeField: null
};
var _fieldCache = {};
var _exprVisible = false;

// ── Init ────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function() {
  renderTypeChips();
  
  // Restore state from URL params
  var params = new URLSearchParams(window.location.search);
  var run = params.get("run");
  if (run && run.startsWith("q:")) {
    // Load from query - for now just show chip builder
    // This could be enhanced to load query definition
  }
  
  // Handle custom time from URL
  var time = params.get("time");
  if (time === "custom") {
    var ct = params.get("custom_time");
    if (ct && ct.length >= 7) {
      document.getElementById("b-time").value = "custom";
      document.getElementById("b-custom-time").style.display = "block";
      document.getElementById("b-month-text").textContent = ct.substring(0, 7);
    }
  }
});

// debounce for search input — wait 500ms after user stops typing
let _searchTimer = null;
function debouncedBrowse() {
  updateWherePreview();
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(runBrowse, 500);
}

// ── Browse month picker ──────────────────────────────────────────────────────
(function() {
  var MONTHS  = ["Jan","Feb","Mar","Apr","May","Jun",
                 "Jul","Aug","Sep","Oct","Nov","Dec"];
  var yearMin = {{ year_range[0] }};
  var yearMax = {{ year_range[-1] }};
  var selYear = new Date().getFullYear();
  var selMonth = null;

  function render() {
    document.getElementById("b-picker-year").textContent = selYear;
    var grid = document.getElementById("b-picker-grid");
    grid.innerHTML = "";
    MONTHS.forEach(function(name, i) {
      var mm = String(i + 1).padStart(2, "0");
      var active = (selMonth === mm);
      var btn = document.createElement("button");
      btn.textContent = name;
      btn.style.cssText =
        "padding:9px 0;border-radius:8px;cursor:pointer;font-size:13px;" +
        "border:1px solid " + (active ? "var(--accent)" : "var(--border)") + ";" +
        "background:"       + (active ? "var(--accent)" : "var(--bg)")     + ";" +
        "color:"            + (active ? "#fff"           : "var(--text)")  + ";" +
        "font-weight:"      + (active ? "700"            : "400")          + ";";
      btn.addEventListener("click", function() {
        selMonth = mm;
        bClose();
        document.getElementById("b-month-text").textContent =
          selYear + "-" + mm;
        runBrowse();
      });
      grid.appendChild(btn);
    });
  }

  window.bShiftYear = function(d) {
    var n = selYear + d;
    if (n < yearMin || n > yearMax) return;
    selYear = n; render();
  };

  window.bTogglePicker = function(e) {
    e.stopPropagation();
    var pop = document.getElementById("b-month-picker-popup");
    if (pop.style.display === "none") {
      render();
      var btn  = document.getElementById("b-month-picker-btn");
      var rect = btn.getBoundingClientRect();
      pop.style.top  = (rect.bottom + window.scrollY + 6) + "px";
      var POP_W = 260;
      pop.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - POP_W)) + "px";
      pop.style.display = "block";
    } else { bClose(); }
  };

  function bClose() {
    document.getElementById("b-month-picker-popup").style.display = "none";
  }
  window._bCloseMonthPicker = bClose;
  window._bGetCustomTime = function() {
    return selMonth ? selYear + "-" + selMonth : null;
  };

  // Restore state from URL params
  (function() {
    var params = new URLSearchParams(window.location.search);
    var time = params.get("time");
    if (time === "custom") {
      var ct = params.get("custom_time");
      if (ct && ct.length >= 7) {
        document.getElementById("b-time").value = "custom";
        document.getElementById("b-custom-time").style.display = "block";
        selYear = parseInt(ct.substring(0, 4));
        selMonth = ct.substring(5, 7);
        document.getElementById("b-month-text").textContent = ct.substring(0, 7);
      }
    }
  })();
})();

function onBTimeChange(val) {
  var div = document.getElementById("b-custom-time");
  if (val === "custom") {
    div.style.display = "block";
  } else {
    div.style.display = "none";
    window._bCloseMonthPicker();
    if (val) runBrowse();
  }
}

function _params() {
  let time = document.getElementById("b-time").value;
  if (time === "custom") {
    const ct = window._bGetCustomTime();
    time = ct || "tm";
  }
  const search = document.getElementById("b-search") ? document.getElementById("b-search").value.trim() : "";
  const group  = document.getElementById("b-group")  ? document.getElementById("b-group").value  : "";
  const sort   = document.getElementById("b-sort")   ? document.getElementById("b-sort").value   : "";
  // FilterBuilder is the single source of truth for the expression
  const expr = _fb ? _fb.getExpr() : "";
  return {where: [], expr, time, search, group, sort};
}

function runBrowse() {
  const area = document.getElementById("result-area");
  area.innerHTML = '<div class="card" style="color:var(--sub);font-size:13px;">Loading…</div>';
  fetch("/browse/run", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(_params())
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) { area.innerHTML = errorCard(d.error); return; }
    area.innerHTML = renderResult(d.data);
  })
  .catch(e => {
    area.innerHTML = errorCard(String(e));
  });
}

function exportCSV() {
  const form  = document.createElement("form");
  form.method = "POST"; form.action = "/browse/export";
  const inp   = document.createElement("input");
  inp.type = "hidden"; inp.name = "params";
  inp.value = JSON.stringify(_params());
  form.appendChild(inp);
  document.body.appendChild(form); form.submit(); document.body.removeChild(form);
}

function clearBrowse() {
  // Reset state
  _browse.type = null;
  // Clear FilterBuilder
  if (_fb) _fb.clear();
  _fieldCache = {};

  // Reset other UI
  document.getElementById("b-search").value = "";
  document.getElementById("b-time").value = "tm";
  document.getElementById("b-custom-time").style.display = "none";
  document.getElementById("b-group").value = "";
  document.getElementById("b-sort").value = "";
  window._bCloseMonthPicker();
  document.getElementById("b-month-text").textContent = "Pick a month";
  document.getElementById("result-area").innerHTML = "";
}

function errorCard(msg) {
  return `<div class="card"><div class="msg msg-error">${msg}</div></div>`;
}

function summaryBar(d) {
  const parts = [];
  if (d.count !== undefined) parts.push(`<span>${d.count} records</span>`);
  if (d.total_fmt) parts.push(`<span>Total: <strong>${d.total_fmt}</strong></span>`);
  if (d.avg_fmt)   parts.push(`<span>Avg: <strong>${d.avg_fmt}</strong></span>`);
  if (d.time_label) parts.push(`<span style="color:var(--sub)">${d.time_label}</span>`);
  return parts.length
    ? `<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:10px;">${parts.join("")}</div>`
    : "";
}

function renderResult(d) {
  if (!d) return errorCard("No data");
  if (d.kind === "group") return renderGroup(d);
  return renderRecords(d);
}

function renderGroup(d) {
  const hasTot = d.has_amount;
  const heads  = hasTot
    ? `<th>Group</th><th class="numeric">Count</th><th class="numeric">Total</th>`
    : `<th>Group</th><th class="numeric">Count</th>`;
  const rows = (d.rows||[]).map(r => hasTot
    ? `<tr><td>${r.key}</td><td class="numeric">${r.count}</td><td class="numeric">${r.total_fmt}</td></tr>`
    : `<tr><td>${r.key}</td><td class="numeric">${r.count}</td></tr>`).join("");
  const foot = hasTot
    ? `<tr class="total-row"><td>Total</td><td class="numeric">${d.grand_count}</td><td class="numeric">${d.grand_total_fmt}</td></tr>`
    : `<tr class="total-row"><td>Total</td><td class="numeric">${d.grand_count}</td></tr>`;
  return `<div class="card">
    <div class="card-title">Grouped by ${(d.fields||[]).join(", ")} · ${d.time_label}</div>
    ${summaryBar(d)}
    <div style="overflow-x:auto;"><table class="data-table"><thead><tr>${heads}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
  </div>`;
}

function renderRecords(d) {
  if (!d.records||!d.records.length)
    return `<div class="card" style="color:var(--sub);text-align:center;padding:32px;">No records found.</div>`;
  const cols  = d.columns||[];
  const cbHead = `<th style="width:32px;text-align:center;"><input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this)" title="Select all"></th>`;
  const heads = cbHead + cols.map(c=>`<th class="sortable" onclick="sortTable(this,'${c.replace(/'/g,"\\'")}')">${c}</th>`).join("") + `<th style="width:80px"></th>`;
  // store data globally for sorting
  window._browseData = {cols: cols, records: d.records, count: d.count, total: d.total, total_fmt: d.total_fmt, start: d.start, end: d.end, time_label: d.time_label, filters: d.filters};
  const rows  = d.records.map((r, idx) => {
    const cells = cols.map(c => {
      const rk = Object.keys(r).find(k => k.toLowerCase() === c.toLowerCase()) || c;
      return `<td>${r[rk] || ""}</td>`;
    }).join("");
    const cbCell = r._line
      ? `<td style="text-align:center;"><input type="checkbox" class="row-cb"
           data-idx="${idx}" onchange="onRowCheck(this)"></td>`
      : `<td></td>`;
    const acts  = r._line
      ? `<td style="white-space:nowrap;">
           <a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;"
             href="/edit?filepath=${encodeURIComponent(r._filepath)}&lineno=${r._lineno}&line=${encodeURIComponent(r._line)}&return_to=${encodeURIComponent(window.location.pathname)}">✎</a>
           <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);"
             data-row='${JSON.stringify(r)}' onclick="openDeleteRecord(JSON.parse(this.dataset.row))">✕</button>
         </td>`
      : `<td></td>`;
    return `<tr>${cbCell}${cells}${acts}</tr>`;
  }).join("");
  // store records for modal access
  window._browseRecords = d.records;
  document.dispatchEvent(new CustomEvent("browse:results"));
  return `<div class="card">
    ${summaryBar(d)}
    <div style="overflow-x:auto;"><table class="data-table" id="browse-table">
      <thead><tr>${heads}</tr></thead>
      <tbody id="browse-tbody">${rows}</tbody>
    </table></div>
  </div>`;
}

// ── Table column sorting ────────────────────────────────────────────────────
let _sortCol = null;
let _sortAsc = true;

function sortTable(th, col) {
  const data = window._browseData;
  if (!data || !data.records) return;
  
  // toggle direction if same column, otherwise reset to asc
  if (_sortCol === col) {
    _sortAsc = !_sortAsc;
  } else {
    _sortCol = col;
    _sortAsc = true;
  }
  
  // update header styles
  document.querySelectorAll("#browse-table th.sortable").forEach(h => {
    h.classList.remove("sort-asc","sort-desc");
  });
  th.classList.add(_sortAsc ? "sort-asc" : "sort-desc");
  
  // sort records
  const colLower = col.toLowerCase();
  const sorted = [...data.records].sort((a, b) => {
    const ak = Object.keys(a).find(k => k.toLowerCase() === colLower) || col;
    const bk = Object.keys(b).find(k => k.toLowerCase() === colLower) || col;
    let va = a[ak] || "", vb = b[bk] || "";
    // numeric sort
    const na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return _sortAsc ? na - nb : nb - na;
    // date sort (ISO format)
    if (/^\d{4}-\d{2}-\d{2}/.test(va) && /^\d{4}-\d{2}-\d{2}/.test(vb)) {
      return _sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    // string sort
    return _sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  
  // rebuild tbody
  const tbody = document.getElementById("browse-tbody");
  if (!tbody) return;
  const rows = sorted.map((r, idx) => {
    const cells = data.cols.map(c => {
      const rk = Object.keys(r).find(k => k.toLowerCase() === c.toLowerCase()) || c;
      return `<td>${r[rk] || ""}</td>`;
    }).join("");
    const rowIdx = data.records.indexOf(r);
    const cbCell = r._line
      ? `<td style="text-align:center;"><input type="checkbox" class="row-cb"
           data-idx="${idx}" onchange="onRowCheck(this)"></td>`
      : `<td></td>`;
    const acts  = r._line
      ? `<td style="white-space:nowrap;">
           <a class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;"
             href="/edit?filepath=${encodeURIComponent(r._filepath)}&lineno=${r._lineno}&line=${encodeURIComponent(r._line)}&return_to=${encodeURIComponent(window.location.pathname)}">✎</a>
           <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px;color:var(--error);"
             data-row='${JSON.stringify(r)}' onclick="openDeleteRecord(JSON.parse(this.dataset.row))">✕</button>
         </td>`
      : `<td></td>`;
    return `<tr>${cbCell}${cells}${acts}</tr>`;
  }).join("");
  tbody.innerHTML = rows;
  // update modal access
  window._browseRecords = sorted;
}

// ── Delete modal ──────────────────────────────────────────────────────────────
let _editRecord = null;

function openDelete(idx) {
  const r = (window._browseRecords || [])[idx];
  if (!r || !r._line) return;
  openDeleteRecord(r);
}

function openDeleteRecord(r) {
  if (!r || !r._line) return;
  _editRecord = r;
  document.getElementById("del-line").textContent   = r._line;
  document.getElementById("del-msg").style.display  = "none";
  document.getElementById("del-dialog").style.display = "flex";
}

function closeDelete() { document.getElementById("del-dialog").style.display = "none"; }

function doDelete() {
  if (!_editRecord) return;
  const msg = document.getElementById("del-msg");
  fetch("/api/records/delete", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      filepath: _editRecord._filepath,
      old_line: _editRecord._line,
      lineno:   _editRecord._lineno
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) { closeDelete(); runBrowse(); }
    else { msg.textContent = d.error; msg.style.display = "block"; }
  })
  .catch(e => { msg.textContent = String(e); msg.style.display = "block"; });
}


// ── Save as Query ─────────────────────────────────────────────────────────────
function showSaveQuery() {
  const p = _params();
  const msg = document.getElementById("query-msg");
  msg.style.display = "none";
  document.getElementById("query-name-input").value = "";

  // build unified expression preview — expr is now always the single source of truth
  const exprPreview = p.expr || "";

  const previewLines = [];
  if (exprPreview) previewLines.push(`where = "${exprPreview}"`);
  previewLines.push(`time  = "${p.time}"`);
  if (p.group)  previewLines.push(`group = ["${p.group}"]`);
  if (p.sort)  previewLines.push(`sort = "${p.sort}"`);
  if (p.search) previewLines.push(`search = "${p.search}"`);
  document.getElementById("query-preview").textContent = previewLines.join("\n");

  const dlg = document.getElementById("query-dialog");
  dlg.style.display = "flex";
  document.getElementById("query-name-input").focus();
}

function hideQueryDialog() {
  document.getElementById("query-dialog").style.display = "none";
}

function doSaveQuery() {
  const name = document.getElementById("query-name-input").value.trim();
  const msg  = document.getElementById("query-msg");
  if (!name) { msg.textContent = "Enter a name."; msg.style.display="block"; return; }
  const p = _params();
  fetch("/api/save_query", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, where: p.where, expr: p.expr, time: p.time,
                          group: p.group, search: p.search, sort: p.sort})
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      hideQueryDialog();
      const btn = document.querySelector('[onclick="showSaveQuery()"]');
      btn.textContent = `✔ Saved as '${d.name}'`;
      btn.style.background = "var(--success)";
      setTimeout(() => { btn.textContent = "💾 Save as Query"; btn.style.background = ""; }, 3000);
    } else {
      msg.textContent = d.error;
      msg.style.display = "block";
    }
  })
  .catch(e => { msg.textContent = String(e); msg.style.display="block"; });
}

document.getElementById("query-dialog").addEventListener("click", function(e) {
  if (e.target === this) hideQueryDialog();
});
document.getElementById("query-name-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSaveQuery();
  if (e.key === "Escape") hideQueryDialog();
});
document.getElementById("del-dialog").addEventListener("click", function(e) {
  if (e.target === this) closeDelete();
});
</script>
<script>
// ── Bulk selection ────────────────────────────────────────────────────────────
var _selected = new Set(); // indices into window._browseRecords

function onRowCheck(cb) {
  const idx = parseInt(cb.dataset.idx);
  if (cb.checked) _selected.add(idx);
  else             _selected.delete(idx);
  updateBulkBar();
}

function toggleSelectAll(cb) {
  const boxes = document.querySelectorAll(".row-cb");
  _selected.clear();
  boxes.forEach(function(box) {
    box.checked = cb.checked;
    if (cb.checked) _selected.add(parseInt(box.dataset.idx));
  });
  updateBulkBar();
}

function clearSelection() {
  _selected.clear();
  document.querySelectorAll(".row-cb").forEach(function(b) { b.checked = false; });
  const sa = document.getElementById("select-all-cb");
  if (sa) sa.checked = false;
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById("bulk-bar");
  const cnt = document.getElementById("bulk-count");
  if (_selected.size > 0) {
    cnt.textContent = _selected.size + " selected";
    bar.style.display = "flex";
  } else {
    bar.style.display = "none";
  }
}

function _selectedRecords() {
  const recs = window._browseRecords || [];
  return [..._selected].map(function(i) { return recs[i]; }).filter(Boolean);
}

// ── Bulk delete ───────────────────────────────────────────────────────────────
function bulkDeleteOpen() {
  const n = _selected.size;
  if (!n) return;
  document.getElementById("bulk-del-msg-top").textContent =
    "Delete " + n + " record" + (n > 1 ? "s" : "") + "? This cannot be undone (backup is kept).";
  document.getElementById("bulk-del-msg").style.display = "none";
  document.getElementById("bulk-del-dialog").style.display = "flex";
}

function bulkDeleteConfirm() {
  const records = _selectedRecords().map(function(r) {
    return { filepath: r._filepath, line: r._line, lineno: r._lineno };
  });
  const msg = document.getElementById("bulk-del-msg");
  fetch("/api/records/bulk_delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ records: records })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) {
      document.getElementById("bulk-del-dialog").style.display = "none";
      clearSelection();
      runBrowse();
    } else {
      msg.textContent = d.error || "Delete failed";
      msg.style.display = "block";
    }
  })
  .catch(function(e) {
    msg.textContent = String(e);
    msg.style.display = "block";
  });
}

// ── Bulk set ──────────────────────────────────────────────────────────────────
function bulkSetOpen() {
  if (!_selected.size) return;
  document.getElementById("bulk-set-field").value  = "";
  document.getElementById("bulk-set-value").value  = "";
  document.getElementById("bulk-set-preview").style.display = "none";
  document.getElementById("bulk-set-msg").style.display    = "none";
  document.getElementById("bulk-set-dialog").style.display = "flex";
  document.getElementById("bulk-set-field").focus();
}

// Show preview as field=value is typed
["bulk-set-field", "bulk-set-value"].forEach(function(id) {
  document.addEventListener("DOMContentLoaded", function() {
    var el = document.getElementById(id);
    if (el) el.addEventListener("input", function() {
      var f = document.getElementById("bulk-set-field").value.trim();
      var v = document.getElementById("bulk-set-value").value.trim();
      var preview = document.getElementById("bulk-set-preview");
      if (f && v) {
        preview.textContent = "Will apply: " + f + "=" + v +
          " to " + _selected.size + " record" + (_selected.size > 1 ? "s" : "");
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    });
  });
});

function bulkSetConfirm() {
  const field = document.getElementById("bulk-set-field").value.trim();
  const value = document.getElementById("bulk-set-value").value.trim();
  const msg   = document.getElementById("bulk-set-msg");
  if (!field || !value) {
    msg.textContent = "Field and value are required";
    msg.style.display = "block";
    return;
  }
  const records = _selectedRecords().map(function(r) {
    return { filepath: r._filepath, line: r._line, lineno: r._lineno };
  });
  fetch("/api/records/bulk_set", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ records: records, set_args: [field + "=" + value] })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) {
      document.getElementById("bulk-set-dialog").style.display = "none";
      clearSelection();
      runBrowse();
    } else {
      msg.textContent = d.error || "Set failed";
      msg.style.display = "block";
    }
  })
  .catch(function(e) {
    msg.textContent = String(e);
    msg.style.display = "block";
  });
}

// Clear selection when browse results are refreshed
const _origRunBrowse = typeof runBrowse === "function" ? runBrowse : null;

// Reset selection state when new results arrive
document.addEventListener("browse:results", function() { clearSelection(); });

// ── End Bulk selection ────────────────────────────────────────────────────────
</script>
