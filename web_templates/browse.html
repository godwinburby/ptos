{% extends "base.html" %}
{% block content %}

<style>
  .qb-chip {
    display:inline-flex;align-items:center;gap:4px;padding:6px 12px;
    border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    transition:all .15s;margin:3px;
  }
  .qb-chip:hover    { border-color:var(--accent);color:var(--accent); }
  .qb-chip.active   { background:var(--accent);border-color:var(--accent);color:#fff; }
  .qb-chip.selected { background:var(--accent-lt);border-color:var(--accent);color:var(--accent); }
  .qb-active-chip {
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
    border-radius:20px;font-size:13px;font-weight:600;margin:3px;
    background:var(--accent-lt);border:1.5px solid var(--accent);color:var(--accent);
  }
  .qb-active-chip button { background:none;border:none;color:var(--accent);
    cursor:pointer;font-size:14px;padding:0;line-height:1;font-weight:700; }
</style>

<div class="page-title">Browse</div>

<div class="card">
  <!-- ── FilterBuilder ── -->
  <div id="browse-filter" style="margin-bottom:12px;"></div>

  <!-- ── Time and Group ── -->
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Time</label>
      <select id="b-time-select" onchange="onBTimeChange(this.value)">
        {% for label, code in time_options %}
        <option value="{{ code }}" {% if code == current_time %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    {% with prefix="b-" %}
    {% include "_time_picker.html" %}
    {% endwith %}
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Group by</label>
      <select id="b-group" onchange="runBrowse()"><option value="">— select —</option></select>
    </div>
    <div class="field-group" style="flex:1;min-width:140px;">
      <label>Sort by</label>
      <select id="b-sort" onchange="runBrowse()">
        <option value="">— select —</option>
      </select>
    </div>
  </div>

  <!-- ── Search ── -->
  <div class="field-group" style="margin-bottom:12px;">
    <label>Search</label>
    <input type="text" id="b-search" placeholder="full-text search…"
           oninput="debouncedBrowse()">
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-primary btn-sm" onclick="showSaveQuery()">💾 Save as Query</button>
    <button class="btn btn-ghost btn-sm" onclick="clearBrowse()">✕ Clear</button>
  </div>
</div>

<!-- Save as Query dialog -->
<div id="query-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
     z-index:500;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;padding:24px;width:320px;
              box-shadow:0 8px 32px rgba(0,0,0,.18);">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px;">Save as Query</div>
    <div class="field-group">
      <label>Query name</label>
      <input type="text" id="query-name-input" placeholder="e.g. my_expenses"
             style="text-transform:lowercase;"
             oninput="this.value=this.value.replace(/[^a-z0-9_]/g,'')">
      <div class="hint">lowercase letters, numbers, underscores</div>
    </div>
    <div id="query-preview" style="font-size:12px;color:var(--sub);
         background:var(--bg);padding:8px;border-radius:6px;
         margin-bottom:10px;font-family:monospace;word-break:break-all;"></div>
    <div id="query-msg" style="font-size:13px;color:var(--error);margin-bottom:10px;display:none;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1" onclick="doSaveQuery()">Save</button>
      <button class="btn btn-ghost"   style="flex:1" onclick="hideQueryDialog()">Cancel</button>
    </div>
  </div>
</div>

<div id="result-area"></div>

<!-- Modals injected by RecordTable -->

<script src="{{ av('/static/js/record_table.js') }}"></script>
<script src="{{ av('/static/js/browse_controller.js') }}"></script>
<script>
  window.BROWSE_DATA = {
    types: {{ types | tojson }},
    fieldTypes: {{ field_types | tojson }},
    globalDims: {{ group_dimensions | tojson }},
    yearRange: {{ year_range | tojson }},
    currentTime: {{ current_time | tojson }},
    customTime: {{ custom_time | tojson }},
    fromDate: {{ from_date | tojson }},
    toDate: {{ to_date | tojson }}
  };
  document.addEventListener("DOMContentLoaded", function() {
    window.BrowseController.init(window.BROWSE_DATA);
  });
</script>

{% block scripts %}
<script src="{{ av('/static/js/filter_builder.js') }}"></script>
<script src="{{ av('/static/js/time_picker.js') }}"></script>
{% endblock %}
{% endblock %}
