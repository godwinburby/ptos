{% extends "base.html" %}
{% block content %}

<div class="page-title">Browse</div>

<div class="card">
  <div class="field-group">
    <label>Type</label>
    <select id="b-type" onchange="onTypeChange()">
      <option value="">All types</option>
      {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
  </div>

  <div class="field-row-2">
    <div class="field-group">
      <label>Time</label>
      <select id="b-time">
        {% for label, code in time_options %}
        <option value="{{ code }}" {% if code=='tm' %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field-group">
      <label>Group by</label>
      <select id="b-group">
        <option value="">(none)</option>
      </select>
    </div>
  </div>

  <div class="field-group">
    <label>Search</label>
    <input type="text" id="b-search" placeholder="full-text search…"
           onkeydown="if(event.key==='Enter') runBrowse()">
  </div>

  <!-- dynamic field filters -->
  <div id="field-filters" style="display:none;"></div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-primary btn-sm" onclick="runBrowse()" id="run-btn">⟳ Search</button>
    <button class="btn btn-success btn-sm" onclick="exportCSV()">↓ CSV</button>
    <button class="btn btn-ghost btn-sm"   onclick="clearBrowse()">✕ Clear</button>
  </div>
</div>

<div class="card" style="padding:0;">
  <pre class="output" id="output" style="border-radius:12px;min-height:100px;">Set filters and press Search.</pre>
</div>

<script>
function onTypeChange() {
  const type = document.getElementById("b-type").value;
  const ff   = document.getElementById("field-filters");
  const grp  = document.getElementById("b-group");
  grp.innerHTML = '<option value="">(none)</option>';
  ff.innerHTML  = ""; ff.style.display = "none";
  if (!type) return;

  fetch("/api/type_fields/" + encodeURIComponent(type))
  .then(r => r.json())
  .then(data => {
    (data.dimensions || []).forEach(f => {
      const o = document.createElement("option");
      o.value = f; o.textContent = f; grp.appendChild(o);
    });
    (data.fields || []).forEach(f => {
      if (!f.options || !f.options.length) return;
      const wrap = document.createElement("div");
      wrap.className = "field-group";
      wrap.innerHTML = `<label>${f.name}</label>
        <select id="ff-${f.name}">
          <option value="">(any)</option>
          ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
        </select>`;
      ff.appendChild(wrap);
    });
    ff.style.display = ff.children.length ? "block" : "none";
  });
}

function _params() {
  const type   = document.getElementById("b-type").value;
  const time   = document.getElementById("b-time").value;
  const search = document.getElementById("b-search").value.trim();
  const group  = document.getElementById("b-group").value;
  const where  = [];
  if (type) where.push("type=" + type);
  document.querySelectorAll("[id^='ff-']").forEach(sel => {
    if (sel.value) where.push(sel.id.replace("ff-","") + "=" + sel.value);
  });
  return {where, time, search, group};
}

function runBrowse() {
  const out = document.getElementById("output");
  const btn = document.getElementById("run-btn");
  btn.disabled = true; btn.textContent = "Loading…";
  out.textContent = "Loading…";

  fetch("/browse/run", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(_params())
  })
  .then(r => r.json())
  .then(d => {
    out.textContent = d.result || d.error || "(no results)";
    btn.disabled = false; btn.textContent = "⟳ Search";
  })
  .catch(e => {
    out.textContent = "Error: " + e;
    btn.disabled = false; btn.textContent = "⟳ Search";
  });
}

function exportCSV() {
  const form  = document.createElement("form");
  form.method = "POST"; form.action = "/browse/export";
  const inp   = document.createElement("input");
  inp.type = "hidden"; inp.name = "params";
  inp.value = JSON.stringify(_params());
  form.appendChild(inp);
  document.body.appendChild(form); form.submit();
  document.body.removeChild(form);
}

function clearBrowse() {
  ["b-type","b-time","b-search","b-group"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = id === "b-time" ? "tm" : "";
  });
  document.getElementById("field-filters").innerHTML = "";
  document.getElementById("field-filters").style.display = "none";
  document.getElementById("output").textContent = "Set filters and press Search.";
}
</script>
{% endblock %}
